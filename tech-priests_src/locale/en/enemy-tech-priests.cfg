[mod-setting-description]
tech-priests-enemy-planetary-spawning=Seed hostile colonies with bound priests, machinery, supplies, defenses and small ore patches during exploration. Colonies use normal priest planning and research for their planetary force. More common on Fulgora and Vulcanus. Respects peaceful mode and player bases. Disabling stops new placement; existing colonies remain.
tech-priests-enemy-research-announcements=Announce completed enemy colony research as intercepted noospheric transmissions. All technologies is the default. Major discoveries includes automation tiers, science packs, planet discoveries and selected major military, energy and space technologies. Only hostile connected players receive messages. Initial scripted technology grants are silent; no old messages are replayed after loading.

tech-priests-enemy-allowed-planets=Comma-separated internal planet names. Default: nauvis,fulgora,vulcanus,gleba. Blank disables new seeding. Additional planets may be listed, but their terrain and environment must support the colony. Existing colonies remain when removed from this list.
tech-priests-enemy-max-priests=Limits all renegade priest bindings, including normal colony expansion. 0 means unlimited. Each new colony needs three free slots. Existing bindings reserve their slots during priest recovery. Lowering the limit does not remove existing priests; friendly forces are unaffected.
tech-priests-enemy-max-priests-per-planet=Same priest limit for each planet's renegade force. 0 means unlimited. Existing priests remain. Newly built stations cannot bind additional priests while at the limit.
tech-priests-enemy-max-colonies=Maximum active seeded colonies across all planets. 0 means unlimited. A colony counts while at least one original station survives. Destroying all original stations frees a colony slot; its old site stays cleared.
tech-priests-enemy-max-colonies-per-planet=Maximum active seeded colonies for each planet's renegade force. 0 means unlimited. This controls new colony seeding, not normal construction inside an existing colony.
tech-priests-enemy-priority-spacing=One candidate colony site per square region of this many chunks on Fulgora and Vulcanus. Each chunk is 32 tiles wide. Larger values mean fewer candidates. Terrain and separation checks can reject a candidate. Changes affect future candidates only.
tech-priests-enemy-other-spacing=Candidate spacing for other allowed planets, in chunks. Larger values mean fewer candidates. Changes affect future candidates only.
tech-priests-enemy-spawn-clearance=New colonies must be this far from the map origin and player-force spawn positions. Existing colonies are not moved.
tech-priests-enemy-base-clearance=Minimum distance from new colony centers to entities owned by player or other non-native forces. Existing colonies are not moved.
tech-priests-enemy-colony-clearance=Minimum distance to another Planetary Magos station when seeding a new colony. Does not constrain normal priest construction.
tech-priests-enemy-starter-stock-multiplier=Scales finite supplies for newly seeded colonies. No existing inventory is changed and no recurring refills are added. Machinery counts and three starting priest bindings remain unchanged.
tech-priests-enemy-ore-per-tile=Amount in each of the 36 resource tiles authored for a new colony. Existing patches are not changed.
tech-priests-enemy-respect-peaceful=When enabled, new colonies cannot seed on peaceful surfaces. Disabling permits seeding there but does not change the surface's peaceful-mode rules. Existing colonies remain.

