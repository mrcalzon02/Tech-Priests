[entity-name]
mars-plasma-reactor-minoris=Minoris plasma reactor
mars-plasma-reactor-majoris=Majoris plasma reactor
mars-plasma-reactor-maximus=Maximus plasma reactor

[entity-description]
mars-plasma-reactor-minoris=Single-circuit plasma reactor. Requires sealed metallicized hydrogen fuel canisters. Normal output is 1 MW. Can be built on a Space Age platform.
mars-plasma-reactor-majoris=Twin-circuit plasma reactor. Requires sealed metallicized hydrogen fuel canisters. Normal output is 2 MW. Can be built on a Space Age platform.
mars-plasma-reactor-maximus=Triple-circuit plasma reactor. Requires sealed metallicized hydrogen fuel canisters. Normal output is 4 MW. Can be built on a Space Age platform.

[fuel-category-name]
tp-metallicized-hydrogen=Metallicized hydrogen

[item-description]
tp-mh7-contained-metallicized-pellet=A plasma reactor consumes the pellet and its pressure shell for 3 GJ. Sealing pauses decay and gives the canister the lower quality of its two inputs. Unsealing returns both at their original grades and resumes the pellet's remaining lifetime at its stored integrity.

[mod-setting-name]
tech-priests-reactor-sprite-resolution=Plasma reactor sprite resolution

[mod-setting-description]
tech-priests-reactor-sprite-resolution=Selects the artwork for all three plasma reactors. Standard resolution uses less graphics memory.

[string-mod-setting]
tech-priests-reactor-sprite-resolution-hr=High resolution (64 pixels per tile)
tech-priests-reactor-sprite-resolution-sd=Standard resolution (32 pixels per tile)
