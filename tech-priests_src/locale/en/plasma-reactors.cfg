[entity-description]
mars-plasma-reactor-minoris=Single-circuit plasma reactor. Burns sealed metallicized hydrogen pellets or chemical fuel to supply up to 1 MW.
mars-plasma-reactor-majoris=Twin-circuit plasma reactor. Burns sealed metallicized hydrogen pellets or chemical fuel to supply up to 2 MW.
mars-plasma-reactor-maximus=Triple-circuit plasma reactor. Burns sealed metallicized hydrogen pellets or chemical fuel to supply up to 4 MW.

[fuel-category-name]
tp-metallicized-hydrogen=Metallicized hydrogen

[item-description]
tp-mh7-contained-metallicized-pellet=Containment preserves the pellet's remaining lifetime, integrity and quality. A plasma reactor consumes the pellet and its pressure shell to produce electricity.

