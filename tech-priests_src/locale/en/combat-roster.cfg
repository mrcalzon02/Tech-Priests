[technology-description]
tech-priests-enginseer-initiation=Train axe-wielding combat Enginseers and manufacture induction charges at the Martian Manufactorum.
tech-priests-officer-corps=Train Imperial Officers armed with laspistols at the Guard Muster Hall.
tech-priests-bolt-armaments=Manufacture bolt weapons and their shared physical magazines.
tech-priests-commissariat=Train Lord Commissars armed with bolt pistols at the Guard Muster Hall.
tech-priests-radium-armaments=Manufacture radium weapons and sealed radium magazines.
tech-priests-vanguard-cohorts=Train Skitarii Vanguard armed with radium carbines at the Martian Manufactorum.
tech-priests-skitarii-command=Train Skitarii Marshals armed with radium serpentas.
tech-priests-cybernetica-protocols=Train Cybernetica Datasmiths and manufacture gamma pistols and cells.
tech-priests-sacred-liturgies=Train staff-wielding Dialogus at the Sororitas Convent. Their melee attacks consume induction charges.
tech-priests-canoness-command=Train Canonesses with condemnor boltguns using standard bolt fire and magazines.
tech-priests-galvanic-mastery=Train Manipulus and manufacture magnarail lances and slug packs.
tech-priests-dominus-ascension=Train Dominus and manufacture volkite blasters and finite power cells.
tech-priests-heavy-servitor-chassis=Produce Kataphron Breachers with heavy arc rifles and arc cells.
tech-priests-grav-annihilation=Produce late-game Kataphron Destroyers with heavy grav-cannons and graviton charges.
