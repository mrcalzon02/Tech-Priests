[entity-description]
tech-priests-voidship-macro-cannon=Load artillery shells and aim with /tp-voidship-aim. Use /tp-macro-fire with a hostile platform name or #surface number. Append @x,y to target a deck cell. Enter asteroid to engage a nearby asteroid.
tech-priests-voidship-lance-battery=Charges from the platform grid. Use /tp-voidship-fire with a hostile platform name or enter asteroid to charge and track a nearby asteroid.
tech-priests-voidship-prow-launcher=Load Censer plasma torpedoes into platform hub cargo. Use /tp-voidship-fire with a hostile platform and optional @x,y cell. Enter asteroid to engage an asteroid within the forward arc.
tech-priests-voidship-void-shield=Shields structures throughout the platform. Each projector draws 100 kW to hold charge and stores 5% of additional power. The field decays when upkeep power falls short.

