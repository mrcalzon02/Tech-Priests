[mod-setting-name]
tech-priests-graphics-quality=Graphics pack quality

[mod-setting-description]
tech-priests-graphics-quality=Standard uses the reduced graphics included in the main download. Automatic and High use matching optional HD packs when installed. Missing or outdated HD packs fall back to Standard. Changes require a restart.

[string-mod-setting]
tech-priests-graphics-quality-auto=Automatic (installed HD packs)
tech-priests-graphics-quality-standard=Standard (reduced memory)
tech-priests-graphics-quality-high=High (optional HD packs)
