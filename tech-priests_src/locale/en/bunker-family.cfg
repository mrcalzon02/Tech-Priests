[entity-description]
tech-priests-bunker-twin-cannon=Two independently recoiling cannons alternate every 0.75 seconds. Load cannon shells to engage heavy armour and penetrate enemy lines, or explosive shells for blast damage. Uses ordinary cannon ammunition. Minimum range: 8 tiles.
tech-priests-bunker-chicago-piano=Four staggered shots at submachine-gun cadence, followed by a half-second recycle. Uses ordinary bullet magazines. Fixed bunker base; independently traversing quad mount.
tech-priests-bunker-twin-minigun=Two rotary guns fire together at standard gun-turret cadence. Each pulse consumes two rounds and deals twice the standard turret's damage. Uses ordinary bullet magazines.
tech-priests-bunker-lobber=Six-station grenade emplacement. Fires every 80 ticks. Load grenade packs: six grenades of one type and two steel plates make one six-round pack. Original grenade effects are preserved. Minimum range: 6 tiles.
tech-priests-bunker-energy-dish=Snap, crackle, ZAP. An 800 kJ electrical discharge followed by a two-second charge cycle. Requires electricity. Prototype balance.
[item-name]
tech-priests-lobber-grenade-magazine=Grenade lobber pack (6 rounds)
[item-description]
tech-priests-lobber-grenade-pack=Six grenades of one type in a steel carrier. Six shots per pack; one round is consumed per shot. Craft with six grenades and two steel plates.
