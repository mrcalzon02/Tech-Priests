name: Repair planning transcription

on:
  push:
    paths:
      - .github/workflows/repair-planning-transcription.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair exact transcription defect
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tech-priests_src/scripts/core/planning_constraints_0646.lua')
          text = path.read_text(encoding='utf-8')
          old = '    if name == item_name then return true end\nn  end\n'
          new = '    if name == item_name then return true end\n  end\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact defect, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          text = Path('tech-priests_src/scripts/core/planning_constraints_0646.lua').read_text()
          assert 'n  end' not in text
          assert text.count('{ module = "scripts.core.') == 35
          assert text.count('["scripts.core.') == 20
          assert '"scripts.core.roboport_repair_pack_logistics_0715",\n  },\n  repair' in text
          PY
          rm .github/workflows/repair-planning-transcription.yml
          git diff --check
      - name: Commit exact repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tech-priests_src/scripts/core/planning_constraints_0646.lua .github/workflows/repair-planning-transcription.yml
          git commit -m "Repair planning transcription and remove one-shot workflow"
          git push origin HEAD:main
