name: Generated command closure validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Inspect direct event and timer route ownership
        shell: bash
        run: python3 .github/scripts/inspect_direct_routes_0794_temp.py

      - name: Retain direct route ownership inventory
        uses: actions/upload-artifact@v4
        with:
          name: direct-route-ownership-0794
          path: /tmp/direct-route-ownership-0794.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish generated command closure validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-command-closure',
              description: passed ? 'Temporary direct route inspection passed' : 'Temporary direct route inspection failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
