name: Generated command closure validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded 0805 frequent-route consolidation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_0805.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          CRAFT = ROOT / 'tech-priests_src/scripts/core/crafting_executor.lua'
          GOVERNOR = ROOT / 'tech-priests_src/scripts/core/overhead_status_governor_0471.lua'
          AUTHORITY = ROOT / 'tech-priests_src/scripts/core/overhead_text_authority_0473.lua'
          INTEGRATION = ROOT / 'tools/check_development_integration_0732.py'
          CHECKER = ROOT / 'tools/check_frequent_route_ownership_0805.py'
          TESTING = ROOT / 'tech-priests_src/docs/CURRENT_TESTING_GOALS.md'
          AUTHORITY_MAP = ROOT / 'docs/RECOVERY_AUTHORITY_MAP_CURRENT.md'
          HISTORY = ROOT / 'docs/DEVELOPMENT_HISTORY.md'

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.write_text(text, encoding='utf-8')

          craft = read(CRAFT)
          direct_command = '''      if _G.tech_priests_route_ground_command_0429 then
                  local ok_route, res = pcall(_G.tech_priests_route_ground_command_0429, pair.priest, command, reason or "crafting-executor-fallback-0616", { pair = pair, priority = 65, ttl = 600 })
                  ok = ok_route and res ~= false
                else
                  ok = pcall(function() pair.priest.set_command(command) end)
                end'''
          routed_only = '''      if _G.tech_priests_route_ground_command_0429 then
                  local ok_route, res = pcall(_G.tech_priests_route_ground_command_0429, pair.priest, command, reason or "crafting-executor-fallback-0616", { pair = pair, priority = 65, ttl = 600 })
                  ok = ok_route and res ~= false
                else
                  ok = false
                end'''
          if direct_command not in craft:
              raise SystemExit('crafting direct-command anchor missing')
          craft = craft.replace(direct_command, routed_only, 1)
          craft_install = '''function Craft.install()
            ensure_root()
            if Craft.installed_0507 then return true end
            Craft.installed_0507 = true
            Craft.tune_timings()
            Craft.wrap_legacy()
            Craft.commands()
            local R = rawget(_G, "TechPriestsRuntimeEventRegistry")
            if R and type(R.on_nth_tick) == "function" then
              R.on_nth_tick(17, Craft.pulse, { owner = "crafting_executor", category = "crafting", note = "single owned timed station crafting pulse", priority = "normal" })
            elseif script and script.on_nth_tick then
              script.on_nth_tick(17, Craft.pulse)
            end
            if log then log("[Tech-Priests 0.1.507] station-anchored crafting executor installed once via runtime registry") end
            return true
          end'''
          craft_replacement = '''function Craft.install()
            if Craft.installed_0507 then return true end
            local registry = rawget(_G, "TechPriestsRuntimeEventRegistry")
            if not registry then
              local ok, found = pcall(require, "scripts.core.runtime_event_registry")
              if ok then registry = found end
            end
            if not (registry and type(registry.on_nth_tick) == "function") then
              if log then log("[Tech-Priests 0.1.507] crafting executor not installed: runtime event registry unavailable") end
              return false
            end
            local cadence = registry.on_nth_tick(17, Craft.pulse, {
              owner = "crafting_executor",
              route = "station-crafting-service",
              category = "crafting",
              note = "single owned timed station crafting pulse",
              priority = "normal"
            })
            if not cadence then
              if log then log("[Tech-Priests 0.1.507] crafting executor not installed: cadence registration failed") end
              return false
            end
            ensure_root()
            Craft.tune_timings()
            Craft.wrap_legacy()
            Craft.commands()
            Craft.installed_0507 = true
            if log then log("[Tech-Priests 0.1.507] station-anchored crafting executor installed once via runtime registry") end
            return true
          end'''
          if craft_install not in craft:
              raise SystemExit('crafting install anchor missing')
          craft = craft.replace(craft_install, craft_replacement, 1)
          write(CRAFT, craft)

          governor = read(GOVERNOR)
          governor_anchor = '''function M.install()
            _G.TECH_PRIESTS_OVERHEAD_STATUS_GOVERNOR_0471 = M'''
          governor_prefix = '''function M.install()
            if M.installed then return true end
            local registry = rawget(_G, "TechPriestsRuntimeEventRegistry")
            if not registry then
              local ok, found = pcall(require, "scripts.core.runtime_event_registry")
              if ok then registry = found end
            end
            if not (registry and type(registry.on_nth_tick) == "function") then
              if log then log("[Tech-Priests 0.1.473] overhead status governor not installed: runtime event registry unavailable") end
              return false
            end
            local cadence = registry.on_nth_tick(M.update_interval, function() M.update_all() end, {
              owner = "overhead_status_governor_0471",
              route = "overhead-status-service",
              category = "visuals",
              priority = "normal"
            })
            if not cadence then
              if log then log("[Tech-Priests 0.1.473] overhead status governor not installed: cadence registration failed") end
              return false
            end
            ensure_root()
            _G.TECH_PRIESTS_OVERHEAD_STATUS_GOVERNOR_0471 = M'''
          if governor_anchor not in governor:
              raise SystemExit('governor install anchor missing')
          governor = governor.replace(governor_anchor, governor_prefix, 1)
          old_governor_route = '''  if TechPriestsRuntimeEventRegistry and TechPriestsRuntimeEventRegistry.on_nth_tick then
              TechPriestsRuntimeEventRegistry.on_nth_tick(M.update_interval, function() M.update_all() end, { owner = "overhead_status_governor_0471", category = "visuals" })
            elseif script and script.on_nth_tick then
              pcall(function() script.on_nth_tick(M.update_interval, M.update_all) end)
            end
          '''
          if old_governor_route not in governor:
              raise SystemExit('governor legacy route anchor missing')
          governor = governor.replace(old_governor_route, '', 1)
          governor_log = '  if log then log("[Tech-Priests 0.1.473] canonical one-slot overhead status governor installed") end'
          if governor_log not in governor:
              raise SystemExit('governor publication anchor missing')
          governor = governor.replace(governor_log, '  M.installed = true\n' + governor_log, 1)
          write(GOVERNOR, governor)

          authority = read(AUTHORITY)
          pending = '''  -- Fallback for very early load windows: store intent only. The 0471 periodic
            -- governor will draw on its next service if available.
            pair.overhead_status_0473_pending = { text = text, color = color, ttl = ttl, scale = scale, source = source, tick = now() }
            root.stats.pending = (root.stats.pending or 0) + 1
            return true'''
          if pending not in authority:
              raise SystemExit('0473 pending fallback anchor missing')
          authority = authority.replace(pending, '  return false', 1)
          authority, removed = re.subn(
              r'\nfunction M\.update_all\(\)\n.*?\nend\n\nfunction M\.install\(\)',
              '\nfunction M.install()',
              authority,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f'expected one 0473 update loop, removed {removed}')
          authority_anchor = '''function M.install()
            ensure_root()'''
          authority_prefix = '''function M.install()
            if M.installed then return true end
            local governor = rawget(_G, "TECH_PRIESTS_OVERHEAD_STATUS_GOVERNOR_0471")
            if not (governor and governor.set and governor.clear) then
              if log then log("[Tech-Priests 0.1.473] overhead text authority not installed: canonical governor unavailable") end
              return false
            end
            ensure_root()'''
          if authority_anchor not in authority:
              raise SystemExit('0473 install anchor missing')
          authority = authority.replace(authority_anchor, authority_prefix, 1)
          old_authority_route = '''  if script and script.on_nth_tick then
              if TechPriestsRuntimeEventRegistry and TechPriestsRuntimeEventRegistry.on_nth_tick then
                TechPriestsRuntimeEventRegistry.on_nth_tick(17, M.update_all, { owner = "overhead-text-authority-0473", category = "visuals" })
              else
                pcall(function() script.on_nth_tick(17, M.update_all) end)
              end
            end

          '''
          if old_authority_route not in authority:
              raise SystemExit('0473 legacy route anchor missing')
          authority = authority.replace(old_authority_route, '', 1)
          authority_log = '  if log then log("[Tech-Priests 0.1.473] single-slot overhead text authority installed") end'
          if authority_log not in authority:
              raise SystemExit('0473 publication anchor missing')
          authority = authority.replace(authority_log, '  M.installed = true\n' + authority_log, 1)
          write(AUTHORITY, authority)

          checker = r'''#!/usr/bin/env python3
          from pathlib import Path
          import re
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          FILES = {
              "crafting": ROOT / "tech-priests_src/scripts/core/crafting_executor.lua",
              "governor": ROOT / "tech-priests_src/scripts/core/overhead_status_governor_0471.lua",
              "authority": ROOT / "tech-priests_src/scripts/core/overhead_text_authority_0473.lua",
          }
          DIRECT = re.compile(r"\bscript\.on_(?:event|nth_tick|init|load|configuration_changed)\s*\(")

          def install(text: str, signature: str, terminal: str) -> str:
              start = text.find(signature)
              end = text.rfind(terminal)
              return text[start:end] if start >= 0 and end > start else ""

          def ordered(block: str, fragments: list[str], label: str, errors: list[str]) -> None:
              positions = [block.find(fragment) for fragment in fragments]
              if any(position < 0 for position in positions):
                  errors.append(f"{label} missing ordered contract: {fragments}")
              elif positions != sorted(positions):
                  errors.append(f"{label} publication order regressed: {fragments}")

          def main() -> int:
              errors: list[str] = []
              text = {name: path.read_text(encoding="utf-8") for name, path in FILES.items()}
              for name, source in text.items():
                  if DIRECT.search(source):
                      errors.append(f"{name} contains a direct runtime route")

              craft = text["crafting"]
              if len(re.findall(r"\bon_nth_tick\s*\(", craft)) != 1:
                  errors.append("crafting must own exactly one registry cadence")
              for fragment in ('route = "station-crafting-service"', 'owner = "crafting_executor"', 'category = "crafting"'):
                  if fragment not in craft:
                      errors.append(f"crafting missing {fragment}")
              if re.search(r"\.set_command\s*\(", craft):
                  errors.append("crafting retains a direct unit-command escape hatch")
              craft_install = install(craft, "function Craft.install()", "return Craft")
              ordered(craft_install, ["local cadence = registry.on_nth_tick", "ensure_root()", "Craft.tune_timings()", "Craft.wrap_legacy()", "Craft.commands()", "Craft.installed_0507 = true"], "crafting", errors)

              governor = text["governor"]
              if len(re.findall(r"\bon_nth_tick\s*\(", governor)) != 1:
                  errors.append("0471 governor must own exactly one cadence")
              for fragment in ('route = "overhead-status-service"', 'owner = "overhead_status_governor_0471"', 'M.installed = true'):
                  if fragment not in governor:
                      errors.append(f"0471 governor missing {fragment}")
              governor_install = install(governor, "function M.install()", "return M")
              ordered(governor_install, ["local cadence = registry.on_nth_tick", "ensure_root()", "_G.TECH_PRIESTS_OVERHEAD_STATUS_GOVERNOR_0471 = M", 'pcall(require, "scripts.core.work_visuals")', "commands.add_command", "M.installed = true"], "0471 governor", errors)

              authority = text["authority"]
              if re.search(r"\bon_nth_tick\s*\(", authority):
                  errors.append("0473 authority must be route-free")
              for forbidden in ("overhead_status_0473_pending", "function M.update_all()"):
                  if forbidden in authority:
                      errors.append(f"0473 authority retains duplicate state/loop: {forbidden}")
              for fragment in ('if not (governor and governor.set and governor.clear) then', 'M.installed = true'):
                  if fragment not in authority:
                      errors.append(f"0473 authority missing {fragment}")
              authority_install = install(authority, "function M.install()", "return M")
              ordered(authority_install, ['local governor = rawget(_G, "TECH_PRIESTS_OVERHEAD_STATUS_GOVERNOR_0471")', "ensure_root()", "_G.TECH_PRIESTS_OVERHEAD_TEXT_AUTHORITY_0473 = M", "commands.add_command", "M.installed = true"], "0473 authority", errors)

              integration = (ROOT / "tools/check_development_integration_0732.py").read_text(encoding="utf-8")
              if '"check_frequent_route_ownership_0805.py",' not in integration:
                  errors.append("development integration graph missing 0805 checker")
              for path, marker in ((ROOT / "tech-priests_src/docs/CURRENT_TESTING_GOALS.md", "Milestone 0805"), (ROOT / "docs/RECOVERY_AUTHORITY_MAP_CURRENT.md", "Milestone 0805"), (ROOT / "docs/DEVELOPMENT_HISTORY.md", "Milestone 0805")):
                  if marker not in path.read_text(encoding="utf-8"):
                      errors.append(f"{path} missing {marker}")
              if errors:
                  print("Frequent-route ownership audit failed:", file=sys.stderr)
                  for error in errors:
                      print(f"- {error}", file=sys.stderr)
                  return 1
              print("Frequent-route ownership audit passed: crafting is registry-owned, 0471 solely owns overhead cadence, and 0473 is route-free.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          CHECKER.write_text(checker, encoding='utf-8')

          integration = read(INTEGRATION)
          checker_line = '"check_frequent_route_ownership_0805.py",'
          if checker_line not in integration:
              anchor = '"check_gui_visual_route_ownership_0804.py",\n}'
              replacement = '"check_gui_visual_route_ownership_0804.py",\n"check_frequent_route_ownership_0805.py",\n}'
              if integration.count(anchor) != 1:
                  raise SystemExit(f'expected one 0804 integration anchor, found {integration.count(anchor)}')
              write(INTEGRATION, integration.replace(anchor, replacement, 1))

          entries = {
              TESTING: '\n\n## Milestone 0805 — Frequent route ownership\n\n- Validate station crafting at the Cogitator Station with the single `station-crafting-service` registry cadence.\n- Confirm crafting movement fails closed when neither canonical movement request nor routed ground command is available.\n- Confirm `overhead_status_governor_0471` is the sole periodic overhead owner and 0473 remains a route-free late compatibility authority.\n- Static validation is not Factorio runtime proof.\n',
              AUTHORITY_MAP: '\n\n## Milestone 0805 — Frequent route ownership\n\n- `crafting_executor.lua`: one fail-closed 17-tick registry cadence; no direct unit-command escape hatch.\n- `overhead_status_governor_0471.lua`: sole periodic overhead display owner through `overhead-status-service`.\n- `overhead_text_authority_0473.lua`: route-free late wrapper authority; duplicate pending loop retired.\n',
              HISTORY: '\n\n## Milestone 0805 — Frequent route ownership\n\nConsolidated the remaining active sub-30-tick fallback authorities. Station crafting now registers its cadence before storage, wrappers, commands, or installed-state publication and no longer calls `LuaEntity.set_command` directly. The 0471 governor exclusively owns periodic overhead refresh, while 0473 is a route-free late compatibility authority with its pending-state loop retired. Added `check_frequent_route_ownership_0805.py`; runtime proof and release authorization remain outstanding.\n',
          }
          for path, entry in entries.items():
              current = read(path)
              if 'Milestone 0805' not in current:
                  write(path, current.rstrip() + entry)
          PY
          python3 /tmp/apply_0805.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/source-validation.yml')
          text = path.read_text(encoding='utf-8')
          checker = '      - name: Audit canonical frequent route ownership\n        run: python3 tools/check_frequent_route_ownership_0805.py\n\n'
          if checker not in text:
              anchor = '      - name: Audit canonical GUI and visual route ownership\n        run: python3 tools/check_gui_visual_route_ownership_0804.py\n\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one 0804 Source-validation anchor, found {text.count(anchor)}')
              path.write_text(text.replace(anchor, anchor + checker, 1), encoding='utf-8')
          PY

      - name: Validate transformed 0805 source
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python3 tools/check_frequent_route_ownership_0805.py
            python3 tools/check_development_integration_0732.py .
            sudo apt-get update -qq
            sudo apt-get install --yes --quiet lua5.2
            luac5.2 -p tech-priests_src/scripts/core/crafting_executor.lua
            luac5.2 -p tech-priests_src/scripts/core/overhead_status_governor_0471.lua
            luac5.2 -p tech-priests_src/scripts/core/overhead_text_authority_0473.lua
            git diff --check
          } 2>&1 | tee /tmp/0805-validation.log

      - name: Retain 0805 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frequent-route-0805-validation
          path: /tmp/0805-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish consolidated 0805 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/source-validation.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-priests_src/scripts/core/crafting_executor.lua \
            tech-priests_src/scripts/core/overhead_status_governor_0471.lua \
            tech-priests_src/scripts/core/overhead_text_authority_0473.lua \
            tools/check_frequent_route_ownership_0805.py \
            tools/check_development_integration_0732.py \
            tech-priests_src/docs/CURRENT_TESTING_GOALS.md \
            docs/RECOVERY_AUTHORITY_MAP_CURRENT.md \
            docs/DEVELOPMENT_HISTORY.md
          git commit -m 'Consolidate frequent route ownership'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Publish generated command closure validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-command-closure',
              description: passed ? '0805 frequent-route carrier passed' : '0805 frequent-route carrier failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
