name: Generated command closure validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded 0806 infrastructure consolidation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_0806.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          MASTER = ROOT / 'tech-priests_src/scripts/core/master_infrastructure_plan_0644.lua'
          GOVERNOR = ROOT / 'tech-priests_src/scripts/core/infrastructure_first_governor_0640.lua'
          INTEGRATION = ROOT / 'tools/check_development_integration_0732.py'
          CHECKER = ROOT / 'tools/check_infrastructure_route_ownership_0806.py'
          TESTING = ROOT / 'tech-priests_src/docs/CURRENT_TESTING_GOALS.md'
          AUTHORITY_MAP = ROOT / 'docs/RECOVERY_AUTHORITY_MAP_CURRENT.md'
          HISTORY = ROOT / 'docs/DEVELOPMENT_HISTORY.md'

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.write_text(text, encoding='utf-8')

          master = read(MASTER)
          master_scan = 'local r = radius_for(pair); local ok, ents = pcall(function() return pair.station.surface.find_entities_filtered({ position = pair.station.position, radius = r, force = pair.station.force }) end)'
          master_scan_replacement = 'local r = radius_for(pair); local ok, ents = pcall(function() return pair.station.surface.find_entities_filtered({ position = pair.station.position, radius = r, force = pair.station.force, type = { "mining-drill", "furnace", "assembling-machine", "container", "logistic-container", "lab" } }) end)'
          if master_scan not in master:
              raise SystemExit('master infrastructure scan anchor missing')
          master = master.replace(master_scan, master_scan_replacement, 1)
          master_install = '''function M.install()
            if M.installed then return true end
            local owner = nil
            local broker = rawget(_G, "TechPriestsRuntimeTickBroker0600")
            if not broker then
              local ok, found = pcall(require, "scripts.core.runtime_tick_broker")
              if ok then broker = found end
            end
            if broker and type(broker.register_service) == "function" then
              local ok, service = pcall(broker.register_service, {
                name = "master_infrastructure_plan_0644",
                category = "diagnostics",
                interval = M.tick_interval,
                priority = 980,
                budget = 8,
                fn = function(event, budget)
                  local acted = M.service_all("broker")
                  return { processed = acted, acted = acted, detail = "station infrastructure survey plan" }
                end,
                note = "station infrastructure survey plan"
              })
              if ok and service then owner = "runtime-tick-broker" end
            end
            if not owner then
              local registry = rawget(_G, "TechPriestsRuntimeEventRegistry")
              if not registry then
                local ok, found = pcall(require, "scripts.core.runtime_event_registry")
                if ok then registry = found end
              end
              if registry and type(registry.on_nth_tick) == "function" then
                local cadence = registry.on_nth_tick(M.tick_interval, function()
                  M.service_all("nth-tick")
                end, {
                  owner = "master_infrastructure_plan_0644",
                  route = "master-infrastructure-plan-fallback",
                  category = "diagnostics",
                  priority = "late"
                })
                if cadence then owner = "runtime-event-registry" end
              end
            end
            if not owner then
              if log then log("[Tech-Priests 0.1.653] master infrastructure planner not installed: broker and registry ownership unavailable") end
              return false
            end
            root()
            _G.TechPriestsMasterInfrastructurePlan0644 = M
            install_bootstrap()
            M.route_owner = owner
            M.installed = true
            if log then log("[Tech-Priests 0.1.653] master infrastructure planner installed via " .. owner) end
            return true
          end'''
          master, replaced = re.subn(r'function M\.install\(\)\n.*?\nend\nreturn M\s*$', master_install + '\nreturn M\n', master, count=1, flags=re.S)
          if replaced != 1:
              raise SystemExit(f'expected one master install block, replaced {replaced}')
          write(MASTER, master)

          governor = read(GOVERNOR)
          governor_scan = 'local ok, ents = pcall(function() return pair.station.surface.find_entities_filtered({ position = pair.station.position, radius = r }) end)'
          governor_scan_replacement = 'local ok, ents = pcall(function() return pair.station.surface.find_entities_filtered({ position = pair.station.position, radius = r, force = pair.station.force, type = { "mining-drill", "furnace", "assembling-machine", "container", "logistic-container", "lab" } }) end)'
          if governor_scan not in governor:
              raise SystemExit('infrastructure-first scan anchor missing')
          governor = governor.replace(governor_scan, governor_scan_replacement, 1)
          governor_install = '''function M.install()
            if M.installed then return true end
            local owner = nil
            local broker = rawget(_G, "TechPriestsRuntimeTickBroker0600")
            if not broker then
              local ok, found = pcall(require, "scripts.core.runtime_tick_broker")
              if ok then broker = found end
            end
            if broker and type(broker.register_service) == "function" then
              local ok, service = pcall(broker.register_service, {
                name = "infrastructure_first_governor_0640",
                category = "emergency",
                interval = M.tick_interval,
                priority = 95,
                budget = 10,
                fn = function(event, budget)
                  local acted = M.service_all("broker")
                  return { processed = acted, acted = acted, detail = "infrastructure-first gate service" }
                end,
                note = "gate high-tier acquisition behind the central Martian bootstrap plan and honest recipe material acquisition"
              })
              if ok and service then owner = "runtime-tick-broker" end
            end
            if not owner then
              local registry = rawget(_G, "TechPriestsRuntimeEventRegistry")
              if not registry then
                local ok, found = pcall(require, "scripts.core.runtime_event_registry")
                if ok then registry = found end
              end
              if registry and type(registry.on_nth_tick) == "function" then
                local cadence = registry.on_nth_tick(M.tick_interval, function()
                  M.service_all("nth-tick")
                end, {
                  owner = "infrastructure_first_governor_0640",
                  route = "infrastructure-first-fallback",
                  category = "emergency",
                  priority = "early"
                })
                if cadence then owner = "runtime-event-registry" end
              end
            end
            if not owner then
              if log then log("[Tech-Priests 0.1.647] infrastructure-first governor not installed: broker and registry ownership unavailable") end
              return false
            end
            root()
            _G.TechPriestsInfrastructureFirstGovernor0640 = M
            install_command()
            M.route_owner = owner
            M.installed = true
            if log then log("[Tech-Priests 0.1.647] infrastructure-first behavior governor installed via " .. owner .. "; central Martian bootstrap and recipe-backed construction requests active") end
            return true
          end'''
          governor, replaced = re.subn(r'function M\.install\(\)\n.*?\nend\n\nreturn M\s*$', governor_install + '\n\nreturn M\n', governor, count=1, flags=re.S)
          if replaced != 1:
              raise SystemExit(f'expected one infrastructure-first install block, replaced {replaced}')
          write(GOVERNOR, governor)

          checker = r'''#!/usr/bin/env python3
          from pathlib import Path
          import re
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          FILES = {
              "master": ROOT / "tech-priests_src/scripts/core/master_infrastructure_plan_0644.lua",
              "governor": ROOT / "tech-priests_src/scripts/core/infrastructure_first_governor_0640.lua",
          }
          DIRECT = re.compile(r"\bscript\.on_(?:event|nth_tick|init|load|configuration_changed)\s*\(")

          def install(text: str) -> str:
              start = text.rfind("function M.install()")
              end = text.rfind("return M")
              return text[start:end] if start >= 0 and end > start else ""

          def ordered(block: str, fragments: list[str], label: str, errors: list[str]) -> None:
              positions = [block.find(fragment) for fragment in fragments]
              if any(position < 0 for position in positions):
                  errors.append(f"{label} missing ordered contract: {fragments}")
              elif positions != sorted(positions):
                  errors.append(f"{label} publication order regressed: {fragments}")

          def main() -> int:
              errors: list[str] = []
              text = {name: path.read_text(encoding="utf-8") for name, path in FILES.items()}
              for name, source in text.items():
                  if DIRECT.search(source):
                      errors.append(f"{name} retains a direct runtime route")
                  if len(re.findall(r"\bregister_service\s*\(", source)) != 1:
                      errors.append(f"{name} must attempt exactly one broker registration")
                  if len(re.findall(r"\bon_nth_tick\s*\(", source)) != 1:
                      errors.append(f"{name} must expose exactly one registry fallback")
                  for fragment in ('type = { "mining-drill", "furnace", "assembling-machine", "container", "logistic-container", "lab" }', 'M.route_owner = owner', 'M.installed = true'):
                      if fragment not in source:
                          errors.append(f"{name} missing {fragment}")

              master = text["master"]
              for fragment in ('name = "master_infrastructure_plan_0644"', 'route = "master-infrastructure-plan-fallback"', 'owner = "master_infrastructure_plan_0644"'):
                  if fragment not in master:
                      errors.append(f"master missing {fragment}")
              ordered(install(master), [
                  "local owner = nil",
                  "broker.register_service",
                  'local registry = rawget(_G, "TechPriestsRuntimeEventRegistry")',
                  "if not owner then\n    if log",
                  "root()",
                  "_G.TechPriestsMasterInfrastructurePlan0644 = M",
                  "install_bootstrap()",
                  "M.route_owner = owner",
                  "M.installed = true",
              ], "master", errors)

              governor = text["governor"]
              for fragment in ('name = "infrastructure_first_governor_0640"', 'route = "infrastructure-first-fallback"', 'owner = "infrastructure_first_governor_0640"', 'force = pair.station.force'):
                  if fragment not in governor:
                      errors.append(f"governor missing {fragment}")
              ordered(install(governor), [
                  "local owner = nil",
                  "broker.register_service",
                  'local registry = rawget(_G, "TechPriestsRuntimeEventRegistry")',
                  "if not owner then\n    if log",
                  "root()",
                  "_G.TechPriestsInfrastructureFirstGovernor0640 = M",
                  "install_command()",
                  "M.route_owner = owner",
                  "M.installed = true",
              ], "governor", errors)

              integration = (ROOT / "tools/check_development_integration_0732.py").read_text(encoding="utf-8")
              if '"check_infrastructure_route_ownership_0806.py",' not in integration:
                  errors.append("development integration graph missing 0806 checker")
              for path, marker in (
                  (ROOT / "tech-priests_src/docs/CURRENT_TESTING_GOALS.md", "Milestone 0806"),
                  (ROOT / "docs/RECOVERY_AUTHORITY_MAP_CURRENT.md", "Milestone 0806"),
                  (ROOT / "docs/DEVELOPMENT_HISTORY.md", "Milestone 0806"),
              ):
                  if marker not in path.read_text(encoding="utf-8"):
                      errors.append(f"{path} missing {marker}")
              if errors:
                  print("Infrastructure route ownership audit failed:", file=sys.stderr)
                  for error in errors:
                      print(f"- {error}", file=sys.stderr)
                  return 1
              print("Infrastructure route ownership audit passed: master planning and infrastructure-first enforcement are broker-first with one bounded registry fallback each.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          CHECKER.write_text(checker, encoding='utf-8')

          integration = read(INTEGRATION)
          checker_line = '"check_infrastructure_route_ownership_0806.py",'
          if checker_line not in integration:
              anchor = '"check_frequent_route_ownership_0805.py",\n}'
              replacement = '"check_frequent_route_ownership_0805.py",\n"check_infrastructure_route_ownership_0806.py",\n}'
              if integration.count(anchor) != 1:
                  raise SystemExit(f'expected one 0805 integration anchor, found {integration.count(anchor)}')
              write(INTEGRATION, integration.replace(anchor, replacement, 1))

          entries = {
              TESTING: '\n\n## Milestone 0806 — Infrastructure route ownership\n\n- Validate master infrastructure survey planning through the runtime tick broker, with the named registry fallback used only when broker registration is unavailable.\n- Validate infrastructure-first enforcement through the same broker-first boundary.\n- Confirm station-local facility scans are force-scoped and limited to infrastructure-relevant entity types.\n- Static validation is not Factorio runtime proof.\n',
              AUTHORITY_MAP: '\n\n## Milestone 0806 — Infrastructure route ownership\n\n- `master_infrastructure_plan_0644.lua`: broker-first station survey planner; one named registry fallback; typed station-local facility scan.\n- `infrastructure_first_governor_0640.lua`: broker-first high-tier gate; one named registry fallback; force-scoped typed facility scan.\n- Storage, globals, child installation, commands, and installed-state publication occur only after route ownership succeeds.\n',
              HISTORY: '\n\n## Milestone 0806 — Infrastructure route ownership\n\nConsolidated master infrastructure planning and infrastructure-first enforcement under broker-first ownership. Both modules now fail over to one named runtime-registry cadence only when broker registration is unavailable, publish state only after an owner succeeds, and use typed station-local facility scans. Added `check_infrastructure_route_ownership_0806.py`; runtime proof and release authorization remain outstanding.\n',
          }
          for path, entry in entries.items():
              current = read(path)
              if 'Milestone 0806' not in current:
                  write(path, current.rstrip() + entry)
          PY
          python3 /tmp/apply_0806.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/source-validation.yml')
          text = path.read_text(encoding='utf-8')
          checker = '      - name: Audit canonical infrastructure route ownership\n        run: python3 tools/check_infrastructure_route_ownership_0806.py\n\n'
          if checker not in text:
              anchor = '      - name: Audit canonical frequent route ownership\n        run: python3 tools/check_frequent_route_ownership_0805.py\n\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one 0805 Source-validation anchor, found {text.count(anchor)}')
              path.write_text(text.replace(anchor, anchor + checker, 1), encoding='utf-8')
          PY

      - name: Validate transformed 0806 source
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python3 tools/check_infrastructure_route_ownership_0806.py
            python3 tools/check_development_integration_0732.py .
            sudo apt-get update -qq
            sudo apt-get install --yes --quiet lua5.2
            luac5.2 -p tech-priests_src/scripts/core/master_infrastructure_plan_0644.lua
            luac5.2 -p tech-priests_src/scripts/core/infrastructure_first_governor_0640.lua
            git diff --check
          } 2>&1 | tee /tmp/0806-validation.log

      - name: Retain 0806 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-route-0806-validation
          path: /tmp/0806-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish consolidated 0806 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/source-validation.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-priests_src/scripts/core/master_infrastructure_plan_0644.lua \
            tech-priests_src/scripts/core/infrastructure_first_governor_0640.lua \
            tools/check_infrastructure_route_ownership_0806.py \
            tools/check_development_integration_0732.py \
            tech-priests_src/docs/CURRENT_TESTING_GOALS.md \
            docs/RECOVERY_AUTHORITY_MAP_CURRENT.md \
            docs/DEVELOPMENT_HISTORY.md
          git commit -m 'Consolidate infrastructure route ownership'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Publish generated command closure validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-command-closure',
              description: passed ? '0806 infrastructure carrier passed' : '0806 infrastructure carrier failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
