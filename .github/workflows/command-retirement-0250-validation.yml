name: 0250 command retirement validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit retired 0250 through 0255 diagnostic commands
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_0250_command_retirement_0789.py 2>&1 | tee /tmp/command-retirement-0250.log

      - name: Retain 0250 command retirement failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: command-retirement-0250-output
          path: /tmp/command-retirement-0250.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish 0250 command retirement status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/command-retirement-0250',
              description: passed ? '0250 command retirement passed' : '0250 command retirement failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
