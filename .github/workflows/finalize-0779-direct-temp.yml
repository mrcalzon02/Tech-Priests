name: Finalize 0779 directly

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-0779-direct-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Apply permanent registrations and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          integration = Path('tools/check_development_integration_0732.py')
          text = integration.read_text(encoding='utf-8')
          entry = '"check_generated_equipment_lifecycle_hooks_0779.py",'
          if entry not in text:
              marker = '"check_station_pair_recovery_0363_boundary_0778.py",\n}'
              if marker not in text:
                  raise SystemExit('missing 0778 integration marker')
              text = text.replace(marker, '"check_station_pair_recovery_0363_boundary_0778.py",\n' + entry + '\n}', 1)
              integration.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/source-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          command = 'python3 tools/check_generated_equipment_lifecycle_hooks_0779.py'
          if command not in text:
              marker = '      - name: Audit development integration graph\n'
              if marker not in text:
                  raise SystemExit('missing source-validation integration marker')
              step = '      - name: Audit direct 0302 and 0305 lifecycle refresh ownership\n        run: ' + command + '\n\n'
              text = text.replace(marker, step + marker, 1)
              workflow.write_text(text, encoding='utf-8')
          PY

          find .github/workflows -maxdepth 1 -type f \( \
            -name '*0302*0305*temp*.yml' -o \
            -name '*0779*temp*.yml' -o \
            -name 'generated-equipment-lifecycle-validation.yml' -o \
            -name 'audit-generated-lifecycle-wrappers-temp.yml' \
          \) -delete

          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No final cleanup changes found.'; exit 1; }
          git commit -m "Finalize permanent 0779 lifecycle validation"
          git push origin HEAD:main
      - name: Publish finalizer status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:passed?'success':'failure',context:'tech-priests/0779-direct-finalizer',description:passed?'0779 clean candidate published':'0779 direct finalizer failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});