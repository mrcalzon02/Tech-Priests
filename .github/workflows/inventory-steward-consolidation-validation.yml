name: Inventory steward consolidation validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit inventory steward consolidation
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_inventory_steward_consolidation_0808.py 2>&1 | tee /tmp/inventory-steward-consolidation.log

      - name: Retain inventory steward consolidation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-steward-consolidation-output
          path: /tmp/inventory-steward-consolidation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish inventory steward consolidation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/inventory-steward-consolidation',
              description: passed ? 'Inventory steward consolidation passed' : 'Inventory steward consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  apply_0809:
    if: github.event_name == 'issues' && github.event.issue.title == 'Milestone 0809 apply carrier'
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Install Lua 5.2 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet lua5.2

      - name: Decode and apply Milestone 0809
        shell: bash
        env:
          PAYLOAD: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import pathlib
          import zlib
          encoded = os.environ['PAYLOAD'].strip()
          data = zlib.decompress(base64.b64decode(encoded))
          expected = '9be722a53e8ff48f28e011fef72eb1c6188c41aca1457a8d6c827936c712e78f'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload hash mismatch: {actual}')
          path = pathlib.Path('tools/apply_runtime_invalidation_0809.py')
          path.write_bytes(data)
          PY
          python3 tools/apply_runtime_invalidation_0809.py
          luac5.2 -p tech-priests_src/scripts/core/runtime_config_0626.lua
          luac5.2 -p tech-priests_src/scripts/core/station_area_change_invalidator_0634.lua
          cp .github/workflows/source-validation.yml /tmp/source-validation-0809.yml
          cp .github/workflows/runtime-invalidation-route-ownership-validation.yml /tmp/runtime-invalidation-route-ownership-validation.yml
          git checkout -- .github/workflows/source-validation.yml
          rm -f .github/workflows/runtime-invalidation-route-ownership-validation.yml
          rm -f tools/apply_runtime_invalidation_0809.py
          rm -f .github/0809-snapshot-carrier-note.txt
          rm -f .github/0809-snapshot-carrier.trigger
          rm -f .github/0809-issue-trigger-ready.txt
          rm -f .github/0809-issue-trigger-now.txt
          rm -f .github/0809-dispatch-final.txt
          rm -f .github/0809-stop-staging.txt
          rm -f .github/0809-create-issue-command.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate runtime invalidation route ownership'
          git push origin HEAD:main

      - name: Retain workflow registrations
        uses: actions/upload-artifact@v4
        with:
          name: milestone-0809-workflow-registrations
          path: |
            /tmp/source-validation-0809.yml
            /tmp/runtime-invalidation-route-ownership-validation.yml
          if-no-files-found: error
          retention-days: 7

      - name: Publish Milestone 0809 apply status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/milestone-0809-apply',
              description: passed ? 'Milestone 0809 source commit applied' : 'Milestone 0809 source apply failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
