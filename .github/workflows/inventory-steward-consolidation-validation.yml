name: Inventory steward consolidation validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit inventory steward consolidation
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_inventory_steward_consolidation_0808.py 2>&1 | tee /tmp/inventory-steward-consolidation.log

      - name: Retain inventory steward consolidation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-steward-consolidation-output
          path: /tmp/inventory-steward-consolidation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish inventory steward consolidation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/inventory-steward-consolidation',
              description: passed ? 'Inventory steward consolidation passed' : 'Inventory steward consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });