name: Inventory steward consolidation validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit inventory steward consolidation
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_inventory_steward_consolidation_0808.py 2>&1 | tee /tmp/inventory-steward-consolidation.log

      - name: Retain inventory steward consolidation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-steward-consolidation-output
          path: /tmp/inventory-steward-consolidation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish inventory steward consolidation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/inventory-steward-consolidation',
              description: passed ? 'Inventory steward consolidation passed' : 'Inventory steward consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  snapshot_0809:
    if: github.event_name == 'issues' && github.event.issue.title == 'Milestone 0809 exact-head snapshot carrier'
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Capture exact-head source surfaces
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/milestone-0809-head.txt
          tar -czf /tmp/milestone-0809-source-surfaces.tar.gz \
            tech-priests_src/scripts/core \
            tech-priests_src/docs \
            tools \
            docs \
            RECOVERY_REPAIR_SEQUENCE.md \
            .github/workflows/source-validation.yml

      - name: Retain exact-head source surfaces
        uses: actions/upload-artifact@v4
        with:
          name: milestone-0809-exact-head-source-surfaces
          path: |
            /tmp/milestone-0809-head.txt
            /tmp/milestone-0809-source-surfaces.tar.gz
          if-no-files-found: error
          retention-days: 7
