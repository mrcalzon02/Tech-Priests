name: Inventory steward consolidation validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit inventory steward consolidation
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_inventory_steward_consolidation_0808.py 2>&1 | tee /tmp/inventory-steward-consolidation.log

      - name: Retain inventory steward consolidation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-steward-consolidation-output
          path: /tmp/inventory-steward-consolidation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish inventory steward consolidation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/inventory-steward-consolidation',
              description: passed ? 'Inventory steward consolidation passed' : 'Inventory steward consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  apply_0810:
    if: github.event_name == 'issues' && github.event.issue.title == 'Milestone 0810 apply carrier'
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Install Lua 5.2 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet lua5.2

      - name: Decode, apply, and validate Milestone 0810
        shell: bash
        env:
          PAYLOAD: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import pathlib
          import zlib
          encoded = os.environ['PAYLOAD'].strip()
          patch = zlib.decompress(base64.b64decode(encoded))
          expected = 'd2dcb0604b05a60854555f74f31eb6b131aef12a5aa98462830b9bd03cf39d11'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload hash mismatch: {actual}')
          pathlib.Path('/tmp/milestone-0810.patch').write_bytes(patch)
          PY
          git apply --check /tmp/milestone-0810.patch
          git apply /tmp/milestone-0810.patch
          luac5.2 -p tech-priests_src/scripts/core/chatter.lua
          luac5.2 -p tech-priests_src/scripts/core/bootstrap_runtime.lua
          python3 tools/check_bootstrap_chatter_route_ownership_0810.py
          python3 tools/check_development_integration_0732.py .
          python3 tools/check_recovery_architecture_0744.py .
          python3 tools/audit_ups_hotspots_0743.py --root tech-priests_src --check-baseline --print-summary
          cp .github/workflows/source-validation.yml /tmp/source-validation-0810.yml
          cp .github/workflows/bootstrap-chatter-route-ownership-validation.yml /tmp/bootstrap-chatter-route-ownership-validation.yml
          git checkout -- .github/workflows/source-validation.yml
          rm -f .github/workflows/bootstrap-chatter-route-ownership-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate bootstrap and chatter route ownership'
          git push origin HEAD:main

      - name: Retain workflow registrations
        uses: actions/upload-artifact@v4
        with:
          name: milestone-0810-workflow-registrations
          path: |
            /tmp/source-validation-0810.yml
            /tmp/bootstrap-chatter-route-ownership-validation.yml
          if-no-files-found: error
          retention-days: 7

      - name: Publish Milestone 0810 apply status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/milestone-0810-apply',
              description: passed ? 'Milestone 0810 source commit applied' : 'Milestone 0810 source apply failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
