name: Finalize artillery recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-artillery-recovery.yml

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh exact main state
        run: git pull --ff-only origin main

      - name: Apply or verify artillery documentation migration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .recovery-staging/apply_artillery_docs.py ]]; then
            python3 .recovery-staging/apply_artillery_docs.py
          fi
          grep -Fq '35 retained hardeners' tech-priests_src/docs/AUTHORITY_REFACTOR_CONTINUITY.md
          grep -Fq '20 source-preserved authorities' tech-priests_src/docs/AUTHORITY_REFACTOR_CONTINUITY.md
          grep -Fq '## Artillery authority' tech-priests_src/docs/AUTHORITY_REFACTOR_CONTINUITY.md
          grep -Fq '35 declarative active hardeners' docs/RECOVERY_AUTHORITY_MAP_CURRENT.md
          grep -Fq 'Twenty files remain' docs/RECOVERY_AUTHORITY_MAP_CURRENT.md
          grep -Fq 'artillery_discovery_0713' docs/RECOVERY_AUTHORITY_MAP_CURRENT.md
          grep -Fq '35 active hardeners and 20 explicitly retired' docs/DEVELOPMENT_HISTORY.md
          grep -Fq 'Consolidated artillery authority' docs/DEVELOPMENT_HISTORY.md
          grep -Fq 'artillery logistics are dispatcher-owned' tech-priests_src/docs/CURRENT_TESTING_GOALS.md
          grep -Fq 'check_artillery_boundary_0756.py' tech-priests_src/docs/CURRENT_TESTING_GOALS.md
          grep -Fq 'The next source repair is roboport' tech-priests_src/docs/CURRENT_TESTING_GOALS.md

      - name: Remove all one-shot artifacts
        run: |
          rm -rf .recovery-staging
          rm -f .github/workflows/apply-artillery-docs.yml
          rm -f .github/workflows/finalize-artillery-recovery.yml
          rm -f tmp-do-not-create

      - name: Commit final synchronized main state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize artillery recovery documentation'
            git push origin HEAD:main
          fi
          git pull --ff-only origin main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch source validation for exact final SHA
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run source-validation.yml --ref main
          for attempt in $(seq 1 30); do
            run_json="$(gh run list --workflow source-validation.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,headSha,status,conclusion,createdAt)"
            run_id="$(python3 -c 'import json,os; runs=json.loads(os.environ["RUNS"]); sha=os.environ["SHA"]; print(next((str(r["databaseId"]) for r in runs if r.get("headSha")==sha), ""))' RUNS="$run_json" SHA="$FINAL_SHA")"
            if [[ -n "$run_id" ]]; then
              echo "SOURCE_VALIDATION_RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo 'Unable to resolve dispatched source-validation run.' >&2
          exit 1

      - name: Wait for source validation result
        run: gh run watch "$SOURCE_VALIDATION_RUN_ID" --exit-status
