name: Audit 0363 station pair recovery ownership

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-0363-ownership-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect 0363 ownership map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          {
            echo '=== station_pair_recovery references ==='
            grep -R -n -E 'station_pair_recovery|STATION_PAIR_RECOVERY_0363|tech_priests_0363_|tp-pairstate-recover-0363' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== station_pair_state canonical APIs ==='
            grep -R -n -E 'station_pair_state_0362|STATION_PAIR_STATE_0362|ensure_pair\(|refresh_pair\(|remove_pair\(' tech-priests_src/scripts/core/station_pair_state.lua tech-priests_src/scripts tools || true
            echo
            echo '=== canonical pair integrity and migration owners ==='
            grep -R -n -E 'pairs_by_station|pairs_by_priest|station_by_priest|pair integrity|pair_integrity|ledger|inventory steward|logistic cache' tech-priests_src/scripts/core/migration_pair_integrity_0734.lua tech-priests_src/scripts/core/priest_lifecycle_authority_0499.lua tech-priests_src/scripts/core/station_pair_state.lua tech-priests_src/scripts/core/inventory_steward.lua tools/check_migration_lifecycle_integration_0736.py || true
            echo
            echo '=== bootstrap and loader references ==='
            grep -R -n -E '0363|station_pair_recovery' tech-priests_src/scripts/core/bootstrap_runtime.lua tech-priests_src/control.lua tech-priests_src/scripts/core/planning_constraints_0646.lua || true
            echo
            echo '=== direct lifecycle and mutable work writes in 0363 ==='
            grep -n -E 'ensure_pair_priest|respawn_pair_priest|create_pair|pair\.mode|pair\.target|combat_target|commands\.add_command|write_file|on_nth_tick|register_service' tech-priests_src/scripts/core/station_pair_recovery.lua || true
            echo
            echo '=== current count contracts ==='
            grep -R -n -E 'retired_authority_count[= ]*46|26[- /]active[^\n]*46[- /]retired|26 active hardeners and 46|46 retired source-only|46 source-preserved|Forty-six files remain|Preserve the 26-active / 46-retired' RECOVERY_REPAIR_SEQUENCE.md docs tech-priests_src/docs tools tech-priests_src/scripts/core/planning_constraints_0646.lua || true
          } > /tmp/audit/0363-ownership.txt
      - uses: actions/upload-artifact@v4
        with:
          name: station-pair-recovery-0363-audit
          path: /tmp/audit/0363-ownership.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:passed?'success':'failure',context:'tech-priests/0363-ownership-audit',description:passed?'0363 ownership audit complete':'0363 audit failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});