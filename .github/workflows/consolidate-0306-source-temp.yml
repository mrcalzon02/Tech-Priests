name: Consolidate 0306 source ownership

on:
  push:
    branches:
      - main
    paths:
      - .github/0306-consolidation-trigger.txt

permissions:
  contents: write
  statuses: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Consolidate visible-grid reading into canonical 0305
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          part20 = Path('tech-priests_src/scripts/generated/control_legacy_part_020.lua')
          text = part20.read_text(encoding='utf-8')
          pattern = re.compile(
              r'function tech_priests_0305_refresh_pair_equipment\(pair, reason\).*?\nend\n\nfunction tech_priests_0305_find_enemy_near',
              re.S,
          )
          replacement = '''function tech_priests_0305_refresh_pair_equipment(pair, reason)
            if not (pair and pair.station and pair.station.valid) then return nil end
            local grid = tech_priests_0305_pair_grid(pair)
            local capacity = math.max(1, (grid.width or 4) * (grid.height or 4))
            local summary = {
              tick = game and game.tick or 0,
              reason = reason or "refresh",
              grid = grid,
              capacity = capacity,
              used = 0,
              accepted = {},
              rejected = {},
              laser_count = 0,
              discharge_count = 0,
              shield_capacity = 0,
              exoskeleton_count = 0,
              battery_count = 0,
              toolbelt_count = 0,
            }
            local function add_equipment(item_name, source)
              local allowed, why, equipment = tech_priests_0305_equipment_allowed(item_name)
              if not equipment then return end
              local area = tech_priests_0305_equipment_area(equipment)
              if allowed and (summary.used + area) <= capacity then
                summary.used = summary.used + area
                local etype = equipment.type
                if etype == "energy-shield-equipment" then
                  summary.shield_capacity = summary.shield_capacity + tech_priests_0305_equipment_energy_shield(equipment)
                elseif etype == "movement-bonus-equipment" then
                  summary.exoskeleton_count = summary.exoskeleton_count + 1
                elseif etype == "battery-equipment" then
                  summary.battery_count = summary.battery_count + 1
                elseif etype == "inventory-bonus-equipment" then
                  summary.toolbelt_count = summary.toolbelt_count + 1
                elseif etype == "active-defense-equipment" then
                  if tech_priests_0305_is_discharge_equipment(equipment) then
                    summary.discharge_count = summary.discharge_count + 1
                  elseif tech_priests_0305_is_laser_equipment(equipment) then
                    summary.laser_count = summary.laser_count + 1
                  end
                end
                summary.accepted[#summary.accepted + 1] = {
                  item = item_name,
                  count = 1,
                  equipment = equipment.name,
                  type = equipment.type,
                  area = area,
                  source = source,
                }
              else
                summary.rejected[#summary.rejected + 1] = {
                  item = item_name,
                  reason = allowed and "grid-full" or why,
                  equipment = equipment.name,
                  type = equipment.type,
                  source = source,
                }
              end
            end
            local bay = tech_priests_0306_ensure_bay and tech_priests_0306_ensure_bay(pair) or nil
            for index = 1, capacity do
              local slot = bay and bay.slots and bay.slots[index]
              if slot and slot.item then add_equipment(slot.item, "visible-grid") end
            end
            local inventory = pair.station.get_inventory and pair.station.get_inventory(defines.inventory.chest) or nil
            if inventory and inventory.valid then
              for item_name, count in pairs(inventory.get_contents() or {}) do
                for _ = 1, count do
                  add_equipment(item_name, "station-inventory-compatibility")
                end
              end
            end
            pair.sub_equipment_0305 = summary
            pair.sub_equipment_grid_0302 = grid and {
              width = grid.width,
              height = grid.height,
              label = grid.label,
              name = grid.name,
            } or pair.sub_equipment_grid_0302
            pair.future_equipment_grid_0301 = pair.future_equipment_grid_0301 or {}
            pair.future_equipment_grid_0301.grid = grid.name
            pair.future_equipment_grid_0301.capacity = capacity
            pair.future_equipment_grid_0301.used = summary.used
            pair.future_equipment_grid_0301.accepted = summary.accepted
            pair.future_equipment_grid_0301.rejected = summary.rejected
            pair.future_equipment_grid_0301.bay_slots = bay and bay.slots or nil
            return summary
          end

          function tech_priests_0305_find_enemy_near'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'canonical 0305 replacement count={count}')
          marker = 'TECH_PRIESTS_0305_DEBUG_COMMAND_RETIRED = true\n'
          flags = marker + 'TECH_PRIESTS_0306_REFRESH_OVERRIDE_RETIRED = true\nTECH_PRIESTS_0306_DEBUG_COMMAND_RETIRED = true\n'
          if 'TECH_PRIESTS_0306_REFRESH_OVERRIDE_RETIRED = true' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('missing 0305 retirement marker')
              text = text.replace(marker, flags, 1)
          part20.write_text(text, encoding='utf-8')

          part21 = Path('tech-priests_src/scripts/generated/control_legacy_part_021.lua')
          text = part21.read_text(encoding='utf-8')
          pattern = re.compile(
              r'function tech_priests_0305_refresh_pair_equipment\(pair, reason\).*?tech_priests_0306_log\("visible Cogitator equipment grid \+ honest direct mining damage loaded"\)',
              re.S,
          )
          replacement = '''-- 0.1.674-dev: visible-grid reading is consolidated into canonical 0305.
          -- 0306 retains GUI and bay presentation only; it no longer replaces 0305
          -- and its diagnostic command is retired by runtime_command_cleanup_0720.
          TECH_PRIESTS_0306_REFRESH_OVERRIDE_RETIRED = true
          TECH_PRIESTS_0306_DEBUG_COMMAND_RETIRED = true
          tech_priests_0306_log("visible Cogitator equipment grid + honest direct mining damage loaded")'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'0306 override retirement count={count}')
          part21.write_text(text, encoding='utf-8')

          history = Path('docs/DEVELOPMENT_HISTORY.md')
          text = history.read_text(encoding='utf-8')
          heading = '### Consolidated `0306` visible-grid reader into canonical `0305`\n'
          if heading not in text:
              text += '''\n\n### Consolidated `0306` visible-grid reader into canonical `0305`\n\n`0306` previously replaced `tech_priests_0305_refresh_pair_equipment` after the generated fragment boundary, making equipment truth depend on load order. Canonical `0305` now consumes the visible scripted bay first and station inventory only as an explicitly named compatibility source under one capacity and allow/deny policy. `0306` retains GUI and bay presentation only; its refresh replacement is retired, while `runtime_command_cleanup_0720` removes `tp-grid-0306`. The declarative graph remains **26 active hardeners and 47 explicitly retired source-only authorities**.\n\nThis is source implementation only. Complete Source validation and Factorio runtime evidence remain separately required.\n'''
              history.write_text(text, encoding='utf-8')
          PY

          python3 tools/check_generated_equipment_lifecycle_hooks_0779.py
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src/scripts/generated/control_legacy_part_020.lua \
                  tech-priests_src/scripts/generated/control_legacy_part_021.lua \
                  docs/DEVELOPMENT_HISTORY.md
          git commit -m "Consolidate 0306 equipment grid ownership"
          git push origin HEAD:main

      - name: Publish consolidator status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0306-consolidator',
              description: passed ? '0306 source consolidation published' : '0306 source consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
