name: Run movement cadence consolidation temporary

on:
  push:
    branches:
      - main
    paths:
      - .github/movement-cadence-consolidation.trigger

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Execute staged consolidation specification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          specification = Path('.github/workflows/movement-cadence-consolidation-temp.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if start not in specification:
              raise SystemExit('movement consolidation Python block not found')
          block = specification.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(block), 'movement-cadence-consolidation', 'exec'))
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src/scripts/core/movement_controller.lua \
                  tech-priests_src/scripts/core/movement_cadence_contract_0518.lua \
                  tech-priests_src/control.lua \
                  tech-priests_src/scripts/core/planning_constraints_0646.lua \
                  tools/check_development_integration_0732.py \
                  tools/check_recovery_architecture_0744.py \
                  tools/check_governance_prerequisites_0738.py \
                  tools/check_movement_cadence_boundary_0761.py \
                  .github/workflows/source-validation.yml \
                  docs/RECOVERY_AUTHORITY_MAP_CURRENT.md \
                  tech-priests_src/docs/AUTHORITY_REFACTOR_CONTINUITY.md \
                  tech-priests_src/docs/CURRENT_TESTING_GOALS.md \
                  RECOVERY_REPAIR_SEQUENCE.md \
                  docs/DEVELOPMENT_HISTORY.md
          git commit -m "Consolidate movement cadence authority"
          git pull --rebase origin main
          git push origin HEAD:main
