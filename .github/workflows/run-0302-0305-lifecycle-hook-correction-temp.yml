name: Correct 0302 and 0305 lifecycle hook consolidation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-0302-0305-lifecycle-hook-correction-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Execute corrected staged payload
        shell: bash
        run: |
          set -euo pipefail
          git show 05e6be1b8bd59845363aa0dac35202ce9702800c:.github/workflows/apply-0302-0305-lifecycle-hook-consolidation-temp.yml > /tmp/staged.yml
          python3 - <<'PY'
          import pathlib,re
          source=pathlib.Path('/tmp/staged.yml').read_text(encoding='utf-8')
          match=re.search(r"python3 - <<'PY'\n(.*?)\n          PY",source,re.S)
          if not match: raise SystemExit('staged consolidation payload not found')
          lines=match.group(1).splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code,'0302-0305-corrected-payload','exec'),{'__name__':'__main__'})
          PY
          git restore .github/workflows/source-validation.yml
          python3 -m compileall -q tools
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src docs RECOVERY_REPAIR_SEQUENCE.md tools
          git commit -m "Consolidate 0302 and 0305 lifecycle refresh hooks"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:passed?'success':'failure',context:'tech-priests/0302-0305-correction',description:passed?'0302 and 0305 source consolidation pushed':'0302/0305 correction failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
