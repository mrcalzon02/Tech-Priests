name: Audit 0498 retirement references

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-0498-retirement-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect 0498 references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          {
            echo '=== live 0498 references ==='
            grep -R -n -E 'task_pair_audit_0498|TechPriestsTaskPairAudit0498|TECH_PRIESTS_0498|paused_by_missing_priest_0498|priest_removed_0498|tp-task-pair-audit-0498' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== order pause and resume references ==='
            grep -R -n -E 'paused-missing-priest|pause_reason|pause_for_missing|resume_after_priest' tech-priests_src/scripts/core tech-priests_src/scripts/generated || true
            echo
            echo '=== current 43-count references ==='
            grep -R -n -E 'retired_authority_count=43|26-active / 43-retired|26 active hardeners and 43|43 retired source-only|43 source-preserved|Forty-three files|43 explicitly retired' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
          } > /tmp/audit/0498-retirement.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-0498-audit
          path: /tmp/audit/0498-retirement.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0498-reference-audit',
              description: passed ? '0498 reference audit complete' : '0498 reference audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
