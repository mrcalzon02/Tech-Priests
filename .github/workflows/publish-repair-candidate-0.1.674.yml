name: Publish repair candidate 0.1.674

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-repair-candidate-0.1.674.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-repair-candidate-0.1.674
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.1.674
  RELEASE_TAG: v0.1.674-rc.1
  PACKAGE_ROOT: tech-priests_0.1.674
  PACKAGE_FILE: tech-priests_0.1.674.zip

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repaired main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify Factorio repair package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p "build/${PACKAGE_ROOT}" dist
          cp -a tech-priests_src/. "build/${PACKAGE_ROOT}/"
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import zipfile

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          package_root = os.environ["PACKAGE_ROOT"]
          package_file = os.environ["PACKAGE_FILE"]
          source_commit = os.environ["GITHUB_SHA"]
          package_dir = pathlib.Path("build") / package_root

          required_source = [
              package_dir / "info.json",
              package_dir / "control.lua",
              package_dir / "scripts/core/ammo_scavenge_priority_0740.lua",
              package_dir / "prototypes/proxy_ammo_capacity_0739.lua",
          ]
          for path in required_source:
              if not path.is_file():
                  raise SystemExit(f"repair package missing required source: {path}")

          info_path = package_dir / "info.json"
          info = json.loads(info_path.read_text(encoding="utf-8"))
          if info.get("name") != "tech-priests":
              raise SystemExit(f"unexpected mod name: {info.get('name')!r}")
          if info.get("factorio_version") != "2.0":
              raise SystemExit(f"unexpected Factorio version: {info.get('factorio_version')!r}")
          if info.get("version") != "0.1.672":
              raise SystemExit(f"unexpected protected source version: {info.get('version')!r}")

          info["version"] = version
          info["description"] = (
              str(info.get("description") or "").rstrip()
              + " Repair candidate 0.1.674 adds ammunition scavenge-first priority, "
                "one-magazine proxy loading, stale no-ammo cleanup, legacy direct-gather "
                "pulse removal, and overleash safety ownership. Runtime validation remains pending."
          )
          info_path.write_text(
              json.dumps(info, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          marker = {
              "schema": "tech-priests-repair-candidate-v1",
              "release": tag,
              "package_version": version,
              "source_commit": source_commit,
              "source_metadata_version": "0.1.672",
              "release_channel": "github-prerelease",
              "runtime_validation_complete": False,
              "repairs": [
                  "physical ammunition scavenging before mining or emergency crafting",
                  "one physical magazine retained in the hidden firing proxy",
                  "station ammunition clears stale no-ammo state",
                  "legacy direct-gather pulse decommissioned by handler identity",
                  "hard Cogitator range return outranks ordinary work movement",
              ],
          }
          (package_dir / "REPAIR_CANDIDATE.json").write_text(
              json.dumps(marker, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          excluded_dirs = {
              ".git", ".github", "__pycache__", ".pytest_cache", ".mypy_cache",
              ".ruff_cache", "node_modules", "build", "dist",
          }
          excluded_suffixes = {".pyc", ".pyo", ".tmp", ".bak", ".log", ".zip"}
          for path in sorted(package_dir.rglob("*"), reverse=True):
              if path.is_dir() and path.name in excluded_dirs:
                  shutil.rmtree(path)
              elif path.is_file() and (
                  path.name in {".DS_Store", "Thumbs.db"}
                  or path.suffix.lower() in excluded_suffixes
              ):
                  path.unlink()

          zip_path = pathlib.Path("dist") / package_file
          with zipfile.ZipFile(
              zip_path,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as archive:
              for path in sorted(package_dir.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(package_dir.parent).as_posix())

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failure at {bad}")
              names = set(archive.namelist())
              roots = {name.split("/", 1)[0] for name in names if name}
              if roots != {package_root}:
                  raise SystemExit(f"unexpected ZIP roots: {sorted(roots)}")
              packaged_info = json.loads(
                  archive.read(f"{package_root}/info.json").decode("utf-8")
              )
              if packaged_info.get("version") != version:
                  raise SystemExit("packaged metadata version mismatch")
              for required_name in (
                  f"{package_root}/control.lua",
                  f"{package_root}/REPAIR_CANDIDATE.json",
                  f"{package_root}/scripts/core/ammo_scavenge_priority_0740.lua",
                  f"{package_root}/prototypes/proxy_ammo_capacity_0739.lua",
              ):
                  if required_name not in names:
                      raise SystemExit(f"ZIP missing repair file: {required_name}")

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          pathlib.Path(f"dist/{package_file}.sha256").write_text(
              f"{digest}  {package_file}\n",
              encoding="utf-8",
          )
          manifest = {
              "schema": "tech-priests-github-prerelease-v1",
              "release": tag,
              "version": version,
              "package": package_file,
              "source_commit": source_commit,
              "sha256": digest,
              "factorio_version": "2.0",
              "prerelease": True,
              "runtime_validation_complete": False,
              "built_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          pathlib.Path("dist/release-manifest-0.1.674-rc.1.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Built {zip_path} from {source_commit}")
          print(f"SHA256 {digest}")
          PY

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat >"${notes_file}" <<'EOF'
          ## Tech Priests v0.1.674 Repair Candidate 1

          This GitHub pre-release packages the repaired `main` source as Factorio mod version `0.1.674`.

          Repairs included:
          - Existing ammunition in nearby stations and containers is physically scavenged before raw mining or emergency crafting.
          - The hidden firing proxy retains one physical magazine rather than a concealed ammunition stack.
          - Supplying ammunition clears stale no-ammo request and warning state.
          - The legacy direct-gather pulse that could steal logistics work is decommissioned by handler identity.
          - Hard Cogitator station-range return remains above ordinary work movement.

          This is marked as a pre-release because complete Factorio runtime validation has not yet been recorded. The package includes `REPAIR_CANDIDATE.json`, a SHA-256 checksum, and a release manifest identifying the source commit.
          EOF

          assets=(
            "dist/${PACKAGE_FILE}"
            "dist/${PACKAGE_FILE}.sha256"
            "dist/release-manifest-0.1.674-rc.1.json"
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Tech Priests v0.1.674 Repair Candidate 1" \
              --notes-file "${notes_file}" \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Tech Priests v0.1.674 Repair Candidate 1" \
              --notes-file "${notes_file}" \
              --prerelease
          fi

      - name: Verify release and record receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" \
            --json tagName,isPrerelease,targetCommitish,url,assets \
            > dist/github-release.json
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib

          release = json.loads(pathlib.Path("dist/github-release.json").read_text(encoding="utf-8"))
          manifest = json.loads(pathlib.Path("dist/release-manifest-0.1.674-rc.1.json").read_text(encoding="utf-8"))
          if release.get("tagName") != os.environ["RELEASE_TAG"]:
              raise SystemExit("release tag verification failed")
          if release.get("isPrerelease") is not True:
              raise SystemExit("release is not marked prerelease")
          assets = {asset["name"] for asset in release.get("assets", [])}
          required = {
              os.environ["PACKAGE_FILE"],
              os.environ["PACKAGE_FILE"] + ".sha256",
              "release-manifest-0.1.674-rc.1.json",
          }
          missing = sorted(required - assets)
          if missing:
              raise SystemExit(f"release missing assets: {missing}")
          receipt = {
              "schema": "tech-priests-release-publication-v1",
              "release": os.environ["RELEASE_TAG"],
              "release_url": release["url"],
              "asset": os.environ["PACKAGE_FILE"],
              "source_commit": os.environ["GITHUB_SHA"],
              "sha256": manifest["sha256"],
              "published_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "github_release_verified": True,
              "prerelease": True,
              "runtime_validation_complete": False,
          }
          path = pathlib.Path("docs/releases/v0.1.674-rc.1-published.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(release["url"])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/releases/v0.1.674-rc.1-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Record v0.1.674 repair candidate publication"
            git push origin HEAD:main
          fi
