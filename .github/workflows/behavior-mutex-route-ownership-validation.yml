name: Behavior mutex route ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit behavior mutex route ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_behavior_mutex_route_ownership_0798.py 2>&1 | tee /tmp/behavior-mutex-route-ownership.log

      - name: Retain behavior mutex route ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-mutex-route-ownership-output
          path: /tmp/behavior-mutex-route-ownership.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish behavior mutex route ownership status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/behavior-mutex-route-ownership',
              description: passed ? 'Behavior mutex route ownership passed' : 'Behavior mutex route ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });