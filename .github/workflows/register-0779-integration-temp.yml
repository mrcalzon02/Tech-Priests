name: Register 0779 integration checker

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/register-0779-integration-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Register 0779 in canonical integration checker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_development_integration_0732.py')
          text = path.read_text(encoding='utf-8')
          entry = '"check_generated_equipment_lifecycle_hooks_0779.py",'
          if entry not in text:
              marker = '"check_station_pair_recovery_0363_boundary_0778.py",'
              if text.count(marker) != 1:
                  raise SystemExit(f'0778 marker count={text.count(marker)}')
              text = text.replace(marker, marker + '\n' + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python3 -m compileall -q tools
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_development_integration_0732.py
          git diff --cached --quiet && { echo '0779 already registered'; exit 0; }
          git commit -m "Register 0779 in development integration"
          git push origin HEAD:main
      - name: Publish registration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:passed?'success':'failure',context:'tech-priests/0779-integration-registration',description:passed?'0779 integration registered':'0779 integration registration failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});