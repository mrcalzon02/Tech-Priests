name: Construction ghost planner ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit construction ghost planner ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_construction_ghost_owner_0802.py 2>&1 | tee /tmp/construction-ghost-owner.log

      - name: Retain construction ghost planner ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: construction-ghost-owner-output
          path: /tmp/construction-ghost-owner.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish construction ghost planner ownership status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/construction-ghost-owner',
              description: passed ? 'Construction ghost planner ownership passed' : 'Construction ghost planner ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });