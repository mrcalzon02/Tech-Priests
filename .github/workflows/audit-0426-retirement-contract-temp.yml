name: Audit 0426 retirement contract

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-0426-retirement-contract-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect exact current contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          {
            echo '=== current 45-count contracts ==='
            grep -R -n -E 'retired_authority_count[= ]*45|26[- /]active[^\n]*45[- /]retired|26 active hardeners and 45|45 retired source-only|45 source-preserved|Forty-five files remain|Preserve the 26-active / 45-retired' RECOVERY_REPAIR_SEQUENCE.md docs tech-priests_src/docs tools tech-priests_src/scripts/core/planning_constraints_0646.lua || true
            echo
            echo '=== pair_death_and_respawn references ==='
            grep -R -n -E 'pair_death_and_respawn|TechPriestsPairDeathAndRespawn|tp-lifecycle-0426|lifecycle_0426|TECH_PRIESTS_0426' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== 0298 event/tick route references ==='
            grep -R -n -E 'tech_priests_on_removed_reimprint_wrapper_0298|PRE_REIMPRINT_(ENSURE|RESPAWN)|0298_service_reimprints|on_nth_tick\(47' tech-priests_src tools docs || true
            echo
            echo '=== workflow checker tail ==='
            grep -n -E '077[0-9]|Audit retired 0|Audit broker-owned 0503' .github/workflows/source-validation.yml tools/check_development_integration_0732.py tools/check_governance_prerequisites_0738.py || true
            echo
            echo '=== history tail ==='
            tail -n 120 docs/DEVELOPMENT_HISTORY.md
          } > /tmp/audit/0426-retirement-contract.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-0426-contract-audit
          path: /tmp/audit/0426-retirement-contract.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0426-retirement-contract-audit',
              description: passed ? '0426 retirement contract audit complete' : '0426 contract audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });