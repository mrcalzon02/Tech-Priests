name: Publish performance hotfix 0.1.674 RC2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-hotfix-0.1.674-rc.2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hotfix-0.1.674-rc.2
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.1.674
  RELEASE_TAG: v0.1.674-rc.2
  PACKAGE_ROOT: tech-priests_0.1.674
  PACKAGE_FILE: tech-priests_0.1.674.zip

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out quarantined main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.2

      - name: Parse runtime source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find tech-priests_src -type f -name '*.lua' -print0 | sort -z)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            luac5.2 -p "${file}"
          done
          test ! -e tech-priests_src/scripts/core/ammo_scavenge_priority_0740.lua
          grep -q 'quarantine_regressions' tech-priests_src/scripts/core/hardener_installation_audit_0723.lua
          grep -q 'proxy.inventory_size = 1' tech-priests_src/prototypes/proxy_ammo_capacity_0739.lua

      - name: Build verified hotfix package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p "build/${PACKAGE_ROOT}" dist
          cp -a tech-priests_src/. "build/${PACKAGE_ROOT}/"
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import zipfile

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          package_root = os.environ["PACKAGE_ROOT"]
          package_file = os.environ["PACKAGE_FILE"]
          source_commit = os.environ["GITHUB_SHA"]
          package_dir = pathlib.Path("build") / package_root

          info_path = package_dir / "info.json"
          info = json.loads(info_path.read_text(encoding="utf-8"))
          if info.get("name") != "tech-priests" or info.get("factorio_version") != "2.0":
              raise SystemExit("unexpected mod metadata")
          if info.get("version") != "0.1.672":
              raise SystemExit(f"unexpected protected source version: {info.get('version')!r}")
          info["version"] = version
          info["description"] = (
              str(info.get("description") or "").rstrip()
              + " Performance hotfix RC2 removes the five-tick all-pairs ammunition scanner, "
                "restores wrapped movement/combat authorities, and quarantines the crashing "
                "development integration audit. The one-magazine proxy prototype remains."
          )
          info_path.write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")

          marker = {
              "schema": "tech-priests-performance-hotfix-v1",
              "release": tag,
              "package_version": version,
              "source_commit": source_commit,
              "supersedes": "v0.1.674-rc.1",
              "runtime_validation_complete": False,
              "removed_regression": "ammo_scavenge_priority_0740",
              "repairs": [
                  "remove five-tick all-pairs ammunition scanning",
                  "remove repeated logistics and movement task preemption",
                  "restore leaf-task, direct-acquisition, and combat wrappers",
                  "disable repeatedly crashing development integration audit service",
                  "retain data-stage one-magazine proxy capacity",
              ],
          }
          (package_dir / "PERFORMANCE_HOTFIX.json").write_text(
              json.dumps(marker, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          excluded_dirs = {".git", ".github", "__pycache__", "build", "dist", "node_modules"}
          excluded_suffixes = {".pyc", ".pyo", ".tmp", ".bak", ".log", ".zip"}
          for path in sorted(package_dir.rglob("*"), reverse=True):
              if path.is_dir() and path.name in excluded_dirs:
                  shutil.rmtree(path)
              elif path.is_file() and (path.suffix.lower() in excluded_suffixes or path.name in {".DS_Store", "Thumbs.db"}):
                  path.unlink()

          required = [
              package_dir / "control.lua",
              package_dir / "info.json",
              package_dir / "PERFORMANCE_HOTFIX.json",
              package_dir / "scripts/core/hardener_installation_audit_0723.lua",
              package_dir / "prototypes/proxy_ammo_capacity_0739.lua",
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"missing hotfix package file: {path}")
          if (package_dir / "scripts/core/ammo_scavenge_priority_0740.lua").exists():
              raise SystemExit("regressive 0740 module is still packaged")

          zip_path = pathlib.Path("dist") / package_file
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(package_dir.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(package_dir.parent).as_posix())

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failure at {bad}")
              names = set(archive.namelist())
              roots = {name.split("/", 1)[0] for name in names if name}
              if roots != {package_root}:
                  raise SystemExit(f"unexpected ZIP roots: {sorted(roots)}")
              packaged_info = json.loads(archive.read(f"{package_root}/info.json"))
              if packaged_info.get("version") != version:
                  raise SystemExit("packaged version mismatch")
              if f"{package_root}/scripts/core/ammo_scavenge_priority_0740.lua" in names:
                  raise SystemExit("regressive module present in ZIP")

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          pathlib.Path(f"dist/{package_file}.sha256").write_text(
              f"{digest}  {package_file}\n", encoding="utf-8"
          )
          manifest = {
              "schema": "tech-priests-github-prerelease-v1",
              "release": tag,
              "version": version,
              "package": package_file,
              "source_commit": source_commit,
              "sha256": digest,
              "factorio_version": "2.0",
              "prerelease": True,
              "runtime_validation_complete": False,
              "supersedes": "v0.1.674-rc.1",
              "built_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          pathlib.Path("dist/release-manifest-0.1.674-rc.2.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(digest)
          PY

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat >"${notes_file}" <<'EOF'
          ## Tech Priests v0.1.674 Performance Hotfix RC2

          **RC1 is superseded and should not be used.**

          This hotfix removes the five-tick all-pairs ammunition authority introduced in RC1. That authority repeatedly scanned inventories and item prototypes, invoked logistics for every eligible pair, and fought movement/task authorities, causing severe UPS loss and frenetic task churn.

          RC2:
          - Removes `ammo_scavenge_priority_0740` from the package.
          - Disables any surviving RC1 broker service on reload.
          - Restores the leaf-task, direct-acquisition, and combat functions wrapped by RC1.
          - Disables the repeatedly crashing development integration audit service.
          - Retains the data-stage one-magazine proxy capacity change.

          Runtime validation remains pending, so this remains a pre-release.
          EOF

          assets=(
            "dist/${PACKAGE_FILE}"
            "dist/${PACKAGE_FILE}.sha256"
            "dist/release-manifest-0.1.674-rc.2.json"
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Tech Priests v0.1.674 Performance Hotfix RC2" \
              --notes-file "${notes_file}" \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Tech Priests v0.1.674 Performance Hotfix RC2" \
              --notes-file "${notes_file}" \
              --prerelease
          fi

      - name: Verify release and record receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json tagName,isPrerelease,url,assets > dist/github-release.json
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib

          release = json.loads(pathlib.Path("dist/github-release.json").read_text())
          manifest = json.loads(pathlib.Path("dist/release-manifest-0.1.674-rc.2.json").read_text())
          assert release["tagName"] == os.environ["RELEASE_TAG"]
          assert release["isPrerelease"] is True
          assets = {asset["name"] for asset in release.get("assets", [])}
          required = {
              os.environ["PACKAGE_FILE"],
              os.environ["PACKAGE_FILE"] + ".sha256",
              "release-manifest-0.1.674-rc.2.json",
          }
          missing = sorted(required - assets)
          if missing:
              raise SystemExit(f"missing release assets: {missing}")
          receipt = {
              "schema": "tech-priests-release-publication-v1",
              "release": os.environ["RELEASE_TAG"],
              "release_url": release["url"],
              "asset": os.environ["PACKAGE_FILE"],
              "source_commit": os.environ["GITHUB_SHA"],
              "sha256": manifest["sha256"],
              "published_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "github_release_verified": True,
              "prerelease": True,
              "runtime_validation_complete": False,
              "supersedes": "v0.1.674-rc.1",
          }
          path = pathlib.Path("docs/releases/v0.1.674-rc.2-published.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(release["url"])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/releases/v0.1.674-rc.2-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Record v0.1.674 RC2 hotfix publication"
            git push origin HEAD:main
          fi
