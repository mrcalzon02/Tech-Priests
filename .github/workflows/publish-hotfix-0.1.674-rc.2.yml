name: Publish hotfix 0.1.674-rc.2 archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse historical publication path
        shell: bash
        run: |
          echo "Archived experimental prerelease RC2"
          echo "This historical publisher is archived and cannot create or modify releases."
          echo "Use the canonical verified packaging path only after docs/releases/VERIFIED_RELEASE_AUTHORIZATION.json exists and passes every recovery gate."
          exit 1
