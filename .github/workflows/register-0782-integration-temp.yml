name: Register 0782 integration

on:
  push:
    branches:
      - main
    paths:
      - .github/0782-integration-trigger.txt

permissions:
  contents: write
  statuses: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Register 0782 checker in development integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_development_integration_0732.py')
          text = path.read_text(encoding='utf-8')
          entry = '"check_generated_gui_damage_commands_0782.py",'
          if entry not in text:
              marker = '"check_generated_glow_ownership_0781.py",\n'
              if text.count(marker) != 1:
                  raise SystemExit('0781 integration anchor missing or ambiguous')
              text = text.replace(marker, marker + entry + '\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_development_integration_0732.py
          git commit -m "Register 0782 development integration checker"
          git push origin HEAD:main

      - name: Publish registrar status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0782-integration-registrar',
              description: passed ? '0782 integration registered' : '0782 integration registration failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
