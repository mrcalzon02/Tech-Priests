name: Generated equipment lifecycle validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit direct 0302 and 0305 lifecycle refresh ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_generated_equipment_lifecycle_hooks_0779.py 2>&1 | tee /tmp/generated-equipment-lifecycle.log

      - name: Retain generated equipment failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-equipment-lifecycle-output
          path: /tmp/generated-equipment-lifecycle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated lifecycle validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-equipment-lifecycle',
              description: passed ? '0302/0305/0306 equipment boundary passed' : '0302/0305/0306 equipment boundary failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
