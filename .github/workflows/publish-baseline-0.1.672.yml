name: Publish baseline 0.1.672

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-baseline-0.1.672.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-baseline-0.1.672
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release automation
        uses: actions/checkout@v4

      - name: Check out immutable 0.1.672 baseline
        uses: actions/checkout@v4
        with:
          ref: 5f548259e018c1a4cf06b782a1fcdf13e11e4fc0
          path: baseline

      - name: Build and verify Factorio release ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import zipfile

          baseline_commit = "5f548259e018c1a4cf06b782a1fcdf13e11e4fc0"
          source = pathlib.Path("baseline/tech-priests_src")
          info_path = source / "info.json"
          if not info_path.is_file():
              raise SystemExit(f"missing baseline metadata: {info_path}")

          info = json.loads(info_path.read_text(encoding="utf-8"))
          if info.get("name") != "tech-priests":
              raise SystemExit(f"unexpected mod name: {info.get('name')!r}")
          if info.get("version") != "0.1.672":
              raise SystemExit(f"unexpected baseline version: {info.get('version')!r}")
          if info.get("factorio_version") != "2.0":
              raise SystemExit(f"unexpected Factorio version: {info.get('factorio_version')!r}")

          package_root = "tech-priests_0.1.672"
          output_dir = pathlib.Path("dist")
          output_dir.mkdir(parents=True, exist_ok=True)
          zip_path = output_dir / f"{package_root}.zip"

          excluded_dirs = {
              ".git", ".github", "__pycache__", ".pytest_cache",
              ".mypy_cache", ".ruff_cache", "node_modules", "build", "dist",
          }
          excluded_suffixes = {".pyc", ".pyo", ".tmp", ".bak", ".log", ".zip"}

          files = []
          for path in sorted(source.rglob("*")):
              if not path.is_file():
                  continue
              relative = path.relative_to(source)
              if any(part in excluded_dirs for part in relative.parts):
                  continue
              if path.name in {".DS_Store", "Thumbs.db"}:
                  continue
              if path.suffix.lower() in excluded_suffixes:
                  continue
              files.append(path)

          required = {"info.json", "control.lua"}
          present = {path.relative_to(source).as_posix() for path in files}
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f"baseline source missing required files: {missing}")
          if not files:
              raise SystemExit("baseline source produced an empty package")

          with zipfile.ZipFile(
              zip_path,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as archive:
              for path in files:
                  relative = path.relative_to(source).as_posix()
                  archive.write(path, f"{package_root}/{relative}")

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failure at {bad}")
              names = archive.namelist()
              roots = {name.split("/", 1)[0] for name in names if name}
              if roots != {package_root}:
                  raise SystemExit(f"unexpected ZIP roots: {sorted(roots)}")
              for required_path in (
                  f"{package_root}/info.json",
                  f"{package_root}/control.lua",
              ):
                  if required_path not in names:
                      raise SystemExit(f"ZIP missing {required_path}")
              packaged_info = json.loads(
                  archive.read(f"{package_root}/info.json").decode("utf-8")
              )
              if packaged_info.get("version") != "0.1.672":
                  raise SystemExit("packaged metadata version changed")

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          checksum_path = output_dir / f"{zip_path.name}.sha256"
          checksum_path.write_text(f"{digest}  {zip_path.name}\n", encoding="utf-8")
          manifest = {
              "release": "v0.1.672",
              "source_commit": baseline_commit,
              "package": zip_path.name,
              "sha256": digest,
              "factorio_version": "2.0",
              "historical_baseline": True,
              "contains_0.1.674_dev_work": False,
          }
          (output_dir / "release-manifest-0.1.672.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Built {zip_path} from {baseline_commit}")
          print(f"SHA256 {digest}")
          PY

      - name: Publish or replace v0.1.672 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.672"
          zip="dist/tech-priests_0.1.672.zip"
          checksum="dist/tech-priests_0.1.672.zip.sha256"
          manifest="dist/release-manifest-0.1.672.json"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${zip}" "${checksum}" "${manifest}" --clobber
            gh release edit "${tag}" \
              --target 5f548259e018c1a4cf06b782a1fcdf13e11e4fc0 \
              --title "Tech Priests v0.1.672" \
              --notes "Historical packaged baseline built from immutable commit 5f548259e018c1a4cf06b782a1fcdf13e11e4fc0. This release does not contain the unfinished 0.1.674-dev integration lane. The ZIP is formatted for direct Factorio mod installation; SHA-256 and a release manifest are attached."
          else
            gh release create "${tag}" "${zip}" "${checksum}" "${manifest}" \
              --target 5f548259e018c1a4cf06b782a1fcdf13e11e4fc0 \
              --title "Tech Priests v0.1.672" \
              --notes "Historical packaged baseline built from immutable commit 5f548259e018c1a4cf06b782a1fcdf13e11e4fc0. This release does not contain the unfinished 0.1.674-dev integration lane. The ZIP is formatted for direct Factorio mod installation; SHA-256 and a release manifest are attached."
          fi

      - name: Record verified release publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib

          manifest = json.loads(
              pathlib.Path("dist/release-manifest-0.1.672.json").read_text(encoding="utf-8")
          )
          receipt = {
              "schema": "tech-priests-release-publication-v1",
              "release": "v0.1.672",
              "asset": "tech-priests_0.1.672.zip",
              "source_commit": "5f548259e018c1a4cf06b782a1fcdf13e11e4fc0",
              "automation_commit": os.environ["GITHUB_SHA"],
              "sha256": manifest["sha256"],
              "published_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "historical_baseline": True,
              "contains_0.1.674_dev_work": False,
          }
          path = pathlib.Path("docs/releases/v0.1.672-published.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/releases/v0.1.672-published.json
          if git diff --cached --quiet; then
            echo "Release receipt already current."
            exit 0
          fi
          git commit -m "Record v0.1.672 baseline release publication"
          git push origin HEAD:main
