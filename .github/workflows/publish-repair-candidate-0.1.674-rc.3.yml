name: Publish repair candidate 0.1.674 RC3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-repair-candidate-0.1.674-rc.3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-repair-candidate-0.1.674-rc.3
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.1.674
  RELEASE_TAG: v0.1.674-rc.3
  PACKAGE_ROOT: tech-priests_0.1.674
  PACKAGE_FILE: tech-priests_0.1.674.zip

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repaired main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.2

      - name: Parse runtime source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find tech-priests_src -type f -name '*.lua' -print0 | sort -z)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            luac5.2 -p "${file}"
          done
          test ! -e tech-priests_src/scripts/core/ammo_scavenge_priority_0740.lua
          grep -q 'pending_request_waiting' tech-priests_src/scripts/core/emergency_supply_reserve_0497.lua
          grep -q 'gate_pending' tech-priests_src/scripts/core/infrastructure_first_governor_0640.lua
          grep -q 'consecration_supply_latch_0246' tech-priests_src/scripts/generated/control_legacy_part_013.lua
          grep -q 'local audited_pairs = 0' tech-priests_src/scripts/core/development_integration_audit_0721.lua
          grep -q 'development_audit_services_reenabled' tech-priests_src/scripts/core/hardener_installation_audit_0723.lua
          grep -q 'publish_diagnostics_globals' tech-priests_src/scripts/core/diagnostics_behavior_authority_0468.lua

      - name: Build verified RC3 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p "build/${PACKAGE_ROOT}" dist
          cp -a tech-priests_src/. "build/${PACKAGE_ROOT}/"
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import zipfile

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          package_root = os.environ["PACKAGE_ROOT"]
          package_file = os.environ["PACKAGE_FILE"]
          source_commit = os.environ["GITHUB_SHA"]
          package_dir = pathlib.Path("build") / package_root

          if package_root != f"tech-priests_{version}":
              raise SystemExit(f"invalid package root: {package_root}")
          if package_file != f"{package_root}.zip":
              raise SystemExit(f"invalid package file: {package_file}")
          if "-" in package_root.removeprefix("tech-priests"):
              raise SystemExit("package root must use underscore version separator")

          info_path = package_dir / "info.json"
          info = json.loads(info_path.read_text(encoding="utf-8"))
          if info.get("name") != "tech-priests" or info.get("factorio_version") != "2.0":
              raise SystemExit("unexpected mod metadata")
          if info.get("version") != "0.1.672":
              raise SystemExit(f"unexpected protected source version: {info.get('version')!r}")
          info["version"] = version
          info["description"] = (
              str(info.get("description") or "").rstrip()
              + " Repair candidate RC3 adds hard request backoff for emergency supply, bootstrap infrastructure, "
                "and missing consecration supplies; repairs the development audit, conversation voice event "
                "registration, rendering economy install guard, and automatic pair-dump evidence. "
                "Manual clean-world validation remains required."
          )
          info_path.write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")

          marker = {
              "schema": "tech-priests-rc3-repair-candidate-v1",
              "release": tag,
              "package_version": version,
              "source_commit": source_commit,
              "supersedes": "v0.1.674-rc.2",
              "runtime_validation_complete": False,
              "clean_world_manual_validation_required": True,
              "package_identity": {
                  "file": package_file,
                  "root": package_root + "/",
                  "invalid_examples": [
                      "tech-priests-0.1.674.zip",
                      "tech-priests-0.1.674-local-smoke-*.zip",
                  ],
              },
              "repairs": [
                  "single pending/backoff state for unsatisfied critical emergency requests",
                  "infrastructure bootstrap assignment backoff instead of repeated smelter requests",
                  "missing consecration supply latch instead of priority churn",
                  "direct development integration audit pairs shadowing fix",
                  "conversation voice event registry filter/metadata fix",
                  "rendering economy install guard for read-only Factorio rendering API",
                  "automatic pair-dump aliases and install-time pair-dump evidence",
              ],
          }
          (package_dir / "RUNTIME_REPAIR_CANDIDATE.json").write_text(
              json.dumps(marker, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          excluded_dirs = {".git", ".github", "__pycache__", "build", "dist", "node_modules"}
          excluded_suffixes = {".pyc", ".pyo", ".tmp", ".bak", ".log", ".zip"}
          for path in sorted(package_dir.rglob("*"), reverse=True):
              if path.is_dir() and path.name in excluded_dirs:
                  shutil.rmtree(path)
              elif path.is_file() and (path.suffix.lower() in excluded_suffixes or path.name in {".DS_Store", "Thumbs.db"}):
                  path.unlink()

          required = [
              package_dir / "control.lua",
              package_dir / "info.json",
              package_dir / "RUNTIME_REPAIR_CANDIDATE.json",
              package_dir / "scripts/core/emergency_supply_reserve_0497.lua",
              package_dir / "scripts/core/infrastructure_first_governor_0640.lua",
              package_dir / "scripts/core/development_integration_audit_0721.lua",
              package_dir / "scripts/core/diagnostics_behavior_authority_0468.lua",
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"missing RC3 package file: {path}")
          if (package_dir / "scripts/core/ammo_scavenge_priority_0740.lua").exists():
              raise SystemExit("regressive 0740 module is still packaged")

          zip_path = pathlib.Path("dist") / package_file
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(package_dir.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(package_dir.parent).as_posix())

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failure at {bad}")
              names = set(archive.namelist())
              roots = {name.split("/", 1)[0] for name in names if name}
              if roots != {package_root}:
                  raise SystemExit(f"unexpected ZIP roots: {sorted(roots)}")
              packaged_info = json.loads(archive.read(f"{package_root}/info.json"))
              packaged_marker = json.loads(archive.read(f"{package_root}/RUNTIME_REPAIR_CANDIDATE.json"))
              if packaged_info.get("name") != "tech-priests":
                  raise SystemExit("packaged name mismatch")
              if packaged_info.get("version") != version:
                  raise SystemExit("packaged version mismatch")
              if packaged_marker["package_identity"]["file"] != package_file:
                  raise SystemExit("package identity marker mismatch")
              if f"{package_root}/scripts/core/ammo_scavenge_priority_0740.lua" in names:
                  raise SystemExit("regressive module present in ZIP")

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          pathlib.Path(f"dist/{package_file}.sha256").write_text(
              f"{digest}  {package_file}\n", encoding="utf-8"
          )
          manifest = {
              "schema": "tech-priests-github-prerelease-v1",
              "release": tag,
              "version": version,
              "package": package_file,
              "package_root": package_root,
              "source_commit": source_commit,
              "sha256": digest,
              "factorio_version": "2.0",
              "prerelease": True,
              "runtime_validation_complete": False,
              "clean_world_manual_validation_required": True,
              "supersedes": "v0.1.674-rc.2",
              "built_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          pathlib.Path("dist/release-manifest-0.1.674-rc.3.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(digest)
          PY

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat >"${notes_file}" <<'EOF'
          ## Tech Priests v0.1.674 Repair Candidate RC3

          **RC2 is superseded. Use only the attached `tech-priests_0.1.674.zip` artifact.**

          RC3 repairs the unproductive behavior loops found in RC1/RC2 logs:
          - emergency ammo/supply requests now latch and back off while unsatisfied;
          - bootstrap infrastructure requests now stay pending instead of reassigning the same smelter/material task repeatedly;
          - missing consecration supplies now enter a wait state instead of flipping priority modes every tick;
          - the development integration audit `pairs` shadowing crash is fixed directly and the audit is re-enabled;
          - conversation voice event registration and rendering economy install failures are repaired;
          - automatic `PAIR-DUMP-0468` evidence is emitted at install time and through the diagnostics authority.

          Packaging note: Factorio requires the archive file and top-level archive root to follow the exact `name_version` convention. The valid RC3 artifact is `tech-priests_0.1.674.zip` with `tech-priests_0.1.674/` inside it. Hyphenated or smoke-suffixed names are invalid and are not release evidence.

          Runtime and behavioral validation remain pending. Acceptance requires a clean new world, manually placed fresh Tech Priest stations, and unedited logs from that clean operational state.
          EOF

          assets=(
            "dist/${PACKAGE_FILE}"
            "dist/${PACKAGE_FILE}.sha256"
            "dist/release-manifest-0.1.674-rc.3.json"
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Tech Priests v0.1.674 Repair Candidate RC3" \
              --notes-file "${notes_file}" \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Tech Priests v0.1.674 Repair Candidate RC3" \
              --notes-file "${notes_file}" \
              --prerelease
          fi

      - name: Verify release and record receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json tagName,isPrerelease,url,assets > dist/github-release.json
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib

          release = json.loads(pathlib.Path("dist/github-release.json").read_text())
          manifest = json.loads(pathlib.Path("dist/release-manifest-0.1.674-rc.3.json").read_text())
          assert release["tagName"] == os.environ["RELEASE_TAG"]
          assert release["isPrerelease"] is True
          assets = {asset["name"] for asset in release.get("assets", [])}
          required = {
              os.environ["PACKAGE_FILE"],
              os.environ["PACKAGE_FILE"] + ".sha256",
              "release-manifest-0.1.674-rc.3.json",
          }
          missing = sorted(required - assets)
          if missing:
              raise SystemExit(f"missing release assets: {missing}")
          receipt = {
              "schema": "tech-priests-release-publication-v1",
              "release": os.environ["RELEASE_TAG"],
              "release_url": release["url"],
              "asset": os.environ["PACKAGE_FILE"],
              "package_root": os.environ["PACKAGE_ROOT"],
              "source_commit": os.environ["GITHUB_SHA"],
              "sha256": manifest["sha256"],
              "published_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "github_release_verified": True,
              "prerelease": True,
              "runtime_validation_complete": False,
              "clean_world_manual_validation_required": True,
              "supersedes": "v0.1.674-rc.2",
          }
          path = pathlib.Path("docs/releases/v0.1.674-rc.3-published.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(release["url"])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/releases/v0.1.674-rc.3-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Record v0.1.674 RC3 repair candidate publication"
            git push origin HEAD:main
          fi
