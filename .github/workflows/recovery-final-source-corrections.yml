name: Final recovery source corrections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recovery-final-source-corrections.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-recovery-source-corrections
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply asserted in-place corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tech-priests_src/scripts/core/order_queue_0469.lua"): [
                  (
                      'merge(o,patch);o.kind=nk;',
                      'merge(o,patch);if patch.clear_task==true then o.task=nil end;o.kind=nk;',
                  ),
              ],
              Path("tech-priests_src/scripts/core/direct_acquisition_executor_0513.lua"): [
                  (
                      'return ok and d~=false,ok and(detail or d)or d',
                      'return ok and d==true,ok and(detail or d)or d',
                  ),
                  (
                      'clear_target=true,task=nil,priority=540',
                      'clear_target=true,clear_task=true,priority=540',
                  ),
                  (
                      'clear_due(t);t.current=nil;t.station_craft_pending_0337=true;',
                      'clear_due(t);t.current=nil;if key~="emergency_craft"then p.emergency_craft=t;p[key]=nil end;t.station_craft_pending_0337=true;',
                  ),
              ],
              Path("tech-priests_src/scripts/core/consecration_executor_0515.lua"): [
                  (
                      'return ok and v~=false, ok and (why or v) or v',
                      'return ok and v==true, ok and (why or v) or v',
                  ),
              ],
              Path("tech-priests_src/scripts/core/emergency_production_executor_0514.lua"): [
                  (
                      'if not(ok and a~=false)then phase(p,"movement-request-failed",a);return false end;',
                      'if not(ok and a==true)then phase(p,"movement-request-failed",a);return false end;',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          checker = Path("tools/check_recovery_architecture_0744.py")
          text = checker.read_text(encoding="utf-8")
          marker = "\n\ndef validate_stage2(text: dict[str, str], errors: list[str]) -> None:\n"
          if marker not in text:
              raise SystemExit("recovery checker Stage 2 marker missing")
          block = '''

    movement_contracts = {
        "direct": "return ok and d==true,ok and(detail or d)or d",
        "consecration": "return ok and v==true, ok and (why or v) or v",
        "emergency": "if not(ok and a==true)then phase(p,\\"movement-request-failed\\",a);return false end;",
        "order": "if patch.clear_task==true then o.task=nil end",
    }
    for name, fragment in movement_contracts.items():
        if fragment not in text[name]:
            errors.append(
                f"{FILES[name].relative_to(ROOT)}: missing strict recovery handoff: {fragment}"
            )
    for fragment in (
        "clear_target=true,clear_task=true",
        'if key~="emergency_craft"then p.emergency_craft=t;p[key]=nil end',
    ):
        if fragment not in text["direct"]:
            errors.append(
                f"{FILES['direct'].relative_to(ROOT)}: missing canonical acquisition-to-production cleanup: {fragment}"
            )
'''
          if "movement_contracts = {" in text:
              raise SystemExit("strict movement contract checks already present")
          text = text.replace(marker, block + marker, 1)
          checker.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow from repaired tree
        run: rm .github/workflows/recovery-final-source-corrections.yml

      - name: Install Lua 5.2 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.2

      - name: Parse every Lua source file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find tech-priests_src -type f -name '*.lua' -print0 | sort -z)
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do
            luac5.2 -p "$file"
          done

      - name: Validate complete source recovery suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool tech-priests_src/info.json >/dev/null
          python3 -m compileall -q tools
          python3 tools/check_governance_prerequisites_0738.py .
          python3 tools/check_recovery_architecture_0744.py .
          python3 tools/audit_ups_hotspots_0743.py --root tech-priests_src --json /tmp/ups.json --markdown /tmp/ups.md --print-summary --check-baseline
          python3 tools/check_inventory_insert_safety_0638.py .
          python3 tools/check_development_integration_0732.py .
          python3 tools/check_migration_lifecycle_integration_0736.py .
          python3 tools/check_migration_runtime_evidence_0737.py --self-test
          python3 tools/check_recovery_runtime_evidence_0747.py --self-test
          python3 tools/create_recovery_evidence_template_0748.py aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --self-test
          python3 tools/check_recovery_evidence_wiring_0749.py
          python3 tools/check_release_workflows_0746.py .

      - name: Commit validated corrections to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce strict movement and production handoff truth"
          git push origin HEAD:main
