name: Consolidate generated GUI ownership 0783

on:
  push:
    branches:
      - main
    paths:
      - .github/0783-generated-gui-trigger.txt

permissions:
  contents: write
  statuses: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Retire 0310 side-panel and duplicate GUI router family
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tech-priests_src/scripts/generated/control_legacy_part_021.lua')
          text = path.read_text(encoding='utf-8')

          side_panel = re.compile(
              r'-- Reopen the visible grid as a side-panel only\..*?\nend\n\nfunction tech_priests_0310_find_pair_from_event_entity',
              re.S,
          )
          text, count = side_panel.subn(
              '-- 0.1.674-dev: the 0310 side-panel replacement is retired.\n'
              'TECH_PRIESTS_0310_GRID_SIDE_PANEL_OVERRIDE_RETIRED = true\n\n'
              'function tech_priests_0310_find_pair_from_event_entity',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'0310 side-panel retirement count={count}')

          router_family = re.compile(
              r'function tech_priests_0310_on_gui_opened\(event\).*?\nend\n\n'
              r'function tech_priests_0310_on_gui_closed\(event\).*?\nend\n\n'
              r'function tech_priests_0310_on_gui_click\(event\).*?\nend\n\n'
              r'-- Re-register the GUI family after 0\.1\.306.*?\nend\n',
              re.S,
          )
          text, count = router_family.subn(
              '-- 0.1.674-dev: canonical 0306 owns the sole generated GUI router family.\n'
              'TECH_PRIESTS_0310_GUI_ROUTER_WRAPPERS_RETIRED = true\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'0310 GUI router retirement count={count}')

          forbidden = (
              'TECH_PRIESTS_PRE_OPEN_GRID_0306_FOR_0310',
              'function tech_priests_0306_open_gui(player, pair)',
              'function tech_priests_0310_on_gui_opened(event)',
              'function tech_priests_0310_on_gui_closed(event)',
              'function tech_priests_0310_on_gui_click(event)',
              'TechPriestsGuiRouter.register("opened", tech_priests_0310_on_gui_opened)',
              'TechPriestsGuiRouter.register("closed", tech_priests_0310_on_gui_closed)',
              'TechPriestsGuiRouter.register("click", tech_priests_0310_on_gui_click)',
          )
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'0310 GUI residue remains: {item}')
          path.write_text(text, encoding='utf-8')

          history = Path('docs/DEVELOPMENT_HISTORY.md')
          history_text = history.read_text(encoding='utf-8')
          heading = '### Consolidated generated GUI ownership into canonical `0306`\n'
          if heading not in history_text:
              history_text += '''\n\n### Consolidated generated GUI ownership into canonical `0306`\n\n`0310` still replaced `tech_priests_0306_open_gui` to reopen the abandoned scripted equipment side panel and registered a second opened/closed/click handler family. Canonical `0306` already preserves the normal Cogitator inventory, clears obsolete scripted frames, applies ranked names, and forwards command-overview clicks through one GUI-router registration family. The later `0310` side-panel replacement and duplicate router handlers are retired; the `0310` overview-click helper remains available to canonical `0306`. The declarative graph remains **26 active hardeners and 47 explicitly retired source-only authorities**.\n\nThis is source implementation only. Complete Source validation and Factorio runtime evidence remain separately required.\n'''
              history.write_text(history_text, encoding='utf-8')
          PY

          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src/scripts/generated/control_legacy_part_021.lua docs/DEVELOPMENT_HISTORY.md
          git commit -m "Consolidate generated GUI ownership"
          git push origin HEAD:main

      - name: Publish consolidator status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0783-gui-consolidator',
              description: passed ? 'Generated GUI ownership consolidated' : 'Generated GUI consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
