name: Diagnose 0505 retirement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-0505-retirement-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Capture deterministic failure
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/0505-retirement-diagnostic.txt 2>&1
          import base64
          import pathlib
          import re
          import traceback
          import zlib

          workflow = pathlib.Path('.github/workflows/apply-0505-retirement-temp.yml').read_text(encoding='utf-8')
          match = re.search(r"payload = '''(.*?)'''", workflow, re.S)
          if not match:
              raise SystemExit('embedded 0505 payload not found')
          try:
              code = zlib.decompress(base64.b64decode(match.group(1))).decode()
              exec(code, {'__name__': '__main__'})
          except BaseException:
              traceback.print_exc()
              raise
          PY
          code=$?
          {
            echo
            echo "exit_code=${code}"
            echo '=== git status ==='
            git status --short
            echo '=== diff stat ==='
            git diff --stat
          } >> /tmp/0505-retirement-diagnostic.txt
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: retirement-0505-diagnostic
          path: /tmp/0505-retirement-diagnostic.txt
          retention-days: 2

      - name: Publish diagnostic status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tech-priests/0505-retirement-diagnostic',
              description: '0505 deterministic failure captured',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });