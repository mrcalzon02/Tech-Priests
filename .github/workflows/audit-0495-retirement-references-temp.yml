name: Audit 0495 retirement references

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-0495-retirement-references-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect 0495 and graph references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          {
            echo '=== live 0495 references ==='
            grep -R -n -E 'pair_link_hardening_0495|TechPriestsPairLinkHardening0495|tp-pair-link-0495|link_0495' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== current 38-count references ==='
            grep -R -n -E 'retired_authority_count=38|26-active / 38-retired|26 active hardeners and 38|38 retired source-only|38 source-preserved|Thirty-eight files|38 explicitly retired' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
          } > /tmp/audit/0495-retirement-references.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-0495-reference-audit
          path: /tmp/audit/0495-retirement-references.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0495-reference-audit',
              description: passed ? '0495 reference audit complete' : '0495 reference audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
