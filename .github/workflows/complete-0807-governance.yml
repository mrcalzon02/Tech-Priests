name: Complete Milestone 0807 governance registration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/complete-0807-governance.yml
  workflow_dispatch:

concurrency:
  group: complete-milestone-0807-governance
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  statuses: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Register Milestone 0807 in canonical governance
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          implementation_sha = "64a35abe1244310561d736f272eda1179a80fd2c"
          checker_sha = "223f47558a4db07a12ca3524fd16a441b34c951e"
          validation_lane_sha = "28a875c3f9bd5b333a81710d43d564c674e39bd2"

          workflow = Path(".github/workflows/source-validation.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          old = """      - name: Audit canonical infrastructure route ownership
        run: python3 tools/check_infrastructure_route_ownership_0806.py

      - name: Audit development integration graph
"""
          new = """      - name: Audit canonical infrastructure route ownership
        run: python3 tools/check_infrastructure_route_ownership_0806.py

      - name: Audit canonical status-state sanity ownership
        run: python3 tools/check_status_state_sanity_ownership_0807.py

      - name: Audit development integration graph
"""
          if "check_status_state_sanity_ownership_0807.py" not in workflow_text:
              if old not in workflow_text:
                  raise SystemExit("source-validation insertion boundary not found")
              workflow_text = workflow_text.replace(old, new, 1)
              workflow.write_text(workflow_text, encoding="utf-8")

          history = Path("docs/DEVELOPMENT_HISTORY.md")
          history_text = history.read_text(encoding="utf-8")
          history_section = f"""

## Milestone 0807 — Status-State Sanity Ownership — 2026-07-26

- `{implementation_sha}` — consolidated `status_state_sanity_0448` under one fail-closed `runtime_event_registry` cadence, removed its raw `script.on_nth_tick` fallback, delayed global and wrapper publication until route acceptance, returned structured service truth, and made the visual-classifier adapter read-only.
- `{checker_sha}` — added `check_status_state_sanity_ownership_0807.py` to forbid raw route fallback, mutable visual classification, publication before route acceptance, and unstructured service results.
- `{validation_lane_sha}` — added the dedicated ownership validation lane. At this exact source head, `tech-priests/status-state-sanity-ownership` passed in workflow run `30190776270`, and the then-current full `tech-priests/source-validation` passed in run `30190776290`.

The focused checker is now registered in canonical Source validation. This is static source evidence only. No Factorio load, configuration-change, migration, save/reload, behavioral, profiler, packaging, or release claim is made. The next bounded source audit is station supply and inventory stewardship ownership, beginning with `station_supply_satisfaction_0639`, `emergency_supply_reserve_0497`, `inventory_steward_0357`, and `stone_cache_filter_0534`.
"""
          if "## Milestone 0807 — Status-State Sanity Ownership" not in history_text:
              history.write_text(history_text.rstrip() + history_section + "\n", encoding="utf-8")

          testing = Path("tech-priests_src/docs/CURRENT_TESTING_GOALS.md")
          testing_text = testing.read_text(encoding="utf-8")
          testing_section = """

## Milestone 0807 — Status-state sanity ownership

- `status_state_sanity_0448` owns one named 31-tick `runtime_event_registry` cadence and has no raw timer fallback.
- Installation fails closed before global or wrapper publication when canonical route ownership is unavailable or rejected.
- The visual-classifier adapter is read-only; stale combat-state mutation remains in the cadence-owned service rather than display classification.
- The service reports structured `processed`, `acted`, `blocked`, `failed`, and `exhausted` truth.
- The focused checker is registered in canonical Source validation.
- Static validation is not Factorio runtime proof.

The next live target is new-save and protected-upgrade evidence that invalid or friendly combat targets are cleared through the canonical cadence, visual classification never mutates pair state, configuration changes do not duplicate the route, and save/reload preserves consistent idle/combat status. The next bounded source tranche audits station supply and inventory stewardship routes before Gate 2 evidence collection proceeds.
"""
          if "## Milestone 0807 — Status-state sanity ownership" not in testing_text:
              testing.write_text(testing_text.rstrip() + testing_section + "\n", encoding="utf-8")

          authority = Path("docs/RECOVERY_AUTHORITY_MAP_CURRENT.md")
          authority_text = authority.read_text(encoding="utf-8")
          authority_section = """

## Milestone 0807 — Status-State Sanity Ownership

```mermaid
flowchart LR
    Registry[runtime_event_registry] -->|31-tick named route| Sanity[status_state_sanity_0448]
    Sanity --> Mutation[stale combat-state cleanup]
    Visual[classify_priest_visual_state adapter] -->|read-only observation| Display[combat or idle visual state]
```

`status_state_sanity_0448` owns one fail-closed registry cadence named `stale-combat-status-sanity`. Route acceptance occurs before global or wrapper publication. The visual classifier no longer calls the mutating inspection path; it only suppresses a stale combat presentation when the observed target is not hostile. No raw `script.on_nth_tick` fallback remains. This is source ownership evidence only.
"""
          if "## Milestone 0807 — Status-State Sanity Ownership" not in authority_text:
              authority.write_text(authority_text.rstrip() + authority_section + "\n", encoding="utf-8")

          recovery = Path("RECOVERY_REPAIR_SEQUENCE.md")
          recovery_text = recovery.read_text(encoding="utf-8")
          recovery_section = """

Source implementation has now consolidated `status_state_sanity_0448` under one fail-closed canonical registry cadence. Its raw timer fallback is removed, publication follows route acceptance, service results are structured, and visual classification is read-only. Milestone 0807 has focused static validation but remains without Factorio runtime proof. The next bounded source audit targets station supply and inventory stewardship ownership before Gate 2 evidence collection.
"""
          if "Source implementation has now consolidated `status_state_sanity_0448`" not in recovery_text:
              marker = "\n# Completion and Retirement\n"
              if marker not in recovery_text:
                  raise SystemExit("recovery completion boundary not found")
              recovery_text = recovery_text.replace(marker, recovery_section + marker, 1)
              recovery.write_text(recovery_text, encoding="utf-8")

          carrier = Path(".github/workflows/complete-0807-governance.yml")
          if carrier.exists():
              carrier.unlink()
          PY

          python3 tools/check_status_state_sanity_ownership_0807.py
          python3 -m compileall -q tools

          git config user.name "Tech Priests Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/source-validation.yml \
            docs/DEVELOPMENT_HISTORY.md \
            docs/RECOVERY_AUTHORITY_MAP_CURRENT.md \
            RECOVERY_REPAIR_SEQUENCE.md \
            tech-priests_src/docs/CURRENT_TESTING_GOALS.md \
            .github/workflows/complete-0807-governance.yml
          git diff --cached --check
          git commit -m "Register Milestone 0807 governance"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch exact-head Source validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/source-validation.yml/dispatches" \
            -f ref=main

      - name: Publish governance carrier status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/milestone-0807-governance-carrier',
              description: passed ? 'Milestone 0807 governance registered' : 'Milestone 0807 governance carrier failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
