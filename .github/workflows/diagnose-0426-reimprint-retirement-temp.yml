name: Diagnose corrected 0426 reimprint retirement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-0426-reimprint-retirement-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Capture corrected deterministic failure
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/0426-retirement-diagnostic.txt 2>&1
          import base64,pathlib,re,traceback,zlib
          workflow=pathlib.Path('.github/workflows/apply-0426-reimprint-retirement-temp.yml').read_text(encoding='utf-8')
          match=re.search(r"payload = '''(.*?)'''",workflow,re.S)
          if not match: raise SystemExit('embedded payload not found')
          code=zlib.decompress(base64.b64decode(match.group(1))).decode()
          old='''insert_after(planning,' ["scripts.core.behavior_execution_doctrine_0505"]="facility-first production and timed station fallback are native to emergency_production_executor_0514; direct target, movement, and lifecycle wrappers are obsolete",\\n',' ["scripts.core.pair_death_and_respawn"]="priest death and re-imprint observation belong to 0499; completion uses broker-owned 0503 while generated 0298 remains presentation-only",\\n')'''
          new='''insert_after(planning,'  ["scripts.core.behavior_execution_doctrine_0505"]="facility-first and visible timed production are native to emergency_production_executor_0514; direct, movement, lifecycle, visual, command, and timer wrappers are obsolete",\\n','  ["scripts.core.pair_death_and_respawn"]="priest death and re-imprint observation belong to 0499; completion uses broker-owned 0503 while generated 0298 remains presentation-only",\\n')'''
          if old not in code: raise SystemExit('planning patch source anchor missing')
          code=code.replace(old,new,1)
          old_cleanup='''  clear_stuck_recovery_flags(pair)\n  record("priest-reimprint-started", pair, "reason=" .. safe(reason) .. " finish=" .. safe(state and state.finish_tick))'''
          new_cleanup='''  for _, key in ipairs({"lost_priest_0490","missing_priest_rescue_0490","pending_recall","recalling","force_recall","movement_stuck_0418","movement_stabilizer_0417","movement_lockdown_0416","stuck_since","space_missing_priest_seen_0204","direct_target_lease_0414"}) do pair[key] = nil end\n  record("priest-reimprint-started", pair, "reason=" .. safe(reason) .. " finish=" .. safe(state and state.finish_tick))'''
          if old_cleanup not in code: raise SystemExit('reimprint lexical cleanup anchor missing')
          code=code.replace(old_cleanup,new_cleanup,1)
          try:
            exec(code,{'__name__':'__main__'})
          except BaseException:
            traceback.print_exc()
            raise
          PY
          code=$?
          {
            echo
            echo "exit_code=${code}"
            echo '=== git status ==='
            git status --short
            echo '=== diff stat ==='
            git diff --stat
          } >> /tmp/0426-retirement-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-0426-corrected-diagnostic
          path: /tmp/0426-retirement-diagnostic.txt
          retention-days: 2
      - name: Publish diagnostic status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'tech-priests/0426-corrected-diagnostic',description:'Corrected 0426 failure captured',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});