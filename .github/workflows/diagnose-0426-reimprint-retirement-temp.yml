name: Diagnose 0426 reimprint retirement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-0426-reimprint-retirement-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Capture deterministic failure
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/0426-retirement-diagnostic.txt 2>&1
          import base64,pathlib,re,traceback,zlib
          workflow=pathlib.Path('.github/workflows/apply-0426-reimprint-retirement-temp.yml').read_text(encoding='utf-8')
          match=re.search(r"payload = '''(.*?)'''",workflow,re.S)
          if not match: raise SystemExit('embedded payload not found')
          try:
            exec(zlib.decompress(base64.b64decode(match.group(1))).decode(),{'__name__':'__main__'})
          except BaseException:
            traceback.print_exc()
            raise
          PY
          code=$?
          {
            echo
            echo "exit_code=${code}"
            echo '=== git status ==='
            git status --short
            echo '=== diff stat ==='
            git diff --stat
          } >> /tmp/0426-retirement-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-0426-diagnostic
          path: /tmp/0426-retirement-diagnostic.txt
          retention-days: 2
      - name: Publish diagnostic status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'tech-priests/0426-retirement-diagnostic',description:'0426 deterministic failure captured',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});