name: Publish Tech Priests 1.0 to Factorio Mod Portal (owner controlled)
on:
  workflow_dispatch:
    inputs:
      confirmed_third_party_redistribution_rights:
        description: 'I have verified permission to redistribute ALL bundled third-party game textures/models'
        type: boolean
        default: false
        required: true
permissions:
  contents: write
concurrency:
  group: factorio-modportal-tech-priests-v1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mrcalzon02/Tech-Priests' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      PRIMARY_API_KEY: ${{ secrets.MOD_PORTAL_PUBLISH_API_KEY }}
      FALLBACK_API_KEY: ${{ secrets.MOD_UPLOAD_API_KEY }}
      EDIT_API_KEY: ${{ secrets.MOD_PORTAL_EDIT_API_KEY }}
      OWNER_ASSERTS_RIGHTS: ${{ inputs.confirmed_third_party_redistribution_rights }}
      ASSET_ID: '790463556'
      ARCHIVE_NAME: 'tech-priests_1.0.0.zip'
      ARCHIVE_BYTES: '2139214029'
      ARCHIVE_SHA256: '709c243a17466d42e8a554e99f344dfa1b05e0d68db5b29b5002dfff0db549b1'
      ORIGIN_SHA: 'e694f0d97b174f66e49fc2b4c4d1eb8b914a5b13'
    steps:
      - name: Authority and immutability preflight (no large downloads)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OWNER_ASSERTS_RIGHTS" != true ]; then
            echo 'BLOCKED: Third-party Gladius sprite redistribution permission not confirmed. No upload attempted.'
            exit 1
          fi
          if [ -z "$PRIMARY_API_KEY" ] && [ -z "$FALLBACK_API_KEY" ]; then
            echo 'BLOCKED: Add GitHub Actions secret MOD_PORTAL_PUBLISH_API_KEY with Factorio ModPortal: Publish Mods permission.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-list.json
          python3 - <<'PY'
          import json,os
          releases=json.load(open('release-list.json'))
          candidates=[x for x in releases if x.get('tag_name')=='v1.0.0-rc.1']
          assert len(candidates)==1 and candidates[0]['draft'] and candidates[0]['prerelease']
          assets={x['name']:x for x in candidates[0]['assets']}
          z=assets[os.environ['ARCHIVE_NAME']]
          assert z['id']==int(os.environ['ASSET_ID'])
          assert z['size']==int(os.environ['ARCHIVE_BYTES'])
          assert z['digest']=='sha256:'+os.environ['ARCHIVE_SHA256']
          print('TP_FACTORIO_PORTAL_ARCHIVE_ASSET_PIN_VERIFIED',z['id'],z['size'])
          PY
          # The public mod name must not already exist; never overwrite someone else's listing.
          status="$(curl --silent --show-error --location --output existing.json --write-out '%{http_code}' --max-time 30 \
            'https://mods.factorio.com/api/mods/tech-priests/full')"
          if [ "$status" = 200 ]; then
            echo 'BLOCKED: A Tech-Priests page now exists. Verify owner and use the upload-release endpoint instead.'
            exit 1
          elif [ "$status" != 404 ]; then
            echo "BLOCKED: Mod Portal listing lookup returned HTTP $status"
            exit 1
          fi
          echo 'TP_FACTORIO_PORTAL_NEW_LISTING_CONFIRMED'

      - name: Load approved public description without full repository checkout
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 45 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/docs/releases/modportal-1.0-publish-copy.md" \
            -o description.md
          test -s description.md
          ! grep -Eq 'private-user-images|Dens-Mortis' description.md
          echo 'TP_FACTORIO_PORTAL_DESCRIPTION_READY'

      - name: Download and digest-check one exact GitHub draft release asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 2400 --connect-timeout 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -o "$ARCHIVE_NAME"
          test "$(stat -c '%s' "$ARCHIVE_NAME")" = "$ARCHIVE_BYTES"
          echo "$ARCHIVE_SHA256  $ARCHIVE_NAME" | sha256sum --check
          python3 - <<'PY'
          import json,os,zipfile
          name=os.environ['ARCHIVE_NAME']
          with zipfile.ZipFile(name) as z:
            root='tech-priests_1.0.0/'
            assert json.loads(z.read(root+'info.json'))['version']=='1.0.0'
            assert root+'THIRD-PARTY-NOTICES-GLADIUS.txt' in z.namelist()
          print('TP_FACTORIO_PORTAL_PACKAGE_INPUT_VERIFIED',name)
          PY

      - name: Upload new Factorio mod page with official API
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_API_KEY:-$FALLBACK_API_KEY}"
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $key" \
            --form 'mod=tech-priests' \
            'https://mods.factorio.com/api/v2/mods/init_publish' -o init.json
          python3 - <<'PY'
          import json,os,urllib.parse
          d=json.load(open('init.json'))
          url=d.get('upload_url','')
          assert not d.get('error'), 'Portal initiation failed: '+str(d.get('error'))
          p=urllib.parse.urlsplit(url)
          assert p.scheme=='https' and p.netloc and p.username is None and p.password is None
          with open(os.environ['GITHUB_ENV'],'a') as f:
            # Do not expose the signed upload URL in logs.
            f.write('FACTORIO_SIGNED_UPLOAD_URL='+url+'\n')
          print('TP_FACTORIO_PORTAL_AUTHORIZED_UPLOAD_URL_RECEIVED')
          PY
          curl --fail-with-body --silent --show-error --retry 1 \
            --connect-timeout 30 --max-time 3200 \
            --form "file=@${ARCHIVE_NAME};type=application/zip" \
            --form 'category=content' \
            --form 'source_url=https://github.com/mrcalzon02/Tech-Priests' \
            --form 'description=<description.md' \
            "$FACTORIO_SIGNED_UPLOAD_URL" \
            -o publish-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('publish-result.json'))
          if d.get('success') is not True:
            raise SystemExit('Portal publish not accepted: '+str(d.get('error'))+' '+str(d.get('message'))[:200])
          print('TP_FACTORIO_PORTAL_UPLOAD_ACCEPTED',json.dumps({k:v for k,v in d.items() if k in ('success','url')}))
          PY

      - name: Verify publicly indexed new mod and exact version 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            curl --fail --silent --show-error --max-time 35 \
              'https://mods.factorio.com/api/mods/tech-priests/full' -o live.json || true
            if python3 - <<'PY'
          import json,sys
          try:d=json.load(open('live.json'))
          except Exception:sys.exit(1)
          versions=[x.get('version') for x in d.get('releases',[])]
          assert d.get('name')=='tech-priests' and '1.0.0' in versions
          print('TP_FACTORIO_MOD_PORTAL_PUBLICATION_VERIFIED',json.dumps({
            'name':d['name'],'title':d.get('title'),'versions':versions[:7]}))
          PY
            then exit 0; fi
            sleep 5
          done
          echo 'Portal accepted upload but public listing/version not yet verifiable; inspect API response before claiming success'
          exit 1
