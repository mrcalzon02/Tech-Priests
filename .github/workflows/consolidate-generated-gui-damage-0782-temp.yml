name: Consolidate generated GUI and damage ownership 0782

on:
  push:
    branches:
      - main
    paths:
      - .github/0782-generated-gui-damage-trigger.txt

permissions:
  contents: write
  statuses: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Retire generated commands and duplicate 0310 damage wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          part21 = Path('tech-priests_src/scripts/generated/control_legacy_part_021.lua')
          text = part21.read_text(encoding='utf-8')

          gui_command = re.compile(
              r'-- Debug command for the reopened inventory/grid issue\..*?\nend\n\ntech_priests_0310_log',
              re.S,
          )
          text, count = gui_command.subn(
              '-- 0.1.674-dev: manual 0310 GUI command is retired; automatic GUI routing remains.\nTECH_PRIESTS_0310_DEBUG_COMMAND_RETIRED = true\n\ntech_priests_0310_log',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'0310 GUI command retirement count={count}')

          marker_command = re.compile(
              r'-- 0\.1\.311: station/chest GUI and glow syntax crash repair marker\.\nTechPriestsDebugCommandRegistry\.add\("tp-0311".*?\nend\)\n',
              re.S,
          )
          text, count = marker_command.subn(
              '-- 0.1.311: station/chest GUI and glow syntax crash repair marker.\nTECH_PRIESTS_0311_DEBUG_COMMAND_RETIRED = true\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'0311 marker command retirement count={count}')

          laser_command = re.compile(
              r'if commands and commands\.add_command then\n\s*pcall\(function\(\)\n\s*TechPriestsDebugCommandRegistry\.add\("tp-laser-0312".*?\n\s*end\)\n\s*end\n\ntech_priests_0312_log',
              re.S,
          )
          text, count = laser_command.subn(
              'TECH_PRIESTS_0312_DEBUG_COMMAND_RETIRED = true\n\ntech_priests_0312_log',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'0312 laser command retirement count={count}')

          damage_wrapper = re.compile(
              r'-- Fast-forward/siege safety:.*?\nif defines and defines\.events and defines\.events\.on_entity_damaged then\n\s*TechPriestsRuntimeEventRegistry\.on_event\(defines\.events\.on_entity_damaged, tech_priests_0310_on_entity_damaged\)\nend\n',
              re.S,
          )
          text, count = damage_wrapper.subn(
              '-- 0.1.674-dev: 0310 station bookkeeping is integrated into canonical 0305.\n-- Its wrapper and second on_entity_damaged registration are retired.\nTECH_PRIESTS_0310_DAMAGE_WRAPPER_RETIRED = true\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'0310 damage wrapper retirement count={count}')

          forbidden = (
              'TechPriestsDebugCommandRegistry.add("tp-gui-0310"',
              'TechPriestsDebugCommandRegistry.add("tp-0311"',
              'TechPriestsDebugCommandRegistry.add("tp-laser-0312"',
              'TECH_PRIESTS_PRE_DAMAGE_0305_FOR_0310',
              'function tech_priests_0310_on_entity_damaged',
              'TechPriestsRuntimeEventRegistry.on_event(defines.events.on_entity_damaged, tech_priests_0310_on_entity_damaged)',
          )
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'generated GUI/damage residue remains: {item}')
          part21.write_text(text, encoding='utf-8')

          cleanup = Path('tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua')
          cleanup_text = cleanup.read_text(encoding='utf-8')
          marker = '  ["tp-upgrades-0313"] = true,\n'
          additions = ''.join(
              f'  ["{name}"] = true,\n'
              for name in ('tp-gui-0310', 'tp-0311', 'tp-laser-0312')
              if f'["{name}"] = true' not in cleanup_text
          )
          if additions:
              if cleanup_text.count(marker) != 1:
                  raise SystemExit('missing generated command cleanup anchor')
              cleanup_text = cleanup_text.replace(marker, marker + additions, 1)
              cleanup.write_text(cleanup_text, encoding='utf-8')

          history = Path('docs/DEVELOPMENT_HISTORY.md')
          history_text = history.read_text(encoding='utf-8')
          heading = '### Retired generated `0310`–`0312` commands and duplicate damage route\n'
          if heading not in history_text:
              history_text += '''\n\n### Retired generated `0310`–`0312` commands and duplicate damage route\n\nThe generated `tp-gui-0310`, `tp-0311`, and `tp-laser-0312` commands exposed manual GUI, marker, and combat-laser paths after automatic runtime ownership was established. Their registrations are removed and stale saved names are handled by `runtime_command_cleanup_0720`. The same slice retires the `0310` damage wrapper and its second `on_entity_damaged` registration because station-damage bookkeeping is already native to canonical `0305`; retaining the wrapper could execute fixed-armor mitigation twice. Automatic GUI routing, fallback-laser behavior, canonical station bookkeeping, and canonical armor mitigation remain. The declarative graph remains **26 active hardeners and 47 explicitly retired source-only authorities**.\n\nThis is source implementation only. Complete Source validation and Factorio runtime evidence remain separately required.\n'''
              history.write_text(history_text, encoding='utf-8')
          PY

          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src/scripts/generated/control_legacy_part_021.lua \
                  tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua \
                  docs/DEVELOPMENT_HISTORY.md
          git commit -m "Retire generated GUI commands and duplicate damage route"
          git push origin HEAD:main

      - name: Publish consolidator status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0782-gui-damage-consolidator',
              description: passed ? 'Generated GUI/damage ownership consolidated' : 'Generated GUI/damage consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
