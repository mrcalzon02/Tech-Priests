name: Status-state sanity ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit status-state sanity ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_status_state_sanity_ownership_0807.py 2>&1 | tee /tmp/status-state-sanity-ownership.log

      - name: Retain status-state sanity ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: status-state-sanity-ownership-output
          path: /tmp/status-state-sanity-ownership.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish status-state sanity ownership status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/status-state-sanity-ownership',
              description: passed ? 'Status-state sanity ownership passed' : 'Status-state sanity ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  governance:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Trigger repaired Milestone 0807 governance job'
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Register Milestone 0807 governance and restore validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          import base64
          from pathlib import Path

          HISTORY = ""
          TESTING = ""
          AUTHORITY = ""
          RECOVERY = ""
          RESTORED = ""

          def decoded(value):
              return base64.b64decode(value).decode("utf-8")

          source_validation = Path(".github/workflows/source-validation.yml")
          source_text = source_validation.read_text(encoding="utf-8")
          old = "      - name: Audit canonical infrastructure route ownership\n        run: python3 tools/check_infrastructure_route_ownership_0806.py\n\n      - name: Audit development integration graph\n"
          new = "      - name: Audit canonical infrastructure route ownership\n        run: python3 tools/check_infrastructure_route_ownership_0806.py\n\n      - name: Audit canonical status-state sanity ownership\n        run: python3 tools/check_status_state_sanity_ownership_0807.py\n\n      - name: Audit development integration graph\n"
          if "check_status_state_sanity_ownership_0807.py" not in source_text:
              if old not in source_text:
                  raise SystemExit("source-validation insertion boundary not found")
              source_validation.write_text(source_text.replace(old, new, 1), encoding="utf-8")

          targets = (
              (Path("docs/DEVELOPMENT_HISTORY.md"), "## Milestone 0807 — Status-State Sanity Ownership", HISTORY, "append"),
              (Path("tech-priests_src/docs/CURRENT_TESTING_GOALS.md"), "## Milestone 0807 — Status-state sanity ownership", TESTING, "append"),
              (Path("docs/RECOVERY_AUTHORITY_MAP_CURRENT.md"), "## Milestone 0807 — Status-State Sanity Ownership", AUTHORITY, "append"),
          )
          for path, marker, payload, mode in targets:
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(text.rstrip() + decoded(payload) + "\n", encoding="utf-8")

          recovery = Path("RECOVERY_REPAIR_SEQUENCE.md")
          recovery_text = recovery.read_text(encoding="utf-8")
          recovery_marker = "Source implementation has now consolidated `status_state_sanity_0448`"
          if recovery_marker not in recovery_text:
              boundary = "\n# Completion and Retirement\n"
              if boundary not in recovery_text:
                  raise SystemExit("recovery completion boundary not found")
              recovery.write_text(recovery_text.replace(boundary, decoded(RECOVERY) + boundary, 1), encoding="utf-8")

          Path(".github/workflows/status-state-sanity-ownership-validation.yml").write_text(decoded(RESTORED), encoding="utf-8")
          for temporary in (Path(".github/workflows/complete-0807-governance.yml"), Path(".github/0807-governance.trigger")):
              if temporary.exists():
                  temporary.unlink()
          PY

          python3 tools/check_status_state_sanity_ownership_0807.py
          python3 -m compileall -q tools
          git config user.name "Tech Priests Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Register Milestone 0807 governance"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch exact-head Source validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/source-validation.yml/dispatches" -f ref=main

      - name: Publish Milestone 0807 governance status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/milestone-0807-governance',
              description: passed ? 'Milestone 0807 governance registered' : 'Milestone 0807 governance failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
