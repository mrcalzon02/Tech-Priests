name: Status-state sanity ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit status-state sanity ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_status_state_sanity_ownership_0807.py 2>&1 | tee /tmp/status-state-sanity-ownership.log

      - name: Retain status-state sanity ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: status-state-sanity-ownership-output
          path: /tmp/status-state-sanity-ownership.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish status-state sanity ownership status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/status-state-sanity-ownership',
              description: passed ? 'Status-state sanity ownership passed' : 'Status-state sanity ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  governance:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Trigger final Milestone 0807 governance job'
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Register Milestone 0807 governance
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/milestone-0807-governance.log) 2>&1
          git pull --ff-only origin main
          python3 tools/complete_0807_governance.py
          python3 tools/check_status_state_sanity_ownership_0807.py
          python3 -m compileall -q tools
          git config user.name "Tech Priests Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Register Milestone 0807 governance"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Retain Milestone 0807 governance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-0807-governance-output
          path: /tmp/milestone-0807-governance.log
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch exact-head Source validation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/source-validation.yml/dispatches" -f ref=main

      - name: Publish Milestone 0807 governance status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/milestone-0807-governance',
              description: passed ? 'Milestone 0807 governance registered' : 'Milestone 0807 governance failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
