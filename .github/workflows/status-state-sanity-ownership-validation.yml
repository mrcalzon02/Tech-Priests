name: Status-state sanity ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit status-state sanity ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_status_state_sanity_ownership_0807.py 2>&1 | tee /tmp/status-state-sanity-ownership.log

      - name: Retain status-state sanity ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: status-state-sanity-ownership-output
          path: /tmp/status-state-sanity-ownership.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish status-state sanity ownership status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/status-state-sanity-ownership',
              description: passed ? 'Status-state sanity ownership passed' : 'Status-state sanity ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  expose_tree:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Expose Milestone 0808 base tree'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Capture root tree SHA
        shell: bash
        run: git rev-parse 'HEAD^{tree}' > /tmp/milestone-0808-base-tree.txt

      - name: Retain root tree SHA
        uses: actions/upload-artifact@v4
        with:
          name: milestone-0808-base-tree
          path: /tmp/milestone-0808-base-tree.txt
          if-no-files-found: error
          retention-days: 7
