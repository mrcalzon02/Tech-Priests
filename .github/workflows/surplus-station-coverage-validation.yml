name: Stocked Cogitator coverage expansion acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/surplus-station-coverage-validation.yml'
      - 'tests/scenarios/surplus-station-coverage/**'
      - 'tech-priests_src/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stocked-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Validate native fixture Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
          luac5.2 -p tests/scenarios/surplus-station-coverage/fixture.lua
          luac5.2 -p tech-priests_src/scripts/core/station_surplus_resupply_1208.lua
          lua5.2 tests/unit/station_surplus_resupply_1208.lua
      - name: Download Factorio 2.0.77 headless
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/factorio.tar.xz" \
            "https://factorio.com/get-download/2.0.77/headless/linux64"
          tar -xJf "$RUNNER_TEMP/factorio.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/factorio/bin/x64/factorio" --version | head -n 1
      - name: Install isolated stock-fed coverage scenario
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stocked-coverage/mods"
          cp -a tech-priests_src "$RUNNER_TEMP/stocked-coverage/mods/tech-priests"
          cp tests/scenarios/surplus-station-coverage/fixture.lua \
            "$RUNNER_TEMP/stocked-coverage/mods/tech-priests/scripts/core/ci_surplus_station_coverage_1207.lua"
          printf '\n-- Isolated native test only, never packaged.\nrequire("scripts.core.ci_surplus_station_coverage_1207").install()\n' \
            >> "$RUNNER_TEMP/stocked-coverage/mods/tech-priests/control.lua"
          printf '%s\n' '{"seed":907260,"peaceful_mode":true,"autoplace_controls":{"enemy-base":{"frequency":"none","size":"none","richness":"none"}}}' \
            > "$RUNNER_TEMP/stocked-coverage/map-gen-settings.json"
      - name: Run real item-funded Junior coverage expansion in Factorio
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/stocked-coverage"
          binary="$RUNNER_TEMP/factorio/bin/x64/factorio"
          "$binary" --mod-directory "$root/mods" \
            --create "$root/initial.zip" \
            --map-gen-settings "$root/map-gen-settings.json" \
            > "$root/create.log" 2>&1 || { cat "$root/create.log"; exit 1; }
          "$binary" --mod-directory "$root/mods" \
            --benchmark "$root/initial.zip" --benchmark-ticks 72500 \
            > "$root/benchmark.log" 2>&1 || { cat "$root/benchmark.log"; exit 1; }
          grep -F '[TP-SURPLUS-COVERAGE]' "$root/benchmark.log" || true
          if grep -Fq '[TP-SURPLUS-COVERAGE] FAIL ' "$root/benchmark.log"; then
            echo 'FAIL: native surplus expansion scenario reported a fatal blocker'
            exit 1
          fi
          grep -Fq '[TP-SURPLUS-COVERAGE] PASS original Junior physically spent one station item' \
            "$root/benchmark.log" || {
              echo 'FAIL: no engine-verified new paired Junior with actual inventory debit'
              exit 1
            }
      - name: Retain native Factorio coverage logs and original save
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-stocked-station-coverage
          path: |
            ${{ runner.temp }}/stocked-coverage/initial.zip
            ${{ runner.temp }}/stocked-coverage/create.log
            ${{ runner.temp }}/stocked-coverage/benchmark.log
          retention-days: 14
          if-no-files-found: warn
