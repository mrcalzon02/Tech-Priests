name: Audit 0506 and 0508 retirement references

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-0506-0508-retirement-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect 0506 and 0508 references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          {
            echo '=== 0506 references ==='
            grep -R -n -E 'mobility_recovery_contract_0506|TechPriestsMobilityRecoveryContract0506|TECH_PRIESTS_0506|lifecycle_0506|physical-direct-acquisition-0506|tp-mobility-recovery-0506' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== 0508 references ==='
            grep -R -n -E 'movement_recovery_authority_0508|TechPriestsMovementRecoveryAuthority0508|TECH_PRIESTS_0508|lifecycle_0508|physical-direct-acquisition-0508|tp-movement-recovery-0508' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== current 41-count references ==='
            grep -R -n -E 'retired_authority_count=41|26-active / 41-retired|26 active hardeners and 41|41 retired source-only|41 source-preserved|Forty-one files|41 explicitly retired' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
          } > /tmp/audit/0506-0508-retirement.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-0506-0508-audit
          path: /tmp/audit/0506-0508-retirement.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0506-0508-reference-audit',
              description: passed ? '0506/0508 reference audit complete' : '0506/0508 reference audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
