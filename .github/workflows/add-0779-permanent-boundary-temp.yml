name: Apply focused 0779 workflow contract correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-0779-permanent-boundary-temp.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Correct dedicated 0779 source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checker=Path('tools/check_generated_equipment_lifecycle_hooks_0779.py')
          text=checker.read_text(encoding='utf-8')
          old=''' "workflow":ROOT/".github/workflows/source-validation.yml"}'''
          new=''' "workflow":ROOT/".github/workflows/generated-equipment-lifecycle-validation.yml"}'''
          if text.count(old)!=1: raise SystemExit(f'0779 workflow path anchor count={text.count(old)}')
          checker.write_text(text.replace(old,new,1),encoding='utf-8')

          integration=Path('tools/check_development_integration_0732.py')
          text=integration.read_text(encoding='utf-8')
          old='''"check_generated_equipment_lifecycle_hooks_0779.py",
'''
          if text.count(old)!=1: raise SystemExit(f'0779 integration duplicate anchor count={text.count(old)}')
          integration.write_text(text.replace(old,'',1),encoding='utf-8')
          PY
          python3 -m compileall -q tools
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_generated_equipment_lifecycle_hooks_0779.py tools/check_development_integration_0732.py
          git commit -m "Bind 0779 to dedicated permanent validation workflow"
          git pull --rebase origin main
          git push origin HEAD:main
