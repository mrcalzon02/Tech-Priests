name: Run robust 0779 source contract correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-0779-permanent-boundary-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Correct dedicated 0779 source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          checker=Path('tools/check_generated_equipment_lifecycle_hooks_0779.py')
          text=checker.read_text(encoding='utf-8')
          text,count=re.subn(r'"workflow":ROOT/"\.github/workflows/source-validation\.yml"', '"workflow":ROOT/".github/workflows/generated-equipment-lifecycle-validation.yml"', text, count=1)
          if count!=1: raise SystemExit(f'0779 workflow replacement count={count}')
          text,count=re.subn(r'\n\s*"integration":\(\'check_generated_equipment_lifecycle_hooks_0779\.py\',\),', '', text, count=1)
          if count!=1: raise SystemExit(f'0779 checker integration requirement removal count={count}')
          text=text.replace('  "integration":ROOT/"tools/check_development_integration_0732.py",\n','')
          checker.write_text(text,encoding='utf-8')

          integration=Path('tools/check_development_integration_0732.py')
          text=integration.read_text(encoding='utf-8')
          text,count=re.subn(r'\n\s*"check_generated_equipment_lifecycle_hooks_0779\.py",', '', text, count=1)
          if count!=1: raise SystemExit(f'integration duplicate checker removal count={count}')
          integration.write_text(text,encoding='utf-8')
          PY
          python3 -m compileall -q tools
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_generated_equipment_lifecycle_hooks_0779.py tools/check_development_integration_0732.py
          git commit -m "Bind 0779 to dedicated permanent validation workflow"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish correction status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:passed?'success':'failure',context:'tech-priests/0779-contract-correction',description:passed?'0779 dedicated workflow contracts corrected':'0779 contract correction failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
