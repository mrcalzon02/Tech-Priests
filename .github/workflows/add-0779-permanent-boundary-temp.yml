name: Retry whitespace-agnostic 0779 integration correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-0779-permanent-boundary-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Remove duplicate integration workflow requirement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('tools/check_development_integration_0732.py')
          text=path.read_text(encoding='utf-8')
          text,count=re.subn(r'\s*"check_generated_equipment_lifecycle_hooks_0779\.py",', '', text, count=1)
          if count!=1: raise SystemExit(f'0779 integration entry count={count}')
          path.write_text(text,encoding='utf-8')
          PY
          python3 -m compileall -q tools
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_development_integration_0732.py
          git commit -m "Remove duplicate monolithic 0779 workflow requirement"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish correction status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:passed?'success':'failure',context:'tech-priests/0779-integration-correction',description:passed?'Duplicate 0779 workflow requirement removed':'0779 integration correction failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
