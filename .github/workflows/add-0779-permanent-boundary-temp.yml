name: Add permanent 0779 lifecycle boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-0779-permanent-boundary-temp.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Add 0779 to source validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/source-validation.yml')
          text=path.read_text(encoding='utf-8')
          old='''      - name: Audit retired 0363 station-pair recovery wrapper
        run: python3 tools/check_station_pair_recovery_0363_boundary_0778.py

      - name: Audit development integration graph
'''
          new='''      - name: Audit retired 0363 station-pair recovery wrapper
        run: python3 tools/check_station_pair_recovery_0363_boundary_0778.py

      - name: Audit direct 0302 and 0305 lifecycle refresh ownership
        run: python3 tools/check_generated_equipment_lifecycle_hooks_0779.py

      - name: Audit development integration graph
'''
          if text.count(old)!=1: raise SystemExit(f'0779 workflow anchor count={text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/source-validation.yml
          git commit -m "Add permanent 0302 and 0305 lifecycle boundary"
          git pull --rebase origin main
          git push origin HEAD:main

# Retrigger after initial workflow installation.
