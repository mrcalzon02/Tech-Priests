name: Audit 0503 narrowing references

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-0503-narrowing-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect 0503 references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          {
            echo '=== 0503 module references ==='
            grep -R -n -E 'priest_recovery_safety_0503|TechPriestsPriestRecoverySafety0503|rescue-respawn-created-0503|recovery-teleport-0503|mobility-swap|tp-priest-recovery-0503' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== canonical respawn references ==='
            grep -R -n -E 'respawn_pair_priest\(|respawn_pair_priest[[:space:]]*=' tech-priests_src/scripts || true
          } > /tmp/audit/0503-narrowing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: narrowing-0503-audit
          path: /tmp/audit/0503-narrowing.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0503-narrowing-audit',
              description: passed ? '0503 narrowing audit complete' : '0503 narrowing audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
