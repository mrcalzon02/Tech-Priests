name: Martian bunker v06 barrel and PBR textures
on:
  push:
    branches: [main]
    paths:
      - 'art/source-to-3d/martian-bunker/revisions/v06/**'
      - '.github/workflows/martian-bunker-3d.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: martian-bunker-blender-main
  cancel-in-progress: false
jobs:
  barrel-v06:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blender and PBR source verifier
        run: |
          python -m pip install 'numpy>=1.26,<3' 'trimesh>=4,<5' 'Pillow>=10,<13' 'scipy>=1.12,<2'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          blender --version | head -n 2
      - name: Recover source and generate independent tileable texture maps
        run: |
          mkdir -p art/source-to-3d/martian-bunker/src/v06
          unzip -o art/source-to-3d/martian-bunker/revisions/v06/martian_bunker_barrel_texture_v06_source.zip -d art/source-to-3d/martian-bunker/src/v06
          python -m py_compile art/source-to-3d/martian-bunker/src/v06/*.py
          python art/source-to-3d/martian-bunker/src/v06/build_blockout.py
          python art/source-to-3d/martian-bunker/src/v06/make_textures.py
          python art/source-to-3d/martian-bunker/src/v06/verify_barrel_v06.py
          python art/source-to-3d/martian-bunker/src/v06/verify_turret_front.py
      - name: Native Blender baseline with revised barrel but flat paint
        run: |
          BUNKER_TEXTURE_MODE=FLAT PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v06/setup_blender.py -- --render
          BUNKER_TEXTURE_MODE=FLAT PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v06/verify_exported_blender_glb.py
      - name: Native Blender textured material build and independent GLB roundtrip
        run: |
          BUNKER_TEXTURE_MODE=TEXTURED PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v06/setup_blender.py -- --render
          BUNKER_TEXTURE_MODE=TEXTURED PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v06/verify_exported_blender_glb.py
      - name: Validate comparisons, texture impact and publish gallery
        run: |
          python art/source-to-3d/martian-bunker/src/v06/verify_render_v06.py
      - name: Commit editable native Blender masters, final GLB, PBR textures, renders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find art/source-to-3d/martian-bunker/src/v06 -type d -name __pycache__ -prune -exec rm -rf {} +
          find art/source-to-3d/martian-bunker/src/v06 -type f -name '*.blend1' -delete
          git add art/source-to-3d/martian-bunker/src/v06 art/source-to-3d/martian-bunker/gallery/v06_*.png
          if git diff --cached --quiet; then
            echo 'No modified assets'; exit 0
          fi
          git commit -m 'art: publish verified hollow-barrel v06 native Blender PBR materials and gallery'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve full model evidence as GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martian-bunker-v06-barrel-and-original-textures
          path: |
            art/source-to-3d/martian-bunker/src/v06/
            art/source-to-3d/martian-bunker/gallery/v06_*.png
          if-no-files-found: warn
          retention-days: 30
