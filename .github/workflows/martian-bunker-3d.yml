name: Martian bunker Blender asset verification
on:
  push:
    branches: [main]
    paths:
      - 'art/source-to-3d/martian-bunker/revisions/v04/**'
      - '.github/workflows/martian-bunker-3d.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: martian-bunker-blender-main
  cancel-in-progress: false
jobs:
  bunker-v04:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blender and geometry verification requirements
        run: |
          python -m pip install 'numpy>=1.26,<3' 'trimesh>=4,<5' 'Pillow>=10,<12'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          blender --version | head -n 2
      - name: Recover authoritative v04 original geometry and code
        run: |
          mkdir -p art/source-to-3d/martian-bunker/src/v04
          unzip -o art/source-to-3d/martian-bunker/revisions/v04/martian_bunker_v04_source.zip -d art/source-to-3d/martian-bunker/src/v04
          python -m py_compile art/source-to-3d/martian-bunker/src/v04/build_blockout.py art/source-to-3d/martian-bunker/src/v04/setup_blender.py art/source-to-3d/martian-bunker/src/v04/verify_exported_blender_glb.py art/source-to-3d/martian-bunker/src/v04/verify_hull_conformance.py
      - name: Regenerate source and prove actual top-bottom mesh attachment
        run: |
          python art/source-to-3d/martian-bunker/src/v04/build_blockout.py
          python art/source-to-3d/martian-bunker/src/v04/verify_hull_conformance.py
      - name: Build native Blender Z-up scene with all attachments and four views
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v04/setup_blender.py -- --render
      - name: Verify exported GLB in a CLEAN Blender process
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v04/verify_exported_blender_glb.py
      - name: Inspect real rendered colors, framing and export published gallery
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import numpy as np
          p=Path('art/source-to-3d/martian-bunker/src/v04')
          gallery=Path('art/source-to-3d/martian-bunker/gallery')
          master=p/'martian_heavy_weapon_bunker_v04.blend'
          glb=p/'martian_heavy_weapon_bunker_v04_blender_export.glb'
          assert master.is_file() and master.stat().st_size>30000
          assert glb.is_file() and glb.stat().st_size>30000
          manifest=json.loads((p/'component_manifest_v04.json').read_text())
          assert len(manifest['hull_attachments'])>=20
          assert len(manifest['inward_sloped_buttresses'])==8
          report={'model':'v0.4','parts':manifest['parts_count'],
                  'surface_mounts':len(manifest['hull_attachments']),
                  'corner_and_foot_bodies':len(manifest['inward_sloped_buttresses']),
                  'native_blend_sha256':hashlib.sha256(master.read_bytes()).hexdigest(),
                  'blender_glb_sha256':hashlib.sha256(glb.read_bytes()).hexdigest(),'renders':{}}
          for label in ('front','rear','front_west','rear_east'):
              path=p/f'bunker_blender_{label}_v04.png'
              assert path.is_file() and path.stat().st_size>30000,label
              with Image.open(path) as im:
                  rgba=np.asarray(im.convert('RGBA'),dtype=np.int32)
                  assert im.size==(900,900)
              alpha=rgba[:,:,3]>32
              red=(rgba[:,:,0]>rgba[:,:,1]*1.3)&(rgba[:,:,0]>rgba[:,:,2]*1.3)&(rgba[:,:,0]>50)&alpha
              ys,xs=np.where(alpha)
              assert len(xs)>20000,(label,'blank')
              span=(int(xs.max()-xs.min()),int(ys.max()-ys.min()))
              assert span[0]>180 and span[1]>180,(label,span)
              assert int(red.sum())>400,(label,'missing Martian red material')
              report['renders'][label]={'visible_pixels':int(alpha.sum()),'red_pixels':int(red.sum()),'span_px':span}
              (gallery/f'v04_blender_{label}.png').write_bytes(path.read_bytes())
          with Image.open(gallery/'v04_blender_front.png') as im:
              im.thumbnail((256,256))
              im.save(gallery/'v04_blender_256px.png')
          before=Image.open(gallery/'v03_blender_front.png').convert('RGB')
          after=Image.open(gallery/'v04_blender_front.png').convert('RGB')
          comparison=Image.new('RGB',(1800,960),(32,35,36))
          comparison.paste(before,(0,60));comparison.paste(after,(900,60))
          ImageDraw.Draw(comparison).text((45,25),'v0.3: floating flat-wall mounts / vertical posts     |     v0.4: fitted sloped wall + inward buttresses',fill=(230,220,206))
          comparison.save(gallery/'v04_before_after_front.png')
          (p/'validation_report_v04.json').write_text(json.dumps(report,indent=2)+'\n')
          print('V04_BLENDER_HULL_CONTACT_AND_GALLERY_VERIFIED',report)
          PY
      - name: Commit verified Blender master, GLB, source and inspection gallery to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find art/source-to-3d/martian-bunker/src/v04 -type d -name __pycache__ -prune -exec rm -rf {} +
          find art/source-to-3d/martian-bunker/src/v04 -type f -name '*.blend1' -delete
          git add art/source-to-3d/martian-bunker/src/v04             art/source-to-3d/martian-bunker/gallery/v04_blender_*.png             art/source-to-3d/martian-bunker/gallery/v04_before_after_front.png
          if git diff --cached --quiet; then
            echo 'No changed assets'
            exit 0
          fi
          git commit -m 'art: validate and publish hull-conforming Martian bunker v04 Blender model'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve source, meshes and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martian-bunker-v04-native-blender-evidence
          path: |
            art/source-to-3d/martian-bunker/src/v04/
            art/source-to-3d/martian-bunker/gallery/v04_blender_*.png
            art/source-to-3d/martian-bunker/gallery/v04_before_after_front.png
          if-no-files-found: warn
          retention-days: 30
