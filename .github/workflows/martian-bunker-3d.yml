name: Martian bunker Blender asset verification (v09 actual detailed model)
on:
  push:
    branches: [main]
    paths:
      - 'art/source-to-3d/martian-bunker/revisions/v09/**'
      - '.github/workflows/martian-bunker-3d.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: martian-bunker-blender-main
  cancel-in-progress: false
jobs:
  verify-v09-real-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blender and source-geometry dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'trimesh>=4,<5' 'Pillow>=10,<13' 'scipy>=1.12,<2' 'numba>=0.60,<1' 'networkx>=3.0,<4'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          blender --version | head -n 2
      - name: Rebuild actual 199-part turret and test removal of redundant geometry
        run: |
          mkdir -p art/source-to-3d/martian-bunker/src/v09
          unzip -o art/source-to-3d/martian-bunker/revisions/v09/martian_bunker_v09_subtractive_model_source.zip -d art/source-to-3d/martian-bunker/src/v09
          python -m py_compile art/source-to-3d/martian-bunker/src/v09/*.py
          python art/source-to-3d/martian-bunker/src/v09/build_blockout.py
          python art/source-to-3d/martian-bunker/src/v09/make_textures.py
          python art/source-to-3d/martian-bunker/src/v09/verify_visual_target_v09.py
          python art/source-to-3d/martian-bunker/src/v09/verify_barrel_v09.py
          python art/source-to-3d/martian-bunker/src/v09/verify_turret_front.py
      - name: Render and independently verify flat native Blender model
        run: |
          BUNKER_TEXTURE_MODE=FLAT PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v09/setup_blender.py -- --render
          BUNKER_TEXTURE_MODE=FLAT PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v09/verify_exported_blender_glb.py
      - name: Render and verify packed PBR Blender model and exported GLB
        run: |
          BUNKER_TEXTURE_MODE=TEXTURED PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v09/setup_blender.py -- --render
          BUNKER_TEXTURE_MODE=TEXTURED PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/src/v09/verify_exported_blender_glb.py
      - name: Verify actual rendered differences, publish gallery and report
        run: |
          python art/source-to-3d/martian-bunker/src/v09/verify_render_v09.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          src=Path('art/source-to-3d/martian-bunker/src/v09')
          gal=Path('art/source-to-3d/martian-bunker/gallery')
          m=json.loads((src/'component_manifest_v09.json').read_text())
          assert m['parts_count']==199 and m['rotating_mesh_count']==110 and m['target_detail_count']==36,m
          assert m['square_shroud_removed']
          assert len(list((src/'textures').glob('*.png')))==69
          for f in ('v09_barrel_three_quarter.png','v09_barrel_head_on.png',
                    'v09_textured_front.png','v09_textured_rear.png','v09_factorio_256px.png'):
              with Image.open(gal/f) as im: assert im.width>200 and im.height>200,f
          print('V09_SUBTRACTIVE_TURRET_GALLERY_VERIFIED')
          PY
      - name: Publish validated editable assets and renders to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find art/source-to-3d/martian-bunker/src/v09 -type d -name __pycache__ -prune -exec rm -rf {} +
          find art/source-to-3d/martian-bunker/src/v09 -type f -name '*.blend1' -delete
          git add art/source-to-3d/martian-bunker/src/v09 art/source-to-3d/martian-bunker/gallery/v09_*.png
          if git diff --cached --quiet; then
            echo 'Assets already committed'
            exit 0
          fi
          git commit -m 'art: publish purposeful simplified turret v09 Blender model and PBR maps'
          git fetch origin main
          # The tested, generated outputs are authoritative for this revision.
          # If another run published older versions during rendering, prefer
          # these files when replaying this non-forced commit onto current main.
          git rebase -X theirs origin/main
          git push origin HEAD:main
      - name: Preserve all generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martian-bunker-v09-subtractive-functional-geometry
          path: |
            art/source-to-3d/martian-bunker/src/v09/
            art/source-to-3d/martian-bunker/gallery/v09_*.png
          if-no-files-found: warn
          retention-days: 30
