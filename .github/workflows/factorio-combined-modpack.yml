name: Factorio combined Mod Portal integration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/factorio-combined-modpack.yml'
      - 'tools/ci_factorio_combined_modpack.py'
      - 'tests/modpacks/**'
      - 'tech-priests_src/**'

# Do not cancel genuine engine verification runs in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  combined-modpack:
    name: Factorio 2.1 | authenticated unified modpack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check resolver syntax and dependency-selection self-tests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ci_factorio_combined_modpack.py
          python3 tools/ci_factorio_combined_modpack.py --selftest

      - name: Verify Factorio game token against read-only Mod Portal endpoint
        shell: bash
        env:
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/ci_factorio_combined_modpack.py --auth-check

      - name: Fetch and identify official headless engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/combined-engine" "test-artifacts/combined-2.1"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/combined-factorio.tar.xz" \
            "https://factorio.com/get-download/2.1.24/headless/linux64"
          tar -xJf "$RUNNER_TEMP/combined-factorio.tar.xz" -C "$RUNNER_TEMP/combined-engine"
          bin="$RUNNER_TEMP/combined-engine/factorio/bin/x64/factorio"
          "$bin" --version | tee "test-artifacts/combined-2.1/engine-version.txt"
          grep -Fq '2.1.24' "test-artifacts/combined-2.1/engine-version.txt"

      - name: Resolve, authenticate, download and verify required Mod Portal archives
        shell: bash
        env:
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/ci_factorio_combined_modpack.py \
            --install --family '2.1' \
            --mods-dir "$RUNNER_TEMP/combined-mods" \
            --artifact-dir "test-artifacts/combined-2.1"

      - name: Native headless map creation using downloaded mod archives
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/combined-engine/factorio/bin/x64/factorio"
          artifacts="test-artifacts/combined-2.1"
          timeout 600 "$bin" \
            --mod-directory "$RUNNER_TEMP/combined-mods" \
            --create "$artifacts/combined-smoke.zip" \
            --map-gen-seed 907260 > "$artifacts/factorio-create.log" 2>&1 || {
            status=$?
            tail -n 100 "$artifacts/factorio-create.log" || true
            exit "$status"
          }

      - name: Native headless benchmark from created combined save
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/combined-engine/factorio/bin/x64/factorio"
          artifacts="test-artifacts/combined-2.1"
          timeout 600 "$bin" \
            --mod-directory "$RUNNER_TEMP/combined-mods" \
            --benchmark "$artifacts/combined-smoke.zip" \
            --benchmark-ticks 123000 > "$artifacts/factorio-benchmark.log" 2>&1 || {
            status=$?
            tail -n 100 "$artifacts/factorio-benchmark.log" || true
            exit "$status"
          }

      - name: Identify the mod defining invalid prototype references
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "combined-mods"
          targets = (b"thetazine-thruster",)
          for archive in sorted(root.glob("*.zip")):
              try:
                  with zipfile.ZipFile(archive) as z:
                      for member in z.namelist():
                          if not member.lower().endswith((".lua", ".json")):
                              continue
                          if any(target in z.read(member) for target in targets):
                              print(f"[MODPACK-SOURCE] {archive.name}: {member}", flush=True)
              except (zipfile.BadZipFile, OSError):
                  print(f"[MODPACK-SOURCE] archive-unreadable {archive.name}", flush=True)
          local = root / "tech-priests"
          if local.is_dir():
              for path in local.rglob("*.lua"):
                  if any(target in path.read_bytes() for target in targets):
                      print(f"[MODPACK-SOURCE] tech-priests: {path.relative_to(local)}", flush=True)
          PY

      - name: Repeat isolated native load in a second process
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/combined-engine/factorio/bin/x64/factorio"
          artifacts="test-artifacts/combined-2.1"
          timeout 600 "$bin" \
            --mod-directory "$RUNNER_TEMP/combined-mods" \
            --benchmark "$artifacts/combined-smoke.zip" \
            --benchmark-ticks 1200 > "$artifacts/factorio-repeat-load.log" 2>&1 || {
            status=$?
            tail -n 100 "$artifacts/factorio-repeat-load.log" || true
            exit "$status"
          }

      - name: Fail closed on missing required mods or unproven native loads
        if: always()
        shell: bash
        run: |
          python3 tools/ci_factorio_combined_modpack.py \
            --gate --family '2.1' \
            --artifact-dir "test-artifacts/combined-2.1"

      - name: Show sanitized modpack evidence
        if: always()
        shell: bash
        run: |
          artifacts="test-artifacts/combined-2.1"
          {
            echo "## Combined Mod Portal test: Factorio 2.1"
            echo ""
            if [[ -f "$artifacts/modpack-manifest.json" ]]; then
              python3 - "$artifacts/modpack-manifest.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("Verified ZIP downloads:", len(d["installed"]))
          print("Blockers:", len(d["blockers"]))
          for x in d["installed"]:
              print(f"- {x['name']} {x['version']} (SHA-1 verified)")
          for x in d["blockers"]:
              print("- BLOCKED:", x)
          PY
            else
              echo "No modpack manifest; preparation failed before installation."
            fi
            echo ""
            echo "ZIP presence and a 123000-tick headless endurance smoke do not establish full gameplay compatibility."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain manifests, native logs and verdicts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-modpack-2.1-evidence
          path: test-artifacts/combined-2.1/
          retention-days: 14
          if-no-files-found: warn
