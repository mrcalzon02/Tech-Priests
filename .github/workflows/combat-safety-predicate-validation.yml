name: Combat safety predicate validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit canonical combat safety predicate ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_combat_safety_predicate_ownership_0785.py 2>&1 | tee /tmp/combat-safety-predicates.log

      - name: Retain combat safety predicate failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combat-safety-predicate-output
          path: /tmp/combat-safety-predicates.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish combat safety predicate validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/combat-safety-predicates',
              description: passed ? 'Combat safety predicate ownership passed' : 'Combat safety predicate ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
