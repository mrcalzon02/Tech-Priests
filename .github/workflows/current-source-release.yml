name: Current Factorio source snapshot (GitHub only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/current-source-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-source-release
  cancel-in-progress: false
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tech-priests_src
          filter: blob:none
      - name: Archive exact current mod source without changing version or baseline
        run: |
          git archive --format=zip --output Tech_Priests_Current_Source.zip HEAD tech-priests_src
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          archive = Path('Tech_Priests_Current_Source.zip')
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              info = json.loads(z.read('tech-priests_src/info.json'))
              assert 'tech-priests_src/control.lua' in z.namelist()
              assert {n.split('/')[0] for n in z.namelist()} == {'tech-priests_src'}
          manifest = {'classification': 'unverified-source-snapshot',
                      'source_commit': os.environ['GITHUB_SHA'],
                      'mod_metadata': info, 'archive': archive.name,
                      'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
                      'size_bytes': archive.stat().st_size,
                      'runtime_validation': 'incomplete', 'destination': 'GitHub only'}
          Path('source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          Path('source-release-notes.md').write_text(
              '# Current Factorio mod source\n\nUnverified source snapshot of `tech-priests_src` at commit `' + os.environ['GITHUB_SHA'] + '`.\n\n'
              'The attached ZIP contains the current Lua, prototypes, graphics, locale and mod metadata. '
              'It preserves the source directory and metadata exactly; it is a source archive, not an installable Factorio mod ZIP. '
              'The repository ZIP/tar.gz links below also contain tooling and project source.\n\n'
              'Runtime and behavioral acceptance remain incomplete. This prerelease makes no verified playable-build claim. '
              'The verified mod packaging gate and protected baseline remain in place.\n\n'
              'GitHub only; nothing is uploaded to the Factorio Mod Portal. '
              'See source-manifest.json for the exact commit, metadata and SHA-256.\n')
          PY
      - name: Publish current source on GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="source-snapshot-${GITHUB_RUN_ID}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Tech Priests — current Factorio source (${GITHUB_SHA:0:7})" --notes-file source-release-notes.md --prerelease Tech_Priests_Current_Source.zip source-manifest.json
