name: Midgame science factory acceptance and visual checkpoints
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/midgame-science-validation.yml'
      - 'tests/scenarios/midgame-science/**'
      - 'tools/run_factorio_isolated_service_scenario.py'
      - 'tools/render_midgame_science_timelapse.py'
      - 'tech-priests_src/**'
# Do not terminate an actively simulated factory on a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  midgame-science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema, scripts and scenario wiring
        run: |
          python3 -m py_compile tools/run_factorio_isolated_service_scenario.py tools/render_midgame_science_timelapse.py
          python3 tools/render_midgame_science_timelapse.py --self-test
      - name: Download exact Factorio 2.0.77 headless binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/factorio.tar.xz" \
            "https://factorio.com/get-download/2.0.77/headless/linux64"
          tar -xJf "$RUNNER_TEMP/factorio.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/factorio/bin/x64/factorio" --version | head -n 1
      - name: Install telemetry-frame and GIF rendering dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/midgame-visual-env"
          "$RUNNER_TEMP/midgame-visual-env/bin/pip" install --disable-pip-version-check Pillow
          echo "$RUNNER_TEMP/midgame-visual-env/bin" >> "$GITHUB_PATH"
      - name: Run nine-checkpoint midgame science scenario in genuine Factorio
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_factorio_isolated_service_scenario.py \
            --scenario midgame-science \
            --factorio "$RUNNER_TEMP/factorio/bin/x64/factorio" \
            --output-dir "$RUNNER_TEMP/midgame-science-artifacts" \
            --timeout-seconds 2700
      - name: Publish live engine checkpoints, save files and timelapse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midgame-science-checkpoints-and-timelapse
          path: |
            ${{ runner.temp }}/midgame-science-artifacts/midgame-science/
            ${{ runner.temp }}/factorio-current.log
            ${{ runner.temp }}/factorio/*.log
          retention-days: 14
          if-no-files-found: warn
