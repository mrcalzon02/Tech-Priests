name: Architecture contract correction temporary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/architecture-contract-fix-temp.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Correct testing heading contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_recovery_architecture_0744.py')
          text = path.read_text(encoding='utf-8')
          old = '("standard fluid route", "fluid turret route", "Stage 5 objective validation")'
          new = '("standard fluid route", "### Fluid turret route", "Stage 5 objective validation")'
          if old not in text:
              raise SystemExit('stale fluid-turret heading contract not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_recovery_architecture_0744.py
          git commit -m "Correct fluid turret testing heading contract"
          git pull --rebase origin main
          git push origin HEAD:main
