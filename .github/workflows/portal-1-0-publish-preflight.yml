name: Preflight Factorio Mod Portal publication for Tech-Priests 1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/portal-1-0-publish-preflight.yml']

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.repository == 'mrcalzon02/Tech-Priests' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'publish(portal): inspect existing listing and upload credentials'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_SHA256: 709c243a17466d42e8a554e99f344dfa1b05e0d68db5b29b5002dfff0db549b1
      CANDIDATE_BYTES: '2139214029'
      # Never print tokens or authenticate with the ordinary Factorio download token.
      K1: ${{ secrets.MOD_UPLOAD_API_KEY }}
      K2: ${{ secrets.MODPORTAL_API_KEY }}
      K3: ${{ secrets.MODPORTAL_TOKEN }}
      K4: ${{ secrets.FACTORIO_MOD_PORTAL_API_KEY }}
      K5: ${{ secrets.FACTORIO_MOD_UPLOAD_API_KEY }}
      K6: ${{ secrets.FACTORIO_API_KEY }}
      K7: ${{ secrets.MOD_PORTAL_API_KEY }}
      P1: ${{ secrets.MOD_PUBLISH_API_KEY }}
      P2: ${{ secrets.FACTORIO_MOD_PUBLISH_API_KEY }}
    steps:
      - name: Inspect live listing, available upload key presence and packaged candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          from urllib.parse import quote
          url='https://mods.factorio.com/api/mods/'+quote('tech-priests')+'/full'
          status=0
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Tech-Priests-1.0-owner-publication-preflight'})
            with urllib.request.urlopen(req,timeout=24) as response:
              status=response.status
              data=json.loads(response.read(1000000))
          except urllib.error.HTTPError as exc:
            status=exc.code
            data={'error':'not-found' if status==404 else 'http-error'}
          except Exception as exc:
            data={'error':type(exc).__name__}
          listing={'http_status':status,'name':data.get('name'),'owner':data.get('owner'),
                   'title':data.get('title'),'published_releases':[
                     r.get('version') for r in data.get('releases',[])[:7]]}
          keys={n:bool(os.environ.get(n)) for n in ('K1','K2','K3','K4','K5','K6','K7','P1','P2')}
          print('TP_PORTAL_PUBLIC_LISTING '+json.dumps(listing,sort_keys=True))
          print('TP_PORTAL_AUTH_SCOPE_CANDIDATES '+json.dumps({
            'available_names':[n for n,present in keys.items() if present],
            'any_key':any(keys.values()),
            'ordinary_factorio_download_token_not_used':True,
            'scope_unverified':True},sort_keys=True))
          print('TP_PORTAL_SOURCE_CANDIDATE '+json.dumps({
            'source':'GitHub verified 1.0 draft release 457757452',
            'zip_sha256':os.environ['CANDIDATE_SHA256'],
            'zip_size_bytes':int(os.environ['CANDIDATE_BYTES']),
            'full_engine_load_unverified':True,
            'portal_uploaded':False}))
          if status not in (200,404):
            raise SystemExit('Cannot verify portal listing; no upload attempted')
          PY
