name: Apply artillery recovery documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-artillery-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply tested documentation migration
        run: python3 .recovery-staging/apply_artillery_docs.py

      - name: Remove one-shot migration artifacts
        run: |
          rm -rf .recovery-staging
          rm -f .github/workflows/apply-artillery-docs.yml
          rm -f tmp-do-not-create

      - name: Commit synchronized authority records
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Synchronize artillery recovery documentation"
          git push origin HEAD:main
