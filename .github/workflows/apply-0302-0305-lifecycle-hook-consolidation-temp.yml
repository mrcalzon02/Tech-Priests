name: Publish 0302 and 0305 lifecycle hook consolidation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-0302-0305-lifecycle-hook-consolidation-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Consolidate generated equipment lifecycle hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def replace_once(text,old,new,label):
              count=text.count(old)
              if count != 1: raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old,new,1)

          part2_path='tech-priests_src/scripts/generated/control_legacy_part_002.lua'
          part2=read(part2_path)
          old='''  ensure_pair_logistic_caches(pair)
  if type(_G.tech_priests_0362_refresh_pair_state) == "function" then
    pcall(_G.tech_priests_0362_refresh_pair_state, pair, "canonical-pair-created")
  end
  return_to_station(priest, station)
'''
          new='''  ensure_pair_logistic_caches(pair)
  if type(_G.tech_priests_0362_refresh_pair_state) == "function" then
    pcall(_G.tech_priests_0362_refresh_pair_state, pair, "canonical-pair-created")
  end
  if type(_G.tech_priests_0302_refresh_pair_fixed_armor) == "function" then
    pcall(_G.tech_priests_0302_refresh_pair_fixed_armor, pair, "canonical-pair-created")
  end
  if type(_G.tech_priests_0305_refresh_pair_equipment) == "function" then
    pcall(_G.tech_priests_0305_refresh_pair_equipment, pair, "canonical-pair-created")
  end
  return_to_station(priest, station)
'''
          part2=replace_once(part2,old,new,'canonical creation refresh')
          write(part2_path,part2)

          lifecycle_path='tech-priests_src/scripts/core/priest_lifecycle_authority_0499.lua'
          lifecycle=read(lifecycle_path)
          old='''  local refresh_pair_state = rawget(_G, "tech_priests_0362_refresh_pair_state")
  if type(refresh_pair_state) == "function" then
    pcall(refresh_pair_state, pair, reimprint and "canonical-reimprint-recovered" or "canonical-priest-recovered")
  end
  resume_order_after_priest_recovery(pair, reimprint and "reimprint-recovery-0499" or "controlled-recovery-0499")
'''
          new='''  local refresh_reason = reimprint and "canonical-reimprint-recovered" or "canonical-priest-recovered"
  local refresh_pair_state = rawget(_G, "tech_priests_0362_refresh_pair_state")
  if type(refresh_pair_state) == "function" then pcall(refresh_pair_state, pair, refresh_reason) end
  local refresh_fixed_armor = rawget(_G, "tech_priests_0302_refresh_pair_fixed_armor")
  if type(refresh_fixed_armor) == "function" then pcall(refresh_fixed_armor, pair, refresh_reason) end
  local refresh_equipment = rawget(_G, "tech_priests_0305_refresh_pair_equipment")
  if type(refresh_equipment) == "function" then pcall(refresh_equipment, pair, refresh_reason) end
  resume_order_after_priest_recovery(pair, reimprint and "reimprint-recovery-0499" or "controlled-recovery-0499")
'''
          lifecycle=replace_once(lifecycle,old,new,'canonical recovery refresh')
          write(lifecycle_path,lifecycle)

          part20_path='tech-priests_src/scripts/generated/control_legacy_part_020.lua'
          part20=read(part20_path)
          old='''TECH_PRIESTS_PRE_INDEPENDENT_ENSURE_PAIR_PRIEST_0302 = ensure_pair_priest
if ensure_pair_priest then
  function ensure_pair_priest(pair, force_recall, immediate)
    local before = pair and pair.priest and pair.priest.valid and pair.priest.unit_number or nil
    local result = TECH_PRIESTS_PRE_INDEPENDENT_ENSURE_PAIR_PRIEST_0302(pair, force_recall, immediate)
    local after = pair and pair.priest and pair.priest.valid and pair.priest.unit_number or nil
    if pair then
      pair.linked_health_ratio = nil
      pair.health_link_removed_0302 = true
      tech_priests_0302_refresh_pair_fixed_armor(pair, before ~= after and "priest-created-0302" or "ensure-0302")
    end
    return result
  end
end
