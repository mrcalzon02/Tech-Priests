          new='''-- 0.1.674-dev: lifecycle refresh is direct from canonical pair creation and 0499 recovery.
-- Fixed-rank armor remains owned by 0302 damage/periodic behavior, not an ensure wrapper.
TECH_PRIESTS_0302_ENSURE_WRAPPER_RETIRED = true
'''
          part20=replace_once(part20,old,new,'0302 ensure wrapper')
