          new='''  ["tp-pairstate-recover-0363"] = true,
  ["tp-armor-0302"] = true,
  ["tp-grid-0305"] = true,
  ["tp-proxy-ammo-0649"] = true,
'''
          cleanup=replace_once(cleanup,old,new,'command cleanup')
          write(cleanup_path,cleanup)

          checker_path=Path('tools/check_generated_equipment_lifecycle_hooks_0779.py')
          checker_path.write_text('''#!/usr/bin/env python3
