          part20=replace_once(part20,old,'TECH_PRIESTS_0305_DEBUG_COMMAND_RETIRED = true\n','0305 command')
          write(part20_path,part20)

          cleanup_path='tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua'
          cleanup=read(cleanup_path)
          old='''  ["tp-pairstate-recover-0363"] = true,
  ["tp-proxy-ammo-0649"] = true,
