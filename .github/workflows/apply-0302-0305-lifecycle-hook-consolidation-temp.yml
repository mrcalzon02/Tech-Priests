          part20=replace_once(part20,old,'TECH_PRIESTS_0302_DEBUG_COMMAND_RETIRED = true\n','0302 command')
          old='''TECH_PRIESTS_PRE_SUB_EQUIPMENT_ENSURE_PAIR_PRIEST_0305 = ensure_pair_priest
