name: Correct 0505 behavior retirement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-0505-retirement-correction-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Apply corrected retirement
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/0505-retirement-correction.txt 2>&1
          import base64
          import pathlib
          import re
          import traceback
          import zlib

          source = pathlib.Path('.github/workflows/apply-0505-retirement-temp.yml').read_text(encoding='utf-8')
          match = re.search(r"payload = '''(.*?)'''", source, re.S)
          if not match:
              raise SystemExit('embedded 0505 payload not found')
          code = zlib.decompress(base64.b64decode(match.group(1))).decode()
          code = code.replace("'  [\"scripts.core.task_pair_audit_0498\"]", "' [\"scripts.core.task_pair_audit_0498\"]")
          code = code.replace("'  [\"scripts.core.behavior_execution_doctrine_0505\"]", "' [\"scripts.core.behavior_execution_doctrine_0505\"]")
          code = code.replace(
              '    ".github/workflows/apply-0505-retirement-temp.yml",\n',
              '    ".github/workflows/apply-0505-retirement-temp.yml",\n'
              '    ".github/workflows/diagnose-0505-retirement-temp.yml",\n'
              '    ".github/workflows/apply-0505-retirement-correction-temp.yml",\n'
          )
          try:
              exec(code, {'__name__': '__main__'})
          except BaseException:
              traceback.print_exc()
              raise
          PY
          code=$?
          {
            echo
            echo "exit_code=${code}"
            echo '=== git status ==='
            git status --short
            echo '=== diff stat ==='
            git diff --stat
          } >> /tmp/0505-retirement-correction.txt
          cat /tmp/0505-retirement-correction.txt
          if [ "${code}" -ne 0 ]; then exit "${code}"; fi
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Retire 0505 into canonical emergency production"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload correction diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-0505-correction
          path: /tmp/0505-retirement-correction.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0505-retirement-correction',
              description: passed ? '0505 retirement commit pushed' : '0505 retirement correction failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });