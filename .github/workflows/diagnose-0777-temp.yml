name: Diagnose 0777 reimprint boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-0777-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Run 0777 alone
        shell: bash
        run: |
          set +e
          python3 tools/check_pair_death_reimprint_0426_boundary_0777.py > /tmp/0777.txt 2>&1
          code=$?
          echo "exit_code=${code}" >> /tmp/0777.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-0777-diagnostic
          path: /tmp/0777.txt
          retention-days: 2
      - name: Publish diagnostic status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'tech-priests/0777-diagnostic',description:'0777 output captured',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});