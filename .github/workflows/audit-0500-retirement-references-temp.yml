name: Audit 0500 retirement references

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-0500-retirement-references-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect 0500 lifecycle references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          {
            echo '=== live 0500 references ==='
            grep -R -n -E 'priest_lifecycle_seal_0500|TechPriestsPriestLifecycleSeal0500|tech_priests_destroy_priest_0500|tech_priests_allow_priest_station_cleanup_0500|lifecycle_0500|tp-priest-lifecycle-0500' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== current 39-count references ==='
            grep -R -n -E 'retired_authority_count=39|26-active / 39-retired|26 active hardeners and 39|39 retired source-only|39 source-preserved|Thirty-nine files|39 explicitly retired' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
          } > /tmp/audit/0500-retirement-references.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-0500-reference-audit
          path: /tmp/audit/0500-retirement-references.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0500-reference-audit',
              description: passed ? '0500 reference audit complete' : '0500 reference audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
