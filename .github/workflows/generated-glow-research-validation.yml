name: Generated glow and research validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery documentation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tech-priests_src/docs/CURRENT_TESTING_GOALS.md
            docs/RECOVERY_AUTHORITY_MAP_CURRENT.md
            docs/DEVELOPMENT_HISTORY.md

      - name: Synchronize accepted cleanup evidence and inventory
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          accepted_sha = '511254d59e76980706921c0a518c7b7f9440d214'
          accepted_run = '29875375384'
          inventory_sha = 'de8630c5307348f812c06edcd08cf85700731244'

          testing_path = Path('tech-priests_src/docs/CURRENT_TESTING_GOALS.md')
          testing = testing_path.read_text(encoding='utf-8')
          testing = testing.replace('fdf6039be809a80865e8ea96c551dc0d0797d181', accepted_sha)
          testing = testing.replace('29779229966', accepted_run)
          testing_anchor = '''### Stage 4 — Static performance protection

`audit_ups_hotspots_0743.py` compares the current authority surface against the frozen pre-recovery baseline. Source validation fails if tracked route, scan, command, or shared-state-write counts regress. Static counts do not replace Factorio profiler evidence.

'''
          testing_inventory = f'''### Post-cleanup authority inventory — 2026-07-23

A read-only inventory at exact SHA `{inventory_sha}` scanned **306 Lua files** and found **171 unique command registrations** with no duplicate names: **38** in generated fragments, **126** in core modules, and **7** elsewhere. It also found **109 direct `script.on_*` routes**: 70 `on_nth_tick`, 37 `on_event`, one `on_init`, and one `on_configuration_changed`. None of the commands retired by milestones 0779–0790 reappeared.

This closes the 0779–0790 cleanup tranche but does not close the broader recovery cleanup. The next bounded source audit begins with the 38 generated command registrations—especially fragments 015–020—and classification of direct event/timer routes as canonical registry installation, authorized bootstrap, or obsolete fallback. Gate 2 runtime evidence remains blocked until that source classification and any required consolidation are complete.

'''
          if '### Post-cleanup authority inventory — 2026-07-23' not in testing:
              if testing.count(testing_anchor) != 1:
                  raise SystemExit('CURRENT_TESTING_GOALS Stage 4 anchor mismatch')
              testing = testing.replace(testing_anchor, testing_anchor + testing_inventory, 1)
          testing = re.sub(
              r'The movement-cadence consolidation changes the source candidate.*?No unrelated feature development is authorized before those gates advance\.',
              f'The accepted cleanup implementation `{accepted_sha}` passed complete Source validation in run `{accepted_run}`. Milestones 0779–0790 are closed, but the post-cleanup inventory confirms that broader source recovery remains open. The next source audit begins with generated command surfaces in fragments 015–020 and classification of the remaining direct event/timer routes. No unrelated feature development or Gate 2 evidence collection is authorized until that source tranche is classified and any obsolete ownership is retired.',
              testing,
              flags=re.S,
          )
          testing_path.write_text(testing, encoding='utf-8')

          map_path = Path('docs/RECOVERY_AUTHORITY_MAP_CURRENT.md')
          authority = map_path.read_text(encoding='utf-8')
          authority = authority.replace('fdf6039be809a80865e8ea96c551dc0d0797d181', accepted_sha)
          authority = authority.replace('29779229966', accepted_run)
          authority = authority.replace('Planning --> Retired[45 retired authorities]', 'Planning --> Retired[47 retired authorities]')
          map_anchor = '## Stage 5 — Evidence and Release Boundary\n'
          map_inventory = f'''## Post-Cleanup Authority Inventory — 2026-07-23

The read-only inventory at `{inventory_sha}` scanned 306 Lua files. It found 171 unique command registrations with no duplicate command names: 38 in generated fragments, 126 in core modules, and 7 elsewhere. It found 109 direct `script.on_*` routes: 70 `on_nth_tick`, 37 `on_event`, one `on_init`, and one `on_configuration_changed`.

All command names retired by milestones 0779–0790 are absent. Therefore those milestones are closed, but the wider commandless-runtime and owner-keyed-event recovery is not yet closed. The next bounded authority audit begins with generated fragments 015–020 and then classifies each direct route as canonical registry ownership, explicitly authorized bootstrap, or obsolete fallback. Static counts are inventory evidence only; they do not prove runtime installation or behavior.

'''
          if '## Post-Cleanup Authority Inventory — 2026-07-23' not in authority:
              if authority.count(map_anchor) != 1:
                  raise SystemExit('RECOVERY_AUTHORITY_MAP Stage 5 anchor mismatch')
              authority = authority.replace(map_anchor, map_inventory + map_anchor, 1)
          map_path.write_text(authority, encoding='utf-8')

          history_path = Path('docs/DEVELOPMENT_HISTORY.md')
          history = history_path.read_text(encoding='utf-8')
          heading = '## 2026-07-23 — Post-Cleanup Inventory and Documentation Reconciliation'
          if heading not in history:
              history += f'''\n\n{heading}\n\nAccepted milestones 0779–0790 at exact cleanup SHA `{accepted_sha}` after complete Source validation run `{accepted_run}`. A subsequent read-only inventory at `{inventory_sha}` scanned 306 Lua files and found 171 unique command registrations, including 38 in generated fragments, plus 109 direct `script.on_*` routes. No duplicate command names were present and none of the 0779–0790 retired commands had reappeared. This closes the targeted cleanup tranche while keeping the broader recovery cleanup open. The next bounded audit begins with generated fragments 015–020 and direct event/timer route classification. No Factorio runtime, migration, save/reload, behavioral, profiler, packaged-load, or release evidence is claimed.\n'''
              history_path.write_text(history, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tech-priests_src/docs/CURRENT_TESTING_GOALS.md \
            docs/RECOVERY_AUTHORITY_MAP_CURRENT.md \
            docs/DEVELOPMENT_HISTORY.md
          if git diff --cached --quiet; then
            echo 'Recovery documentation already synchronized.'
          else
            git commit -m 'Reconcile cleanup evidence and remaining authority inventory'
            git push origin HEAD:main
          fi

      - name: Publish generated glow and research validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-glow-research',
              description: passed ? 'Documentation reconciliation carrier passed' : 'Documentation reconciliation carrier failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
