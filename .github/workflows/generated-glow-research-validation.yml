name: Generated glow and research validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit retired generated glow and research commands
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_generated_glow_research_commands_0780.py 2>&1 | tee /tmp/generated-glow-research.log

      - name: Retain generated glow and research failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-glow-research-output
          path: /tmp/generated-glow-research.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated glow and research validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-glow-research',
              description: passed ? 'Generated glow/research boundary passed' : 'Generated glow/research boundary failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
