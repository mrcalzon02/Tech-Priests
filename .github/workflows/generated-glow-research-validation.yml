name: Generated glow and research validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Inspect generated command and route ownership
        shell: bash
        run: python3 .github/scripts/inspect_generated_commands_0792_temp.py

      - name: Retain generated command ownership inventory
        uses: actions/upload-artifact@v4
        with:
          name: generated-command-ownership-0792
          path: /tmp/generated-command-ownership-0792.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish generated glow and research validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-glow-research',
              description: passed ? 'Temporary generated command inspection passed' : 'Temporary generated command inspection failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
