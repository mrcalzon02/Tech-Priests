name: Generated glow and research validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration graph
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: tools/check_development_integration_0732.py

      - name: Register 0792 development integration checker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_development_integration_0732.py')
          text = path.read_text(encoding='utf-8')
          checker = '"check_generated_command_retirement_0792.py",'
          if checker not in text:
              anchor = '"check_legacy_observability_commands_0790.py",\n}'
              replacement = '"check_legacy_observability_commands_0790.py",\n"check_generated_command_retirement_0792.py",\n}'
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one 0790 integration anchor, found {text.count(anchor)}')
              path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check_development_integration_0732.py
          if git diff --cached --quiet; then
            echo '0792 integration registration already committed.'
          else
            git commit -m 'Register 0792 development integration checker'
            git push origin HEAD:main
          fi

      - name: Publish generated glow and research validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-glow-research',
              description: passed ? '0792 integration carrier passed' : '0792 integration carrier failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
