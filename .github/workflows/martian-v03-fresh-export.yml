name: Martian V03 fresh native Blender export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/martian-v03-fresh-export.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: martian-v03-fresh-export
  cancel-in-progress: false
jobs:
  render-saved-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and verify the saved V03 package
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile
          url = "https://chatgpt.com/api/library/files/libfile_9b4f7a7fe33481919b1cebae05b03889/download"
          target = pathlib.Path("v03-package.zip")
          try:
              with urllib.request.urlopen(url, timeout=120) as response, target.open("wb") as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      output.write(chunk)
          except Exception as exc:
              raise RuntimeError("V03 package transfer failed: " + str(exc)) from exc
          assert target.stat().st_size == 270364303, ("Wrong package size", target.stat().st_size)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "af0ff3208ebaacce9fa892fb7f9a1c31f9011cd75b26dd91e87ba2d7bb070a8e", "V03 package checksum mismatch"
          out = pathlib.Path("v03-input").resolve()
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(target) as archive:
              for item in archive.infolist():
                  assert (out / item.filename).resolve().is_relative_to(out), item.filename
              archive.extractall(out)
          print("Verified saved V03 package")
          PY
      - name: Install Blender 5.0.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0
          python -m pip install Pillow
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz --output blender.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.0.1-linux-x64/blender --version | head -n 2
      - name: Render fresh side front and mounted views
        run: |
          cat > /tmp/render-v03.py <<'PY'
          import bpy, pathlib
          from mathutils import Vector
          O=pathlib.Path("art/source-to-3d/martian-bunker/alternatives/v03/fresh-export").resolve()
          O.mkdir(parents=True,exist_ok=True)
          S=bpy.context.scene
          S.frame_set(1)
          S.render.engine="CYCLES"
          S.cycles.device="CPU"
          S.cycles.samples=24
          S.cycles.use_denoising=True
          S.render.use_compositing=False
          S.render.use_sequencer=False
          S.render.resolution_x=S.render.resolution_y=1000
          S.render.resolution_percentage=100
          S.render.image_settings.file_format="PNG"
          S.render.image_settings.color_mode="RGBA"
          S.render.film_transparent=True
          base=bpy.data.collections["EXISTING_BUNKER_BASE_UNCHANGED"]
          v=S["variant"]
          for view,pos,target,scale,show_base in [
           ("side",(-8,0,2.7),(0,-.27,2.7),2.8,False),
           ("front",(0,-8,2.7),(0,-.27,2.7),2.8,False),
           ("mounted",(5,-7,5.5),(0,0,1.85),5.3,True)]:
              base.hide_render=not show_base
              S.camera.location=pos
              S.camera.rotation_euler=(Vector(target)-S.camera.location).to_track_quat("-Z","Y").to_euler()
              S.camera.data.type="ORTHO"
              S.camera.data.ortho_scale=scale
              S.render.filepath=str(O/(v+"_"+view+".png"))
              bpy.ops.render.render(write_still=True)
          print("FRESH_V03_RENDER_COMPLETE",v)
          PY
          for variant in energy_dish grenade_lobber_12; do
            ./blender-5.0.1-linux-x64/blender -b "v03-input/Martian_Bunker_Alternative_Turrets_V03/${variant}_v03.blend" -t 2 --python-exit-code 12 --python /tmp/render-v03.py
          done
      - name: Assemble a newly rendered review image and preserve native assets
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import hashlib,json,shutil
          source=Path("v03-input/Martian_Bunker_Alternative_Turrets_V03")
          dest=Path("art/source-to-3d/martian-bunker/alternatives/v03")
          for p in source.rglob("*"):
              if p.is_file() and p.suffix not in [".blend1",".log"]:
                  q=dest/p.relative_to(source)
                  q.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,q)
          out=dest/"fresh-export"
          font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",23)
          small=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",18)
          board=Image.new("RGB",(1500,1130),(34,37,41))
          draw=ImageDraw.Draw(board)
          draw.text((24,14),"V03 FRESH BLENDER EXPORT — MIRRORED FRONT HALF-SECTIONS",font=font,fill="white")
          for row,(variant,title) in enumerate([("energy_dish","ENERGY HEAD"),("grenade_lobber_12","GRENADE LOBBER — SIX PER HALF, TWELVE TOTAL")]):
              y=62+row*520
              draw.text((24,y),title,font=font,fill=(235,187,130))
              for column,(view,label) in enumerate([("side","Side profile"),("front","Full mirrored front"),("mounted","Corrected bunker retained")]):
                  im=Image.open(out/(variant+"_"+view+".png")).convert("RGBA")
                  assert im.getchannel("A").getbbox(),(variant,view)
                  im.thumbnail((485,465))
                  board.paste(im,(column*500+(500-im.width)//2,y+30),im)
                  draw.text((column*500+22,y+494),label,font=small,fill=(215,219,224))
          board.save(out/"V03_Fresh_Review.png")
          (out/"fresh_render_manifest.json").write_text(json.dumps({"source_package_sha256":"af0ff3208ebaacce9fa892fb7f9a1c31f9011cd75b26dd91e87ba2d7bb070a8e","renderer":"Blender 5.0.1","files":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.glob("*.png")}},indent=2))
          PY
      - name: Publish the actual assets and fresh PNG to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/source-to-3d/martian-bunker/alternatives/v03
          if ! git diff --cached --quiet; then
            git commit -m 'Publish saved V03 mirrored turret models and fresh Blender views'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preserve render outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martian-v03-fresh-blender-export
          path: art/source-to-3d/martian-bunker/alternatives/v03/
          if-no-files-found: warn
          retention-days: 30
