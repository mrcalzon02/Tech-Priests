name: Generated GUI and damage validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit retired generated GUI commands and duplicate damage route
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_generated_gui_damage_commands_0782.py 2>&1 | tee /tmp/generated-gui-damage.log

      - name: Retain generated GUI and damage failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-gui-damage-output
          path: /tmp/generated-gui-damage.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated GUI and damage validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-gui-damage',
              description: passed ? 'Generated GUI/damage boundary passed' : 'Generated GUI/damage boundary failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
