name: Gate 1 evidence synchronization temporary

on:
  push:
    branches: [main]
    paths: [.github/workflows/gate1-record-sync-temp.yml]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Record accepted source validation evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          sha = "fdf6039be809a80865e8ea96c551dc0d0797d181"
          run = "29779229966"
          run_url = f"https://github.com/mrcalzon02/Tech-Priests/actions/runs/{run}"

          history_path = Path("docs/DEVELOPMENT_HISTORY.md")
          history = history_path.read_text(encoding="utf-8")
          marker = "## Current Gate State"
          section = f'''### Retired-source and publisher closure\n\n- `91478cb3cf8c05f9c0ef999bb88e9fd676aee142` — converted all older retired authorities into inert source-preserved stubs with no installer, cadence, wrapper hook, movement call, command path, state mutation, or physical execution surface. Together with the six previously retired standard-fluid wrappers, all 29 retired authorities now satisfy one source-level retirement contract.\n- `7a991688130f365f887903a9fc64b525a7c39f1f`, `5470230f6806dc086aa636bb62b984cee7ed8f0b`, and `77a16e752fd488cda2b3782bee07521ebff87919` — archived the remaining baseline, RC1, and RC2 publisher workflows as manual, read-only, fail-closed guards. RC3 was already archived. Historical publisher workflows can no longer publish or write repository contents.\n\n### Gate 1 source validation accepted — 2026-07-20\n\n- **Exact source SHA:** `{sha}`\n- **Workflow run:** `{run_url}`\n- **Result:** complete `Source validation` success.\n- **Observed gates:** Lua 5.2 parsing, JSON validation, Python compilation, governance, recovery architecture, static UPS baseline, inventory safety, storage, machine, priest cargo, item, energy, silo, artillery, roboport, construction, fluid-turret, standard-fluid, global integration, migration lifecycle, evidence self-tests, evidence wiring, archived publisher and packaging controls, release-authorization self-test, blocked-release proof, and migration-test builder verification all passed for the same SHA.\n\nThis is accepted static source evidence only. It does not claim Factorio loading, migration success, save/reload behavior, scenario completion, profiler evidence, package load, or release authorization.\n\n'''
          if "### Gate 1 source validation accepted — 2026-07-20" not in history:
              if marker not in history:
                  raise SystemExit("history gate-state anchor missing")
              history = history.replace(marker, section + marker, 1)
          history = history.replace(
              "Open until a completed successful `Source validation` workflow is observed for one exact current SHA. The workflow now includes Lua 5.2 parsing, JSON validation, Python compilation, governance, recovery architecture, UPS baseline, generic inventory safety, storage, machine, priest cargo, item, energy, silo, artillery, roboport, construction, consolidated fluid-turret, development integration, migration lifecycle, evidence self-tests, migration-test generation, and release blocking.",
              f"Passed for exact SHA `{sha}` in workflow run `{run}`. All source-validation steps completed successfully. This closes static Gate 1 only; runtime and packaging gates remain open.",
              1,
          )
          history = re.sub(
              r"## Next Sequential Work\n.*\Z",
              '''## Next Sequential Work\n\n1. Execute clean new-save and real `0.1.672` upgrade loads with configuration-change and save/reload evidence for one exact source SHA.\n2. Repair any exact Factorio load, migration, serialization, authority-duplication, or custody failure and rerun affected scenarios.\n3. Run the complete behavioral, specialized-family, construction, standard-fluid, fluid-turret, movement, fairness, and profiler matrices.\n4. Continue source consolidation into remaining movement, lifecycle, direct-command, and compatibility-state writers identified by the UPS and authority maps when runtime evidence does not take priority.\n5. Validate the evidence directory and create verified release authorization only after acceptance.\n6. Advance version, package, package-load test, and publish only under the proven artifact class.\n''',
              history,
              flags=re.S,
          )
          history_path.write_text(history, encoding="utf-8")

          testing_path = Path("tech-priests_src/docs/CURRENT_TESTING_GOALS.md")
          testing = testing_path.read_text(encoding="utf-8")
          testing = testing.replace(
              "A successful complete source-validation result has not yet been recorded for one exact current head.",
              f"Complete Source validation passed for exact SHA `{sha}` in workflow run `{run}` on 2026-07-20. This is accepted static source evidence, not Factorio runtime proof.",
              1,
          )
          testing = testing.replace(
              "Run the exact current `main` head through `.github/workflows/source-validation.yml`.",
              f"**Status: passed.** Exact SHA `{sha}` completed `.github/workflows/source-validation.yml` successfully in run `{run}`.",
              1,
          )
          testing = testing.replace(
              "Record the full 40-character source SHA and successful workflow run. Every failure must be repaired and rerun against a new exact head.",
              "The accepted 40-character SHA and successful run are recorded above. Any later source change creates a new candidate and must pass Source validation again before runtime evidence is accepted for that later SHA.",
              1,
          )
          testing = testing.replace(
              "The next objective action is Gate 1 against one exact current SHA. The next source audit after Gate 1 is movement and lifecycle reconciliation, beginning with remaining direct command and compatibility-state writers identified by the UPS and authority maps. No unrelated feature development is authorized before those gates advance.",
              "The active objective is Gate 2: clean new-save and protected `0.1.672` upgrade loads with configuration-change and save/reload evidence for one exact source SHA. The next source audit remains movement and lifecycle reconciliation, beginning with remaining direct command and compatibility-state writers identified by the UPS and authority maps. No unrelated feature development is authorized before those gates advance.",
              1,
          )
          testing_path.write_text(testing, encoding="utf-8")

          map_path = Path("docs/RECOVERY_AUTHORITY_MAP_CURRENT.md")
          authority = map_path.read_text(encoding="utf-8")
          authority = authority.replace(
              "**Runtime evidence:** Not yet accepted  ",
              f"**Source validation evidence:** Passed for `{sha}` in run `{run}`  \n**Runtime evidence:** Not yet accepted  ",
              1,
          )
          authority = authority.replace(
              "1. One successful complete `Source validation` workflow for the exact tested SHA.\n2. New-save and protected `0.1.672` migration loads in Factorio 2.x.\n3. Configuration-change and save/reload runs for new and migrated saves.\n4. The full behavioral scenario matrix, including construction effectiveness, standard-fluid route recovery, and fluid-turret route recovery.\n5. Idle, active, and high-count profiler evidence.\n6. Digest-bound evidence validation and reviewed release authorization.\n7. Qualified version advancement, deterministic packaging, and packaged-load testing.",
              f"1. **Completed:** Source validation passed for `{sha}` in run `{run}`.\n2. New-save and protected `0.1.672` migration loads in Factorio 2.x.\n3. Configuration-change and save/reload runs for new and migrated saves.\n4. The full behavioral scenario matrix, including construction effectiveness, standard-fluid route recovery, and fluid-turret route recovery.\n5. Idle, active, and high-count profiler evidence.\n6. Digest-bound evidence validation and reviewed release authorization.\n7. Qualified version advancement, deterministic packaging, and packaged-load testing.",
              1,
          )
          map_path.write_text(authority, encoding="utf-8")

          sequence_path = Path("RECOVERY_REPAIR_SEQUENCE.md")
          sequence = sequence_path.read_text(encoding="utf-8")
          start = sequence.find("# Immediate Active Work")
          end = sequence.find("# Completion and Retirement")
          if start < 0 or end <= start:
              raise SystemExit("recovery sequence active-work anchors missing")
          immediate = f'''# Immediate Active Work\n\nGate 1 Source validation passed for exact SHA `{sha}` in workflow run `{run}` on 2026-07-20. This is static source evidence only.\n\nThe active work order is now:\n\n1. Execute Gate 2 clean new-save and protected `0.1.672` upgrade loads, including configuration-change and save/reload evidence for one exact source SHA.\n2. Repair every exact Factorio load, migration, serialization, duplication, custody, or terminal-state failure and rerun affected scenarios.\n3. Continue into the behavioral, specialized-family, construction, standard-fluid, fluid-turret, movement, fairness, and profiler matrices.\n4. Continue the movement and lifecycle authority audit when source work is the active lane, beginning with direct command and compatibility-state writers identified by the UPS and authority maps.\n5. Preserve the 26-active / 29-retired graph unless a later deliberate consolidation reduces it again.\n\n'''
          sequence = sequence[:start] + immediate + sequence[end:]
          sequence_path.write_text(sequence, encoding="utf-8")

          ups_path = Path("docs/UPS_HOTSPOT_AUDIT_0743.md")
          ups = ups_path.read_text(encoding="utf-8")
          ups_note = f'''\n\n## Recovery Gate 1 Update — 2026-07-20\n\nThe exact source SHA `{sha}` passed the static UPS baseline in Source validation run `{run}`. During the Gate 1 repair wave, standard-fluid and fluid-turret scan sites were bounded or reclassified through the canonical routed-scan helper; historical active publishers and 29 retired authority implementations were also removed from active source surfaces.\n\nThe committed table above remains the frozen pre-recovery comparison baseline. The passing Gate 1 result proves the current source does not exceed that baseline; it does not replace idle, active, or high-count Factorio profiler evidence.\n'''
          if "## Recovery Gate 1 Update — 2026-07-20" not in ups:
              ups += ups_note
          ups_path.write_text(ups, encoding="utf-8")
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add docs/DEVELOPMENT_HISTORY.md \
                  tech-priests_src/docs/CURRENT_TESTING_GOALS.md \
                  docs/RECOVERY_AUTHORITY_MAP_CURRENT.md \
                  RECOVERY_REPAIR_SEQUENCE.md \
                  docs/UPS_HOTSPOT_AUDIT_0743.md
          git commit -m "Record accepted Gate 1 source validation"
          git pull --rebase origin main
          git push origin HEAD:main
