name: Generated GUI ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded 0790 observability cleanup
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          marker='TECH_PRIESTS_0120_DEBUG_COMMAND_RETIRED = true'
          if grep -qF "${marker}" tech-priests_src/scripts/generated/control_legacy_part_001.lua; then
            echo '0790 source transformation is already present.'
          else
            python3 .github/scripts/retire_legacy_observability_0790_temp.py 2>&1 | tee /tmp/legacy-observability-0790.log
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_development_integration_0732.py')
          text = path.read_text(encoding='utf-8')
          checker = '"check_legacy_observability_commands_0790.py",'
          if checker not in text:
              anchor = '"check_0250_command_retirement_0789.py",\n}'
              replacement = '"check_0250_command_retirement_0789.py",\n"check_legacy_observability_commands_0790.py",\n}'
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one 0789 integration anchor, found {text.count(anchor)}')
              path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tech-priests_src/scripts/generated/control_legacy_part_001.lua \
            tech-priests_src/scripts/generated/control_legacy_part_002.lua \
            tech-priests_src/scripts/generated/control_legacy_part_003.lua \
            tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua \
            tools/check_development_integration_0732.py \
            docs/DEVELOPMENT_HISTORY.md
          if git diff --cached --quiet; then
            echo '0790 cleanup already committed.'
          else
            git commit -m 'Complete legacy observability cleanup repair'
            git push origin HEAD:main
          fi

      - name: Audit canonical generated GUI ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_generated_gui_ownership_0783.py 2>&1 | tee /tmp/generated-gui-ownership.log

      - name: Retain generated GUI ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-gui-ownership-output
          path: |
            /tmp/legacy-observability-0790.log
            /tmp/generated-gui-ownership.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated GUI ownership validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-gui-ownership',
              description: passed ? 'Canonical generated GUI ownership passed' : 'Canonical generated GUI ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
