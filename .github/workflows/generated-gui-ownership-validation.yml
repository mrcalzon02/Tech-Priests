name: Generated GUI ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out 0790 source files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/retire_legacy_observability_0790_temp.py
            tech-priests_src/scripts/generated/control_legacy_part_001.lua
            tech-priests_src/scripts/generated/control_legacy_part_002.lua
            tech-priests_src/scripts/generated/control_legacy_part_003.lua
            tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua
            docs/DEVELOPMENT_HISTORY.md

      - name: Publish 0790 source retirement ledger
        id: repair
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/legacy-observability-0790.log) 2>&1
          python3 .github/scripts/retire_legacy_observability_0790_temp.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tech-priests_src/scripts/generated/control_legacy_part_001.lua \
            tech-priests_src/scripts/generated/control_legacy_part_002.lua \
            tech-priests_src/scripts/generated/control_legacy_part_003.lua \
            tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua \
            docs/DEVELOPMENT_HISTORY.md
          if git diff --cached --quiet; then
            echo '0790 source ledger already committed.'
          else
            git commit -m 'Complete legacy observability retirement ledger'
            git push origin HEAD:main
          fi

      - name: Retain 0790 source publication failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-observability-0790-repair-output
          path: /tmp/legacy-observability-0790.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish 0790 repair status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.repair.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0790-repair',
              description: passed ? '0790 source ledger published' : '0790 source ledger publication failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish generated GUI ownership validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-gui-ownership',
              description: passed ? '0790 source carrier passed' : '0790 source carrier failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
