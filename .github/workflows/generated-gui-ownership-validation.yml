name: Generated GUI ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out command sources
        uses: actions/checkout@v4
        with:
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tech-priests_src/scripts/generated/control_legacy_part_001.lua
            tech-priests_src/scripts/generated/control_legacy_part_002.lua
            tech-priests_src/scripts/generated/control_legacy_part_003.lua

      - name: Inspect exact 0790 command call forms
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/0790-command-context.log
          for command in \
            tp-priest-diag tp-radii tp-spawn-dump tp-last-dump \
            tp-list-pairs tp-list-names tp-legacy-snapshot tp-cog-summary; do
            echo "===== ${command} =====" | tee -a /tmp/0790-command-context.log
            grep -R -n -C 5 --fixed-strings "${command}" \
              tech-priests_src/scripts/generated/control_legacy_part_001.lua \
              tech-priests_src/scripts/generated/control_legacy_part_002.lua \
              tech-priests_src/scripts/generated/control_legacy_part_003.lua \
              | tee -a /tmp/0790-command-context.log || true
          done
          exit 1

      - name: Retain exact 0790 command contexts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-observability-0790-command-context
          path: /tmp/0790-command-context.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish generated GUI ownership validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tech-priests/generated-gui-ownership',
              description: 'Temporary 0790 command-form inspection',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
