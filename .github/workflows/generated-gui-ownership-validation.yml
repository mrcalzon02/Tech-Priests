name: Generated GUI ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Inspect 0786 cached target ownership
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/inspect_cached_target_ownership_0786_temp.py 2>&1 | tee /tmp/cached-target-ownership-0786.log

      - name: Audit canonical generated GUI ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_generated_gui_ownership_0783.py 2>&1 | tee /tmp/generated-gui-ownership.log

      - name: Retain generated GUI ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-gui-ownership-output
          path: |
            /tmp/cached-target-ownership-0786.log
            /tmp/generated-gui-ownership.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated GUI ownership validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-gui-ownership',
              description: passed ? 'Canonical generated GUI ownership passed' : 'Canonical generated GUI ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
