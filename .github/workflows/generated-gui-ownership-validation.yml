name: Generated GUI ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Register 0784 development integration checker
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          source='tools/check_development_integration_0732.py'
          checker='"check_generated_mining_beam_ownership_0784.py",'
          if grep -qF "${checker}" "${source}"; then
            echo '0784 integration registration already exists.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_development_integration_0732.py')
          text = path.read_text(encoding='utf-8')
          anchor = '"check_generated_gui_ownership_0783.py",\n}'
          replacement = '"check_generated_gui_ownership_0783.py",\n"check_generated_mining_beam_ownership_0784.py",\n}'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one 0783 integration anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${source}"
          git commit -m 'Register 0784 development integration checker'
          git push origin HEAD:main

      - name: Audit canonical generated GUI ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_generated_gui_ownership_0783.py 2>&1 | tee /tmp/generated-gui-ownership.log

      - name: Retain generated GUI ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-gui-ownership-output
          path: /tmp/generated-gui-ownership.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated GUI ownership validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-gui-ownership',
              description: passed ? 'Canonical generated GUI ownership passed' : 'Canonical generated GUI ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
