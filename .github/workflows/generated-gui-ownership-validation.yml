name: Generated GUI ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded 0785 combat safety consolidation
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          safety='tech-priests_src/scripts/core/combat_safety.lua'
          if grep -q 'TECH_PRIESTS_0322_TARGET_COMBAT_WRAPPERS_RETIRED = true' "${safety}"; then
            echo '0785 source transformation is already present.'
            exit 0
          fi
          python3 .github/scripts/consolidate_combat_safety_0785_temp.py 2>&1 | tee /tmp/combat-safety-0785.log
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tech-priests_src/scripts/generated/control_legacy_part_003.lua \
            tech-priests_src/scripts/generated/control_legacy_part_013.lua \
            tech-priests_src/scripts/generated/control_legacy_part_014.lua \
            tech-priests_src/scripts/core/combat_safety.lua \
            docs/DEVELOPMENT_HISTORY.md
          if git diff --cached --quiet; then
            echo '0785 produced no source changes.' >&2
            exit 1
          fi
          git commit -m 'Consolidate combat safety predicate ownership'
          git push origin HEAD:main

      - name: Audit canonical generated GUI ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_generated_gui_ownership_0783.py 2>&1 | tee /tmp/generated-gui-ownership.log

      - name: Retain generated GUI ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-gui-ownership-output
          path: |
            /tmp/combat-safety-0785.log
            /tmp/generated-gui-ownership.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated GUI ownership validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-gui-ownership',
              description: passed ? 'Canonical generated GUI ownership passed' : 'Canonical generated GUI ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
