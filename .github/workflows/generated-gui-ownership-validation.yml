name: Generated GUI ownership validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/retire_legacy_observability_0790_temp.py
            tech-priests_src/scripts/generated/control_legacy_part_001.lua
            tech-priests_src/scripts/generated/control_legacy_part_002.lua
            tech-priests_src/scripts/generated/control_legacy_part_003.lua
            tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua
            tools/check_development_integration_0732.py
            docs/DEVELOPMENT_HISTORY.md

      - name: Apply guarded 0790 observability cleanup
        id: repair
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -uo pipefail
          marker='TECH_PRIESTS_0120_DEBUG_COMMAND_RETIRED = true'
          if grep -qF "${marker}" tech-priests_src/scripts/generated/control_legacy_part_001.lua; then
            echo '0790 source transformation is already present.' | tee /tmp/legacy-observability-0790.log
            transform_status=0
          else
            python3 .github/scripts/retire_legacy_observability_0790_temp.py > /tmp/legacy-observability-0790.log 2>&1
            transform_status=$?
            cat /tmp/legacy-observability-0790.log
          fi
          detail="$(tail -n 1 /tmp/legacy-observability-0790.log 2>/dev/null | tr '\n\r' '  ' | cut -c1-120)"
          echo "detail=${detail:-0790 repair completed}" >> "${GITHUB_OUTPUT}"
          if (( transform_status != 0 )); then exit "${transform_status}"; fi
          set -e
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_development_integration_0732.py')
          text = path.read_text(encoding='utf-8')
          checker = '"check_legacy_observability_commands_0790.py",'
          if checker not in text:
              anchor = '"check_0250_command_retirement_0789.py",\n}'
              replacement = '"check_0250_command_retirement_0789.py",\n"check_legacy_observability_commands_0790.py",\n}'
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one 0789 integration anchor, found {text.count(anchor)}')
              path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tech-priests_src/scripts/generated/control_legacy_part_001.lua \
            tech-priests_src/scripts/generated/control_legacy_part_002.lua \
            tech-priests_src/scripts/generated/control_legacy_part_003.lua \
            tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua \
            tools/check_development_integration_0732.py \
            docs/DEVELOPMENT_HISTORY.md
          if git diff --cached --quiet; then
            echo '0790 cleanup already committed.'
          else
            git commit -m 'Complete legacy observability cleanup repair'
            git push origin HEAD:main
          fi

      - name: Retain 0790 repair diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-gui-ownership-output
          path: /tmp/legacy-observability-0790.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish 0790 repair diagnostic status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.repair.outcome }}' === 'success';
            const detail = `${{ steps.repair.outputs.detail }}` || '0790 repair did not report';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0790-repair',
              description: detail.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish generated GUI ownership validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-gui-ownership',
              description: passed ? '0790 cleanup carrier passed' : '0790 cleanup carrier failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
