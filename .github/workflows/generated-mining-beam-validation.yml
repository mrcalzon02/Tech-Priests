name: Generated mining beam validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit canonical generated mining beam and extraction ownership
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_generated_mining_beam_ownership_0784.py 2>&1 | tee /tmp/generated-mining-beam.log

      - name: Retain generated mining beam failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-mining-beam-output
          path: /tmp/generated-mining-beam.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated mining beam validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-mining-beam',
              description: passed ? 'Canonical mining beam ownership passed' : 'Canonical mining beam ownership failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
