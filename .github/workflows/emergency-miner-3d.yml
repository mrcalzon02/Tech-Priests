name: Emergency miner source-to-3D asset
on:
  push:
    branches: [main]
    paths:
      - 'art/source-to-3d/emergency-miner/**'
      - '.github/workflows/emergency-miner-3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emergency-miner-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare source inspection
        run: python -m pip install 'Pillow==11.3.0'
      - name: Inspect actual emergency miner sprite and icon with exact measurements
        run: |
          python art/source-to-3d/emergency-miner/inspect_sprite.py \
            --out art-output/emergency-miner --print-preview
      - name: Install Blender for actual editable high-detail 3D modeling
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          blender --version | head -n 2
          PYTHONPATH=/usr/lib/python3/dist-packages blender -b --python-expr "import numpy; print('Blender glTF NumPy available',numpy.__version__)"
      - name: Build V09 sprite-matched irregular forged armor and split controls
        run: |
          python -m py_compile art/source-to-3d/emergency-miner/build_model.py
          PYTHONPATH=/usr/lib/python3/dist-packages blender -b --factory-startup --disable-autoexec -t 2 --python-exit-code 12 \
            --python art/source-to-3d/emergency-miner/build_model.py -- \
            --out art-output/emergency-miner
      - name: Verify only game-camera visible geometry and source-registered renders
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          d=Path('art-output/emergency-miner')
          m=json.loads((d/'model_manifest.json').read_text())
          assert m['asset']=='tech-priests-emergency-miner'
          assert m['candidate_revision']=='V09'
          assert m['source_contour_mesh_count']>=15
          assert m['separate_LCD_and_switch_faceplates']
          assert m['perimeter_hoses_visible_on_chassis_shoulders']
          assert m['control_deck_width_reference_units']==486
          assert m['source_visible_parts']>=75
          assert len(m['terminated_cable_routes'])==7
          assert m['visible_pulse_capacitors']==3
          assert m['physical_knife_switches']==3
          assert m['layer_architecture']['foundation_top'] < m['layer_architecture']['chassis_top'] < m['layer_architecture']['deck_top']
          assert m['view_angle_target_degrees']=={'azimuth':45,'elevation':25}
          assert m['modeled_hidden_internal_components']==0
          assert m['render_geometry_policy']=='GAME_CAMERA_VISIBLE_ONLY'
          assert m['laser_components_documented_not_modeled']
          assert m['technology_principle']=='DOWNWARD_FREQUENCY_MODULATED_LASER_ABLATION'
          assert m['reconstitution']=='CRUDE_LOW_RATE_CONTAMINATED_PROTOMATTER_RECOVERY'
          assert m['mechanical_excavation_components']==0
          assert m['doctrine_slow_polluting_bootstrap_not_industrial']
          assert not m['source_sprite_replaced']
          assert not m['gameplay_changed']
          assert not m['input_sprite_reused_as_texture']
          assert not m['appearance_approved']
          for field, hashfield in (('saved_master','saved_master_sha256'),
                                   ('physical_glb_export','physical_glb_sha256')):
              p=d/m[field]
              assert p.stat().st_size>20000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==m[hashfield]
          for file in m['transparent_render_frames']:
              p=d/file
              assert p.stat().st_size>30000
              with Image.open(p) as image:
                  assert image.size==(1000,1000)
                  assert image.mode=='RGBA'
          assert len(m['transparent_render_frames'])==3
          assert not any('under' in n.lower() or 'drill' in n.lower() for n in m['transparent_render_frames'])
          print('EMERGENCY_MINER_VISIBLE_EXTERIOR_ONLY_VERIFIED__VISUAL_APPROVAL_PENDING')
          PY
      - name: Build matched reference-versus-real-3D comparison contact sheet
        run: |
          python art/source-to-3d/emergency-miner/compare_renders.py \
            --out art-output/emergency-miner --print-preview
      - name: Verify paired review images are available for immediate visual delivery
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image
          out=Path('art-output/emergency-miner')
          paths=('emergency_miner_source_vs_real_3d_contact_sheet.png',
                 'emergency_miner_43px_display_readability.png',
                 '03_visible_enclosure_detail.png')
          proof=[]
          for filename in paths:
              p=out/filename
              assert p.is_file() and p.stat().st_size>30000, filename
              with Image.open(p) as im:
                  im.verify()
              proof.append({'name':filename,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          data={'asset':'emergency-miner','revision':'V09',
                'commit':os.environ['GITHUB_SHA'],
                'run':os.environ['GITHUB_RUN_ID'],
                'user_visible_delivery':'MUST_EMBED_REAL_RENDER_IMAGES_IN_CHAT',
                'visual_acceptance':'PENDING',
                'previews':proof}
          (out/'preview_delivery_manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          print('REVIEW_PREVIEWS_VERIFIED '+json.dumps(data))
          PY
      - name: Preserve source audit, complete editable 3D model and true Blender renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-miner-one-asset-source-to-3d-candidate
          path: art-output/emergency-miner/
          if-no-files-found: warn
          retention-days: 30
