name: Loose pineapple grenade loader Blender build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/martian-loose-grenade-loader.yml'
      - 'art/source-to-3d/martian-bunker/alternatives/v05/build_loose_loader.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: martian-loose-grenade-loader
  cancel-in-progress: false
jobs:
  build-and-render-loose-loaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            art/source-to-3d/martian-bunker/alternatives/v04
            art/source-to-3d/martian-bunker/alternatives/v05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blender 5.0.1 and review dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 fonts-dejavu-core
          python -m pip install Pillow
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz --output blender.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.0.1-linux-x64/blender --version | head -n 2
      - name: Build loader on preserved V04 cannons render and reimport GLB
        env:
          LOADER_RENDER_SIZE: '900'
          LOADER_RENDER_SAMPLES: '16'
        run: |
          python -m py_compile art/source-to-3d/martian-bunker/alternatives/v05/build_loose_loader.py
          ./blender-5.0.1-linux-x64/blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/alternatives/v05/build_loose_loader.py
      - name: Assemble review and native model package
        run: python art/source-to-3d/martian-bunker/alternatives/v05/make_review.py
      - name: Publish model and actual render images to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find art/source-to-3d/martian-bunker/alternatives/v05 -type d -name __pycache__ -prune -exec rm -rf {} +
          find art/source-to-3d/martian-bunker/alternatives/v05 -name '*.blend1' -delete
          git add art/source-to-3d/martian-bunker/alternatives/v05
          if ! git diff --cached --quiet; then
            git commit -m 'Publish loose pineapple grenade loader concept on preserved six cannon lobber'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preserve model package and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loose-pineapple-loader-v05
          path: art/source-to-3d/martian-bunker/alternatives/v05/
          if-no-files-found: warn
          retention-days: 30
