name: Six cast iron lobber Blender build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/martian-six-iron-lobber.yml'
      - 'art/source-to-3d/martian-bunker/alternatives/v04/build_six_lobber.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: martian-six-iron-lobber
  cancel-in-progress: false
jobs:
  build-and-render-six-lobber:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            art/source-to-3d/martian-bunker/alternatives/v02/textures
            art/source-to-3d/martian-bunker/alternatives/v04
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blender 5.0.1 and review dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 fonts-dejavu-core
          python -m pip install Pillow
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz --output blender.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.0.1-linux-x64/blender --version | head -n 2
      - name: Build actual six cannon model render and reimport the GLB
        run: |
          python -m py_compile art/source-to-3d/martian-bunker/alternatives/v04/build_six_lobber.py
          ./blender-5.0.1-linux-x64/blender -b --factory-startup -t 2 --python-exit-code 12 --python art/source-to-3d/martian-bunker/alternatives/v04/build_six_lobber.py
      - name: Assemble four view review and package editable model
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import json,zipfile
          O=Path("art/source-to-3d/martian-bunker/alternatives/v04")
          r=json.loads((O/"validation.json").read_text())
          assert r["total_cannons_after_mirroring"]==6 and r["bottom_feeders_after_mirroring"]==6 and r["glb_reimported"]
          f=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",30)
          dfont=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",24)
          b=Image.new("RGB",(1600,1680),(33,36,40));d=ImageDraw.Draw(b)
          d.text((26,15),"SIX CAST-IRON LOBBERS — THREE PER SIDE",font=f,fill="white")
          for i,(view,label) in enumerate([("oblique","Rounded castings and ring muzzles"),("front","Three mirrored pairs — six cannons"),("side","Three stations on the central fin"),("feeders","Large tubes connect into each cannon bottom")]):
              im=Image.open(O/("six_lobber_"+view+".png")).convert("RGBA")
              box=im.getchannel("A").getbbox()
              assert box and box[0]>0 and box[1]>0 and box[2]<1000 and box[3]<1000,(view,box)
              im.thumbnail((790,740))
              x=(i%2)*800+(800-im.width)//2;y=75+(i//2)*800
              b.paste(im,(x,y),im);d.text(((i%2)*800+25,y+745),label,font=dfont,fill=(226,189,140))
          b.save(O/"Six_Cast_Iron_Lobber_Review.png")
          with zipfile.ZipFile(O/"Six_Cast_Iron_Lobber_V04.zip","w",zipfile.ZIP_DEFLATED) as z:
              for p in O.iterdir():
                  if p.is_file() and p.suffix not in [".zip",".blend1"]:z.write(p,p.name)
          PY
      - name: Publish model and actual render images to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find art/source-to-3d/martian-bunker/alternatives/v04 -type d -name __pycache__ -prune -exec rm -rf {} +
          find art/source-to-3d/martian-bunker/alternatives/v04 -name '*.blend1' -delete
          git add art/source-to-3d/martian-bunker/alternatives/v04
          if ! git diff --cached --quiet; then
            git commit -m 'Publish six cast-iron lobber model with connected bottom feeders and Blender renders'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preserve model package and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-cast-iron-lobber-v04
          path: art/source-to-3d/martian-bunker/alternatives/v04/
          if-no-files-found: warn
          retention-days: 30
