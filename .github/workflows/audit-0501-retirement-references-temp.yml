name: Audit 0501 retirement references

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-0501-retirement-references-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect 0501 and direct-safety references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          {
            echo '=== live 0501 references ==='
            grep -R -n -E 'priest_vanish_guard_0501|TechPriestsPriestVanishGuard0501|TECH_PRIESTS_0501|lifecycle_0501|tp-priest-vanish-0501|vanish_guard_wrapped_0501' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== 0490 rescue/timer references ==='
            grep -R -n -E 'rescue_missing_priests|direct_mining_safety_0490|tp-direct-mining-safety-0490' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
            echo
            echo '=== current 40-count references ==='
            grep -R -n -E 'retired_authority_count=40|26-active / 40-retired|26 active hardeners and 40|40 retired source-only|40 source-preserved|Forty files|40 explicitly retired' tech-priests_src tools docs RECOVERY_REPAIR_SEQUENCE.md || true
          } > /tmp/audit/0501-retirement-references.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retirement-0501-reference-audit
          path: /tmp/audit/0501-retirement-references.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0501-reference-audit',
              description: passed ? '0501 reference audit complete' : '0501 reference audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
