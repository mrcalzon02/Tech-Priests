name: Generated command retirement validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded remaining generated command retirement
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/remaining-generated-command-retirement-0793.log) 2>&1
          python3 .github/scripts/retire_remaining_generated_commands_0793_temp.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tech-priests_src/scripts/generated/control_legacy_part_001.lua \
            tech-priests_src/scripts/generated/control_legacy_part_003.lua \
            tech-priests_src/scripts/generated/control_legacy_part_009.lua \
            tech-priests_src/scripts/generated/control_legacy_part_010.lua \
            tech-priests_src/scripts/generated/control_legacy_part_011.lua \
            tech-priests_src/scripts/generated/control_legacy_part_013.lua \
            tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua \
            tech-priests_src/docs/CURRENT_TESTING_GOALS.md \
            docs/RECOVERY_AUTHORITY_MAP_CURRENT.md \
            docs/DEVELOPMENT_HISTORY.md
          if git diff --cached --quiet; then
            echo 'Remaining generated command retirement already committed.'
          else
            git commit -m 'Close remaining generated command surfaces'
            git push origin HEAD:main
          fi

      - name: Retain remaining generated command retirement failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-generated-command-retirement-0793-output
          path: /tmp/remaining-generated-command-retirement-0793.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish generated command retirement validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/generated-command-retirement',
              description: passed ? 'Remaining generated command retirement carrier passed' : 'Remaining generated command retirement carrier failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
