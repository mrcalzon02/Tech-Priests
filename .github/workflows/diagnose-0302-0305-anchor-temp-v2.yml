name: Capture 0302 and 0305 anchor failure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-0302-0305-anchor-temp-v2.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Execute payload and capture exact failure
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/diagnostic
          python3 - <<'PY' > /tmp/diagnostic/0302-0305-anchor-v2.txt 2>&1
          import pathlib
          import re
          import traceback

          try:
              source = pathlib.Path('.github/workflows/apply-0302-0305-lifecycle-hook-consolidation-temp.yml').read_text(encoding='utf-8')
              match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", source, re.S)
              if not match:
                  raise RuntimeError('staged consolidation payload not found')
              code = '\n'.join(line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines())
              exec(compile(code, '0302-0305-staged-payload', 'exec'), {'__name__': '__main__'})
              print('PAYLOAD COMPLETED')
          except BaseException:
              traceback.print_exc()
          PY
          {
            echo
            echo '=== git diff --stat ==='
            git diff --stat
            echo
            echo '=== git diff ==='
            git diff -- tech-priests_src/scripts/generated/control_legacy_part_002.lua tech-priests_src/scripts/generated/control_legacy_part_020.lua tech-priests_src/scripts/core/priest_lifecycle_authority_0499.lua tech-priests_src/scripts/core/runtime_command_cleanup_0720.lua tools/check_generated_equipment_lifecycle_hooks_0779.py tools/check_development_integration_0732.py docs/DEVELOPMENT_HISTORY.md RECOVERY_REPAIR_SEQUENCE.md
          } >> /tmp/diagnostic/0302-0305-anchor-v2.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: 0302-0305-anchor-diagnostic-v2
          path: /tmp/diagnostic/0302-0305-anchor-v2.txt
          retention-days: 2
      - name: Publish diagnostic status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'tech-priests/0302-0305-anchor-diagnostic-v2',description:'0302/0305 anchor diagnostic captured',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});