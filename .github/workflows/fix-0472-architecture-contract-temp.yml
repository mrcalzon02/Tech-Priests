name: Fix 0472 architecture contracts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-0472-architecture-contract-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Align architecture checker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_recovery_architecture_0744.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"Thirty files remain"': '"Thirty-one files remain"',
              '"Audit bounded combat proxy ownership"': '"Audit consolidated combat proxy ownership"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing stale architecture contract: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_recovery_architecture_0744.py
          git commit -m "Align architecture with retired 0472"
          git pull --rebase origin main
          git push origin HEAD:main
