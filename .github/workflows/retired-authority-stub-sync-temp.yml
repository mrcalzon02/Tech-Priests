name: Retired authority source cleanup temporary

on:
  push:
    branches: [main]
    paths: [.github/workflows/retired-authority-stub-sync-temp.yml]

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Replace retired authorities with inert stubs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "direct_acquisition_movement_lock_0650.lua": "scripts.core.direct_acquisition_executor_0513",
              "movement_vector_enforcer_0651.lua": "canonical movement authority",
              "movement_target_reconciler_0652.lua": "canonical movement request authority",
              "movement_intent_authority_0654.lua": "scripts.core.single_dispatcher_0510",
              "active_leaf_task_truth_0655.lua": "scripts.core.canonical_action_0744",
              "construction_placement_authority_0656.lua": "scripts.core.construction_planner",
              "logistics_mineable_source_bridge_0657.lua": "scripts.core.direct_acquisition_executor_0513",
              "repair_executor_integrity_0673.lua": "scripts.core.repair_executor_0516",
              "combat_repair_integrity_0676.lua": "scripts.core.repair_executor_0516",
              "combat_repair_terminal_cleanup_0677.lua": "scripts.core.combat_repair_doctrine_0517",
              "machine_logistics_integrity_0682.lua": "scripts.core.logistics_machine_fulfillment_0528",
              "machine_logistics_candidate_recovery_0683.lua": "scripts.core.logistics_machine_fulfillment_0528",
              "machine_logistics_final_authority_0684.lua": "scripts.core.logistics_machine_fulfillment_0528",
              "item_family_integrity_0703.lua": "scripts.core.item_family_logistics_0702",
              "energy_readiness_diagnostics_0711.lua": "scripts.core.energy_family_readiness_0705",
              "energy_item_automation_guard_0722.lua": "scripts.core.energy_family_logistics_0707",
              "artillery_train_validity_guard_0724.lua": "scripts.core.artillery_logistics_0713",
              "energy_automation_guard_install_assertion_0726.lua": "scripts.core.energy_family_readiness_0705",
              "fusion_reactor_readiness_guard_0727.lua": "scripts.core.energy_family_readiness_0705",
              "rocket_silo_live_ownership_guard_0728.lua": "scripts.core.rocket_silo_logistics_0710",
              "fluid_turret_planner_integrity_0730.lua": "scripts.core.fluid_turret_connection_planner_0719",
              "fluid_turret_internal_buffer_guard_0731.lua": "scripts.core.fluid_turret_readiness_0716",
              "fluid_turret_proposal_integrity_0718.lua": "scripts.core.fluid_turret_connection_proposals_0717",
          }
          core = Path("tech-priests_src/scripts/core")
          for filename, replacement in replacements.items():
              path = core / filename
              if not path.is_file():
                  raise SystemExit(f"missing retired authority: {path}")
              label = filename.removesuffix(".lua")
              path.write_text(
                  "-- Tech Priests 0.1.674-dev retired authority.\n"
                  "-- Historical source ownership has been consolidated into the replacement below.\n"
                  "-- This file intentionally has no installer, cadence, wrapper hook, movement call,\n"
                  "-- command path, state mutation, or physical execution surface.\n"
                  f"local M={{version=\"0.1.674-dev\",retired=true,authority=\"{label}\",replacement=\"{replacement}\"}}\n"
                  "return M\n",
                  encoding="utf-8",
              )
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src/scripts/core/*.lua
          git commit -m "Make retired authorities source-inert"
          git pull --rebase origin main
          git push origin HEAD:main
