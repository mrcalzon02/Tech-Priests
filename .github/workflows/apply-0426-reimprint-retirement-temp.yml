name: Publish 0426 reimprint retirement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-0426-reimprint-retirement-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Consolidate priest-death reimprint ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, zlib
          payload = ''''''
          exec(zlib.decompress(base64.b64decode(payload)).decode(), {"__name__": "__main__"})
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Retire 0426 into canonical reimprint recovery"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0426-reimprint-retirement',
              description: passed ? '0426 reimprint retirement pushed' : '0426 reimprint retirement failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });