name: Factorio runtime validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/factorio-runtime-tests.yml'
      - 'tests/scenarios/all-ground-ranks/**'
      - 'tech-priests_src/**'
permissions:
  contents: read
  statuses: write
jobs:
  factorio-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Expose live headless verification run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tech-priests/factorio-runtime',
              description: 'Headless industrial production run in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Static registry regression
        run: python3 tools/check_runtime_registry_atomicity_0813.py --self-test
      - name: Validate mod metadata and prepare isolated installation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          info=json.loads(pathlib.Path("tech-priests_src/info.json").read_text())
          assert info["name"]=="tech-priests"
          assert info["factorio_version"]=="2.0"
          print("Mod:",info["name"],info["version"])
          print("Required dependencies:",[d for d in info["dependencies"] if not d.startswith("?")])
          PY
          mkdir -p "$RUNNER_TEMP/factorio/mods"
          cp -a tech-priests_src "$RUNNER_TEMP/factorio/mods/tech-priests"
          # Run the scenario IN the isolated Tech-Priests install; never as another mod.
          cp tests/scenarios/all-ground-ranks/ground_rank_harness.lua \
            "$RUNNER_TEMP/factorio/mods/tech-priests/scripts/core/ci_ground_rank_harness.lua"
          cat >> "$RUNNER_TEMP/factorio/mods/tech-priests/control.lua" <<'LUA'
          -- CI only: install a broker service after the regular mod is loaded.
          _G.TP_CI_LATE_COMBAT=true
          require("scripts.core.ci_ground_rank_harness").install()
          LUA
      - name: Download Factorio 2.0 headless
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/factorio.tar.xz" \
            "https://factorio.com/get-download/stable/headless/linux64"
          tar -xJf "$RUNNER_TEMP/factorio.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/factorio/bin/x64/factorio" --version
      - name: Resolve required mods from authoritative info.json
        shell: bash
        env:
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request, urllib.error
          from urllib.parse import urljoin, urlencode
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"factorio/mods"
          username=os.environ.get("FACTORIO_USERNAME","")
          token=os.environ.get("FACTORIO_TOKEN","")
          game=json.loads(pathlib.Path("tech-priests_src/info.json").read_text())
          pending=list(game["dependencies"])
          required=[d for d in pending if d.strip() and d.strip()[0] not in "?!~" and d.split()[0] not in ("base","tech-priests")]
          if required and (not username or not token):
              raise RuntimeError("Required Mod Portal downloads need FACTORIO_USERNAME and FACTORIO_TOKEN secrets.")
          print("External required dependencies:", required, flush=True)
          done={"base","tech-priests"}
          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Tech-Priests-CI/1"}),timeout=25) as response:
                  return json.load(response)
          while pending:
              declaration=pending.pop(0).strip()
              if not declaration or declaration[0] in "?!~": continue
              name=re.split(r"\s*[<>=]",declaration, maxsplit=1)[0].strip()
              if name in done: continue
              done.add(name)
              metadata=get_json("https://mods.factorio.com/api/mods/"+name+"/full")
              releases=[v for v in metadata.get("releases",[]) if v.get("info_json",{}).get("factorio_version")=="2.0"]
              if not releases: raise RuntimeError("No Factorio 2.0 release: "+name)
              release=max(releases,key=lambda v:tuple(int(x) for x in v["version"].split(".")))
              print("Resolving",name,release["version"],flush=True)
              pending.extend(release.get("info_json",{}).get("dependencies",[]))
              url=urljoin("https://mods.factorio.com",release["download_url"])+"?"+urlencode({"username":username,"token":token})
              target=root/(name+"_"+release["version"]+".zip")
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Tech-Priests-CI/1"}),timeout=90) as response:
                      target.write_bytes(response.read())
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"Authenticated Mod Portal download failed for {name} (HTTP {error.code}); check license and GitHub Actions credentials") from None
              import zipfile
              if not zipfile.is_zipfile(target): raise RuntimeError("Invalid downloaded mod ZIP: "+name)
          PY
      - name: Headless game initialization and save/load smoke test
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/factorio"
          bin="$root/bin/x64/factorio"
          # Preserve the same deterministic Factorio seed while extending
          # the original 36k benchmark to 108k uninterrupted ticks. The
          # scenario reports 18k/36k/72k/108k progress and an evidence-based
          # time-versus-assignment diagnosis before the original acceptance.
          seed=907260
          echo "CI ground-rank deterministic map seed: $seed"
          "$bin" --mod-directory "$root/mods" --create "$RUNNER_TEMP/tech-priests-smoke.zip" --map-gen-seed "$seed" 2>&1 | tee "$RUNNER_TEMP/factorio-create.log"
          mkdir -p "$GITHUB_WORKSPACE/test-artifacts"
          cp "$RUNNER_TEMP/tech-priests-smoke.zip" "$GITHUB_WORKSPACE/test-artifacts/tech-priests-ground-ranks-initial.zip"
          timeout 1800s "$bin" --mod-directory "$root/mods" --benchmark "$RUNNER_TEMP/tech-priests-smoke.zip" --benchmark-ticks 123000 > "$RUNNER_TEMP/factorio-server.log" 2>&1 || status=$?
          if [[ "${status:-0}" -ne 0 ]]; then
            echo "::error::Factorio headless benchmark exited unexpectedly (status ${status:-0})"
            tail -n 160 "$RUNNER_TEMP/factorio-server.log" || true
            exit 1
          fi
          if ! grep -q '\[TP-GROUND-RANK-TEST\] PASS ground ranks with live pairs=4' "$RUNNER_TEMP/factorio-server.log"; then
            echo "::error::Four-rank ground fixture did not confirm four living priest pairs"
            grep 'TP-GROUND-RANK-TEST' "$RUNNER_TEMP/factorio-server.log" || true
            exit 1
          fi
          # Use literal fatal markers. The former doubly-escaped ERE
          # contained an invalid bracket range and grep exited 2 inside an
          # if-condition, silently bypassing this safety gate. Normal
          # diagnostics may say "missing=iron-plate" or "failed route":
          # these are not harness failures without an explicit fatal marker.
          if grep -Fqi 'failed to install' "$RUNNER_TEMP/factorio-server.log" \
              || grep -Fq '[Tech-Priests][CRITICAL]' "$RUNNER_TEMP/factorio-server.log" \
              || grep -Fq '[TP-GROUND-RANK-TEST] ERROR ' "$RUNNER_TEMP/factorio-server.log" \
              || grep -Fq '[TP-GROUND-RANK-TEST] FAIL ' "$RUNNER_TEMP/factorio-server.log"; then
            echo "::error::Tech-Priests subsystem or test fixture failed"
            exit 1
          fi
          if ! grep -q '\[TP-GROUND-RANK-TEST\] PASS recovery assessments=' "$RUNNER_TEMP/factorio-server.log"; then
            echo "::error::Recovery assessments were not verified"
            tail -n 160 "$RUNNER_TEMP/factorio-server.log" || true
            exit 1
          fi
          if ! grep -q '\[TP-GROUND-RANK-TEST\] DURATION_DIAGNOSIS verdict=' "$RUNNER_TEMP/factorio-server.log"; then
            echo "::error::Extended time-versus-assignment diagnosis is missing"
            grep 'TP-GROUND-RANK-TEST' "$RUNNER_TEMP/factorio-server.log" | tail -n 80 || true
            exit 1
          fi
          if ! grep -q '\[TP-GROUND-RANK-TEST\] PASS autonomous bootstrap-to-science' "$RUNNER_TEMP/factorio-server.log"; then
            echo "::error::No confirmed industrial and science recovery"
            grep 'TP-GROUND-RANK-TEST' "$RUNNER_TEMP/factorio-server.log" | tail -n 80 || true
            exit 1
          fi
          if ! grep -Fq '[TP-GROUND-RANK-TEST] PASS hostile-damage defensive establishment' "$RUNNER_TEMP/factorio-server.log"; then
            echo "::error::Live biter attacks did not produce armed, newly built defenses"
            grep -E 'TP-GROUND-RANK-TEST.*(COMBAT_|hostile-damage)' "$RUNNER_TEMP/factorio-server.log" | tail -n 45 || true
            exit 1
          fi
          if grep -F '[TP-GROUND-RANK-TEST] FAIL ' "$RUNNER_TEMP/factorio-server.log"; then
            echo "::error::Ground-rank harness reported a failed assertion"
            exit 1
          fi
          if grep -Ei 'Error while loading|Failed to load|stack traceback|__tech-priests__.*error' "$RUNNER_TEMP/factorio-server.log"; then
            echo "::error::Factorio reported a mod load failure"
            exit 1
          fi
      - name: Verify real server autosave and separate-process Cogitator reload
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_factorio_save_reload_smoke.py \
            --binary "$RUNNER_TEMP/factorio/bin/x64/factorio" \
            --mod-dir "$RUNNER_TEMP/factorio/mods" \
            --initial-save "$RUNNER_TEMP/tech-priests-smoke.zip" \
            --work-dir "$RUNNER_TEMP/factorio-save-reload" \
            --artifact-dir "$GITHUB_WORKSPACE/test-artifacts"
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-runtime-logs
          path: |
            ${{ runner.temp }}/factorio-create.log
            ${{ runner.temp }}/factorio-server.log
            ${{ runner.temp }}/factorio-save-reload/factorio-save-server.log
            ${{ runner.temp }}/factorio-save-reload/factorio-reload.log
            test-artifacts/tech-priests-ground-ranks-initial.zip
            test-artifacts/tech-priests-ground-ranks-save-checkpoint.zip
          if-no-files-found: warn
      - name: Publish verified headless production result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/factorio-runtime',
              description: passed ? 'Headless industry and science proof passed' : 'Headless industrial simulation did not meet acceptance',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
