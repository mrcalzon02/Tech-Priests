name: Legacy observability validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit retired legacy observability commands
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_legacy_observability_commands_0790.py 2>&1 | tee /tmp/legacy-observability.log

      - name: Retain legacy observability failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-observability-output
          path: /tmp/legacy-observability.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish legacy observability validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/legacy-observability',
              description: passed ? 'Legacy observability retirement passed' : 'Legacy observability retirement failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
