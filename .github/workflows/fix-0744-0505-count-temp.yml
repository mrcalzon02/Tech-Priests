name: Correct recovery architecture count

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-0744-0505-count-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Align architecture documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_recovery_architecture_0744.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"Forty-four files remain"': '"Forty-five files remain"',
              '"44 source-preserved authorities"': '"45 source-preserved authorities"',
              '"26 active hardeners and 44 explicitly retired"': '"26 active hardeners and 45 explicitly retired"',
              'active=26 retired=38': 'active=26 retired=45',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing architecture count anchor: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_recovery_architecture_0744.py
          git commit -m "Align recovery architecture with 26 active and 45 retired"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0744-count-correction',
              description: passed ? '0744 count correction pushed' : '0744 count correction failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });