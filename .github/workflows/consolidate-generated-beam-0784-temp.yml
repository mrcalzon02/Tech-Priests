name: Consolidate generated beam ownership 0784

on:
  push:
    branches:
      - main
    paths:
      - .github/triggers/consolidate-generated-beam-0784.trigger

permissions:
  contents: write
  statuses: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Consolidate canonical mining beam ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          generated = root / 'tech-priests_src/scripts/generated'
          part21_path = generated / 'control_legacy_part_021.lua'
          history_path = root / 'docs/DEVELOPMENT_HISTORY.md'
          lua_paths = sorted((root / 'tech-priests_src').rglob('*.lua'))

          scan_signature = 'function draw_emergency_craft_scan_line(pair, target_entity)'
          scan_occurrences = []
          for path in lua_paths:
              text = path.read_text(encoding='utf-8', errors='replace')
              start = 0
              while True:
                  index = text.find(scan_signature, start)
                  if index < 0:
                      break
                  scan_occurrences.append((path, index, text[max(0, index - 240):index]))
                  start = index + len(scan_signature)
          if len(scan_occurrences) != 2:
              raise SystemExit(f'expected two scan-line definitions before 0784, found {len(scan_occurrences)}: {[(str(p), i) for p, i, _ in scan_occurrences]}')
          canonical = [entry for entry in scan_occurrences if 'TECH_PRIESTS_0315_PRE_DRAW_EMERGENCY_CRAFT_SCAN_LINE' not in entry[2]]
          overrides = [entry for entry in scan_occurrences if 'TECH_PRIESTS_0315_PRE_DRAW_EMERGENCY_CRAFT_SCAN_LINE' in entry[2]]
          if len(canonical) != 1 or len(overrides) != 1:
              raise SystemExit(f'could not uniquely classify scan-line definitions: canonical={len(canonical)} override={len(overrides)}')

          canonical_path, canonical_index, _ = canonical[0]
          canonical_text = canonical_path.read_text(encoding='utf-8')
          insertion = '''function draw_emergency_craft_scan_line(pair, target_entity)
  -- 0.1.674-dev / 0784: direct mining uses the canonical damage beam only.
  -- Suppress the older decorative scan line for direct extraction and loose items.
  local direct_current_0784 = pair and pair.emergency_craft and pair.emergency_craft.current or nil
  if direct_current_0784 and (direct_current_0784.kind == "direct-mine-0273" or direct_current_0784.kind == "direct-dirt-0273") then
    return nil
  end
  if target_entity and target_entity.valid and target_entity.type == "item-entity" then
    return nil
  end'''
          if 'local direct_current_0784' in canonical_text:
              raise SystemExit('canonical scan-line suppression is already present')
          canonical_text = canonical_text[:canonical_index] + canonical_text[canonical_index:].replace(scan_signature, insertion, 1)
          canonical_path.write_text(canonical_text, encoding='utf-8')

          part21 = part21_path.read_text(encoding='utf-8')
          if part21.count('function tech_priests_0312_fire_laser(priest, target, damage, reason, color)') != 2:
              raise SystemExit('expected exactly two 0312 beam definitions before consolidation')

          old_canonical_beam = '''function tech_priests_0312_fire_laser(priest, target, damage, reason, color)
  if not (priest and priest.valid and target and target.valid) then return false end
  damage = math.max(1, damage or TECH_PRIESTS_0312_MINING_LASER_DAMAGE)
  color = color or { r = 0.95, g = 0.25, b = 0.05, a = 0.75 }
  local ok_damage = pcall(function()
    if target.valid and target.health and target.health > 0 then
      target.damage(damage, priest.force, "laser", priest)
    elseif target.valid and target.type == "resource" then
      local amount = target.amount or 0
      if amount > 1 then target.amount = math.max(1, amount - damage) end
    end
  end)
  if rendering then
    pcall(function()
      rendering.draw_line({ color = color, width = 2, from = priest.position, to = target.position, surface = priest.surface, time_to_live = 12, forces = { priest.force } })
    end)
    pcall(function()
      rendering.draw_circle({ color = { r = color.r or 1, g = color.g or 0.5, b = color.b or 0.1, a = 0.18 }, radius = 0.35, width = 1, filled = true, target = target, surface = priest.surface, time_to_live = 8, forces = { priest.force } })
    end)
  end
  if spawn_emergency_craft_smoke then
    pcall(function() spawn_emergency_craft_smoke({ priest = priest, station = nil }, target.position, false) end)
  elseif priest.surface and priest.surface.create_trivial_smoke then
    pcall(function() priest.surface.create_trivial_smoke({ name = "smoke-fast", position = target.position }) end)
  end
  return ok_damage
end'''

          canonical_beam = '''function tech_priests_0312_beam_origin(priest)
  return { entity = priest, offset = TECH_PRIEST_SCAN_ORIGIN_OFFSET or { 0, -1.35 } }
end

function tech_priests_0312_beam_target_position(target)
  if target and target.valid and target.position then return target.position end
  return target
end

function tech_priests_0312_effective_beam_profile(force)
  if tech_priests_0313_force_upgrade_profile then
    local ok, profile = pcall(function() return tech_priests_0313_force_upgrade_profile(force) end)
    if ok and profile then return profile end
  end
  return {
    mining_laser_damage = TECH_PRIESTS_0312_MINING_LASER_DAMAGE or 5,
    mining_laser_ticks = TECH_PRIESTS_0315_MINING_PULSE_TICKS or 5,
    mining_pulse_smoke = 2,
  }
end

function tech_priests_0312_fire_laser(priest, target, damage, reason, color)
  if not (priest and priest.valid and target and target.valid) then return false end
  if target.type == "item-entity" then return false end
  local pos = tech_priests_0312_beam_target_position(target)
  if not pos then return false end
  local force = priest.force
  local profile = tech_priests_0312_effective_beam_profile(force)
  local d = math.max(1, damage or profile.mining_laser_damage or 5)
  color = color or { r = 1.0, g = 0.25, b = 0.05, a = 0.68 }

  local ok_damage = true
  pcall(function()
    if target.valid and target.type == "resource" then
      local amount = target.amount or 0
      if amount and amount > 1 then target.amount = math.max(1, amount - math.max(1, math.floor(d * 0.35))) end
    elseif target.valid and target.health and target.health > 0 then
      target.damage(d, force, "laser", priest)
    end
  end)

  if rendering and rendering.draw_line then
    pcall(function()
      rendering.draw_line({
        color = color,
        width = TECH_PRIESTS_0315_BEAM_WIDTH or 2,
        from = tech_priests_0312_beam_origin(priest),
        to = pos,
        surface = priest.surface,
        time_to_live = 7,
        forces = { force },
      })
    end)
    pcall(function()
      rendering.draw_circle({
        color = { r = color.r or 1, g = color.g or 0.4, b = color.b or 0.05, a = 0.24 },
        radius = 0.22,
        width = 1,
        filled = true,
        target = target,
        surface = priest.surface,
        time_to_live = 6,
        forces = { force },
      })
    end)
  end

  local smoke_count = math.max(2, profile.mining_pulse_smoke or 2)
  for i = 1, smoke_count do
    pcall(function()
      priest.surface.create_trivial_smoke({
        name = "smoke-fast",
        position = { x = pos.x + (i - 1.5) * 0.07, y = pos.y + ((i % 2) - 0.5) * 0.08 },
      })
    end)
  end
  pcall(function() priest.surface.create_entity({ name = "spark-explosion", position = pos }) end)
  return ok_damage
end'''

          if old_canonical_beam not in part21:
              raise SystemExit('canonical 0312 beam source block did not match expected source')
          part21 = part21.replace(old_canonical_beam, canonical_beam, 1)

          old_scan_override = '''TECH_PRIESTS_0315_PRE_DRAW_EMERGENCY_CRAFT_SCAN_LINE = draw_emergency_craft_scan_line
function draw_emergency_craft_scan_line(pair, target_entity)
  local cur = pair and pair.emergency_craft and pair.emergency_craft.current or nil
  if cur and (cur.kind == "direct-mine-0273" or cur.kind == "direct-dirt-0273") then
    return nil
  end
  if target_entity and target_entity.valid and target_entity.type == "item-entity" then
    return nil
  end
  if TECH_PRIESTS_0315_PRE_DRAW_EMERGENCY_CRAFT_SCAN_LINE then
    return TECH_PRIESTS_0315_PRE_DRAW_EMERGENCY_CRAFT_SCAN_LINE(pair, target_entity)
  end
end'''
          if old_scan_override not in part21:
              raise SystemExit('0315 scan-line override block did not match expected source')
          part21 = part21.replace(old_scan_override, '''-- 0.1.674-dev / 0784: final direct-mining scan suppression is integrated into
-- the original scan-line owner; the 0315 predecessor wrapper is retired.
TECH_PRIESTS_0315_SCAN_LINE_OVERRIDE_RETIRED = true''', 1)

          for old_helper, marker in (
              ('''function tech_priests_0315_origin(priest)
  return { entity = priest, offset = TECH_PRIEST_SCAN_ORIGIN_OFFSET or { 0, -1.35 } }
end''', 'TECH_PRIESTS_0315_BEAM_ORIGIN_HELPER_RETIRED = true'),
              ('''function tech_priests_0315_target_position(target)
  if target and target.valid and target.position then return target.position end
  return target
end''', 'TECH_PRIESTS_0315_BEAM_TARGET_HELPER_RETIRED = true'),
              ('''function tech_priests_0315_effective_profile(force)
  if tech_priests_0313_force_upgrade_profile then
    local ok, profile = pcall(function() return tech_priests_0313_force_upgrade_profile(force) end)
    if ok and profile then return profile end
  end
  return { mining_laser_damage = TECH_PRIESTS_0312_MINING_LASER_DAMAGE or 5, mining_laser_ticks = TECH_PRIESTS_0315_MINING_PULSE_TICKS, mining_pulse_smoke = 2 }
end''', 'TECH_PRIESTS_0315_BEAM_PROFILE_HELPER_RETIRED = true'),
          ):
              if old_helper not in part21:
                  raise SystemExit(f'0315 beam helper did not match expected source: {old_helper.splitlines()[0]}')
              part21 = part21.replace(old_helper, marker, 1)

          old_beam_override = '''function tech_priests_0312_fire_laser(priest, target, damage, reason, color)
  if not (priest and priest.valid and target and target.valid) then return false end
  if target.type == "item-entity" then return false end
  local pos = tech_priests_0315_target_position(target)
  if not pos then return false end
  local force = priest.force
  local profile = tech_priests_0315_effective_profile(force)
  local d = math.max(1, damage or profile.mining_laser_damage or 5)
  color = color or { r = 1.0, g = 0.25, b = 0.05, a = 0.68 }

  local ok_damage = true
  pcall(function()
    if target.valid and target.type == "resource" then
      local amount = target.amount or 0
      if amount and amount > 1 then target.amount = math.max(1, amount - math.max(1, math.floor(d * 0.35))) end
    elseif target.valid and target.health and target.health > 0 then
      target.damage(d, force, "laser", priest)
    end
  end)

  if rendering and rendering.draw_line then
    pcall(function()
      rendering.draw_line({
        color = color,
        width = TECH_PRIESTS_0315_BEAM_WIDTH,
        from = tech_priests_0315_origin(priest),
        to = pos,
        surface = priest.surface,
        time_to_live = 7,
        forces = { force }
      })
    end)
    pcall(function()
      rendering.draw_circle({
        color = { r = color.r or 1, g = color.g or 0.4, b = color.b or 0.05, a = 0.24 },
        radius = 0.22,
        width = 1,
        filled = true,
        target = target,
        surface = priest.surface,
        time_to_live = 6,
        forces = { force }
      })
    end)
  end

  local smoke_count = math.max(2, profile.mining_pulse_smoke or 2)
  for i = 1, smoke_count do
    pcall(function()
      priest.surface.create_trivial_smoke({ name = "smoke-fast", position = { x = pos.x + (i - 1.5) * 0.07, y = pos.y + ((i % 2) - 0.5) * 0.08 } })
    end)
  end
  pcall(function() priest.surface.create_entity({ name = "spark-explosion", position = pos }) end)
  return ok_damage
end'''
          if old_beam_override not in part21:
              raise SystemExit('0315 beam override block did not match expected source')
          part21 = part21.replace(old_beam_override, '''-- 0.1.674-dev / 0784: final 0315 beam behavior is integrated into canonical 0312.
TECH_PRIESTS_0315_BEAM_OVERRIDE_RETIRED = true''', 1)
          part21_path.write_text(part21, encoding='utf-8')

          post_texts = {path: path.read_text(encoding='utf-8', errors='replace') for path in lua_paths}
          all_lua = '\n'.join(post_texts.values())
          assertions = {
              scan_signature: 1,
              'function tech_priests_0312_fire_laser(priest, target, damage, reason, color)': 1,
              'function tech_priests_0312_beam_origin(priest)': 1,
              'function tech_priests_0312_beam_target_position(target)': 1,
              'function tech_priests_0312_effective_beam_profile(force)': 1,
              'function tech_priests_0312_service_direct_current(pair, task)': 1,
              'function tech_priests_0312_fallback_combat_laser(pair, target, reason)': 1,
          }
          for needle, expected in assertions.items():
              actual = all_lua.count(needle)
              if actual != expected:
                  raise SystemExit(f'post-patch assertion failed: {needle!r} expected {expected}, found {actual}')
          forbidden = (
              'TECH_PRIESTS_0315_PRE_DRAW_EMERGENCY_CRAFT_SCAN_LINE',
              'function tech_priests_0315_origin(priest)',
              'function tech_priests_0315_target_position(target)',
              'function tech_priests_0315_effective_profile(force)',
          )
          for needle in forbidden:
              if needle in all_lua:
                  raise SystemExit(f'post-patch forbidden ownership remains: {needle}')
          required_markers = (
              'TECH_PRIESTS_0315_SCAN_LINE_OVERRIDE_RETIRED = true',
              'TECH_PRIESTS_0315_BEAM_ORIGIN_HELPER_RETIRED = true',
              'TECH_PRIESTS_0315_BEAM_TARGET_HELPER_RETIRED = true',
              'TECH_PRIESTS_0315_BEAM_PROFILE_HELPER_RETIRED = true',
              'TECH_PRIESTS_0315_BEAM_OVERRIDE_RETIRED = true',
          )
          for marker in required_markers:
              if marker not in part21:
                  raise SystemExit(f'post-patch retirement marker missing: {marker}')

          history = history_path.read_text(encoding='utf-8')
          heading = '## 2026-07-21 — Milestone 0784: Canonical Generated Mining Beam Ownership'
          if heading not in history:
              history += f'''\n\n{heading}\n\nConsolidated the final 0.1.315 mining-beam presentation and damage behavior into the original 0.1.312 beam owner. The canonical emergency-craft service continues to own movement, pulse timing, extraction, deposit, state cleanup, combat interruption, and return-to-station behavior. The original scan-line owner now suppresses decorative lines for direct mining and loose item entities, while the later predecessor wrapper, second beam definition, and beam-only 0315 helpers are explicitly retired. Static Source validation does not constitute Factorio runtime proof.\n'''
              history_path.write_text(history, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-priests_src/scripts/generated/control_legacy_part_*.lua docs/DEVELOPMENT_HISTORY.md
          if git diff --cached --quiet; then
            echo "No source changes were produced." >&2
            exit 1
          fi
          git commit -m "Consolidate generated mining beam ownership"
          git push origin HEAD:main

      - name: Publish 0784 consolidator status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0784-beam-consolidator',
              description: passed ? 'Canonical generated beam consolidation completed' : 'Canonical generated beam consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
