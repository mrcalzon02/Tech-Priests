name: Source validation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Correct and diagnose governance count
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_governance_prerequisites_0738.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('26-active / 29-retired graph', '26-active / 30-retired graph', 1)
          path.write_text(text, encoding='utf-8')
          PY
            python3 tools/check_governance_prerequisites_0738.py .
          ) >/tmp/governance-correction.log 2>&1
          status=$?
          set -e
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          if (( status != 0 )); then
            git reset --hard HEAD
            tail -n 200 /tmp/governance-correction.log > .github/governance-repair-error.txt
            git add .github/governance-repair-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "Record governance repair failure"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            cat /tmp/governance-correction.log
            exit "${status}"
          fi
          rm -f .github/governance-repair-error.txt
          git add tools/check_governance_prerequisites_0738.py .github/governance-repair-error.txt
          git commit -m "Align governance with 26 active and 30 retired"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish correction status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/governance-count-correction',
              description: passed ? 'Governance count corrected and checked' : 'Governance count correction failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
