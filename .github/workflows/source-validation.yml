name: Restore source validation with 0772

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Restore permanent source validation
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/restore_source_validation_0772_temp.py
          python3 tools/restore_source_validation_0772_temp.py
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore validation with 0501 vanish boundary"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish restore status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0772-validator-restore',
              description: passed ? 'Permanent validator restored with 0772' : 'Validator restore failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
