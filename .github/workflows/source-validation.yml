name: Diagnose 0501 vanish guard retirement

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Run retirement and retain exact failure
        shell: bash
        run: |
          set +e
          python3 tools/apply_0501_vanish_guard_retirement_temp.py >/tmp/0501-retirement.log 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            git reset --hard HEAD
            tail -n 120 /tmp/0501-retirement.log > .github/0501-retirement-error.txt
            git config user.name "Tech Priests Recovery"
            git config user.email "actions@users.noreply.github.com"
            git add .github/0501-retirement-error.txt
            git commit -m "Record 0501 retirement matcher failure"
            git pull --rebase origin main
            git push origin HEAD:main
            cat /tmp/0501-retirement.log
            exit "${status}"
          fi
          rm -f .github/0501-retirement-error.txt
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Retire 0501 into canonical acquisition and lifecycle safety"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish diagnostic status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0501-retirement-diagnostic',
              description: passed ? '0501 retirement commit pushed' : '0501 retirement failure recorded',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
