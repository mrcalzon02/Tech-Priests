name: Apply ground route and hidden loader retirement

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Retire 0632 and 0633
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/apply_ground_route_hidden_loader_retirement_temp.py
          python3 tools/apply_ground_route_hidden_loader_retirement_temp.py
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Retire 0632 and 0633 into canonical routing and explicit loaders"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0632-0633-retirement',
              description: passed ? '0632/0633 retirement commit pushed' : '0632/0633 retirement failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
