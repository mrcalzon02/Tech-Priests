name: Source validation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Align architecture checker with 30 retired authorities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_recovery_architecture_0744.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"29 source-preserved authorities"': '"30 source-preserved authorities"',
              '"26 active hardeners and 29 explicitly retired"': '"26 active hardeners and 30 explicitly retired"',
              'active=26 retired=29 construction=canonical': 'active=26 retired=30 construction=canonical',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing stale architecture contract: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_recovery_architecture_0744.py
          git commit -m "Align architecture with 30 retired authorities"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish correction status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/architecture-count-correction',
              description: passed ? 'Architecture count correction pushed' : 'Architecture count correction failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
