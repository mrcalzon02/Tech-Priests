name: Source validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      # BEGIN TEMP MOVEMENT CONSOLIDATION
      - name: Apply movement cadence consolidation once
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/movement-cadence-consolidation.trigger ]]; then
            echo 'No movement consolidation trigger is present.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          specification = Path('.github/workflows/movement-cadence-consolidation-temp.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if start not in specification:
              raise SystemExit('movement consolidation Python block not found')
          block = textwrap.dedent(specification.split(start, 1)[1].split(end, 1)[0])
          original_replace = textwrap.dedent('''
          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')
          ''').strip()
          idempotent_replace = textwrap.dedent('''
          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  print(f'skipping non-matching historical text in {path}: {old[:120]}')
                  return
              p.write_text(text.replace(old,new,count),encoding='utf-8')
          ''').strip()
          if original_replace not in block:
              raise SystemExit('replace helper contract not found in movement specification')
          block = block.replace(original_replace, idempotent_replace, 1)
          block = block.replace(
              '26-active / 29-retired standard-fluid graph',
              '26-active / 29-retired recovery graph',
          )
          block = block.replace(
              'eight-minute long-action leases',
              'eight-second long-action leases',
          )
          exec(compile(block, 'movement-cadence-consolidation', 'exec'))
          PY
          rm -f .github/workflows/movement-cadence-consolidation-temp.yml \
                .github/workflows/run-movement-cadence-consolidation-temp.yml \
                .github/movement-cadence-consolidation.trigger
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/source-validation.yml')
          text = path.read_text(encoding='utf-8')
          begin = '      # BEGIN TEMP MOVEMENT CONSOLIDATION\n'
          end = '      # END TEMP MOVEMENT CONSOLIDATION\n'
          if begin not in text or end not in text:
              raise SystemExit('temporary bootstrap markers are missing')
          start = text.index(begin)
          finish = text.index(end, start) + len(end)
          text = text[:start] + text[finish:]
          text = text.replace(
              'permissions:\n  contents: write\n  statuses: write',
              'permissions:\n  contents: read\n  statuses: write',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Movement consolidation produced no changes.'
            exit 0
          fi
          git commit -m "Consolidate movement cadence authority"
          git pull --rebase origin main
          git push origin HEAD:main
      # END TEMP MOVEMENT CONSOLIDATION

      - name: Install Lua 5.2 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet lua5.2

      - name: Parse every Lua source file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find tech-priests_src -type f -name '*.lua' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo 'No Lua files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            luac5.2 -p "${file}"
          done
          echo "Parsed ${#files[@]} Lua source files."

      - name: Validate mod metadata JSON
        run: python3 -m json.tool tech-priests_src/info.json >/dev/null

      - name: Compile Python tooling
        run: python3 -m compileall -q tools

      - name: Audit governance prerequisites
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_governance_prerequisites_0738.py . 2>&1 | tee /tmp/governance-prerequisites.log

      - name: Retain governance failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: governance-prerequisite-output
          path: /tmp/governance-prerequisites.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit recovery architecture
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_recovery_architecture_0744.py . 2>&1 | tee /tmp/recovery-architecture.log

      - name: Retain architecture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-architecture-output
          path: /tmp/recovery-architecture.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit UPS recovery baseline
        shell: bash
        run: |
          set -o pipefail
          python3 tools/audit_ups_hotspots_0743.py \
            --root tech-priests_src \
            --json /tmp/tech-priests-ups-recovery.json \
            --markdown /tmp/tech-priests-ups-recovery.md \
            --print-summary \
            --check-baseline 2>&1 | tee /tmp/tech-priests-ups-recovery.log

      - name: Retain UPS failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ups-recovery-output
          path: |
            /tmp/tech-priests-ups-recovery.log
            /tmp/tech-priests-ups-recovery.json
            /tmp/tech-priests-ups-recovery.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit generic inventory safety
        run: python3 tools/check_inventory_insert_safety_0638.py .

      - name: Audit generic storage boundary
        run: python3 tools/check_generic_storage_boundary_0750.py

      - name: Audit machine logistics boundary
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_machine_logistics_boundary_0751.py 2>&1 | tee /tmp/machine-logistics-boundary.log

      - name: Retain machine boundary failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: machine-logistics-boundary-output
          path: /tmp/machine-logistics-boundary.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit priest cargo transfer boundary
        run: python3 tools/check_inventory_transfer_boundary_0752.py

      - name: Audit item family logistics boundary
        run: python3 tools/check_item_family_logistics_boundary_0753.py

      - name: Audit energy family boundary
        run: python3 tools/check_energy_family_boundary_0754.py

      - name: Audit rocket silo boundary
        run: python3 tools/check_rocket_silo_boundary_0755.py

      - name: Audit artillery boundary
        run: python3 tools/check_artillery_boundary_0756.py

      - name: Audit roboport boundary
        run: python3 tools/check_roboport_boundary_0757.py

      - name: Audit construction placement and execution boundary
        run: python3 tools/check_construction_boundary_0758.py

      - name: Audit consolidated fluid turret boundary
        run: python3 tools/check_fluid_turret_boundary_0759.py

      - name: Audit consolidated standard fluid boundary
        run: python3 tools/check_standard_fluid_boundary_0760.py

      - name: Audit development integration graph
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_development_integration_0732.py . 2>&1 | tee /tmp/development-integration.log

      - name: Retain integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: development-integration-output
          path: /tmp/development-integration.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit migration lifecycle integration
        run: python3 tools/check_migration_lifecycle_integration_0736.py .

      - name: Self-test migration runtime evidence validator
        run: python3 tools/check_migration_runtime_evidence_0737.py --self-test

      - name: Self-test complete recovery evidence validator
        run: python3 tools/check_recovery_runtime_evidence_0747.py --self-test

      - name: Self-test recovery evidence template generator
        run: python3 tools/create_recovery_evidence_template_0748.py aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --self-test

      - name: Audit recovery evidence wiring
        run: python3 tools/check_recovery_evidence_wiring_0749.py

      - name: Audit archived release workflows and canonical packaging
        run: python3 tools/check_release_workflows_0746.py .

      - name: Self-test bound release authorization
        run: python3 tools/check_release_authorization_0745.py --self-test

      - name: Prove verified release remains blocked
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/check_release_authorization_0745.py .; then
            echo 'Verified release authorization unexpectedly passed during protected recovery.' >&2
            exit 1
          fi
          echo 'Verified release authorization correctly remains blocked.'

      - name: Verify unpackaged migration-test builder
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/MIGRATION_RUNTIME_VALIDATION.md
          output_root="$(mktemp -d)"
          python3 tools/prepare_migration_test_mod.py . \
            --output-root "${output_root}" \
            --source-ref "${GITHUB_SHA}" \
            --overwrite
          test -f "${output_root}/tech-priests_0.1.673/MIGRATION_TEST_ONLY.json"
          python3 -m json.tool "${output_root}/tech-priests_0.1.673/info.json" >/dev/null
          python3 - <<'PY' "${output_root}"
          import json
          import os
          import pathlib
          import sys

          output_root = pathlib.Path(sys.argv[1])
          source = json.loads(pathlib.Path("tech-priests_src/info.json").read_text(encoding="utf-8"))
          copied = json.loads((output_root / "tech-priests_0.1.673/info.json").read_text(encoding="utf-8"))
          marker = json.loads((output_root / "tech-priests_0.1.673/MIGRATION_TEST_ONLY.json").read_text(encoding="utf-8"))
          contract = marker["validation_contract"]
          assert source["version"] == "0.1.672"
          assert copied["version"] == "0.1.673"
          assert marker["test_only"] is True
          assert marker["packaging_allowed"] is False
          assert marker["source_ref"] == os.environ["GITHUB_SHA"]
          assert contract["schema"] == "tech-priests-migration-runtime-evidence-0737-v1"
          assert contract["checker"] == "tools/check_migration_runtime_evidence_0737.py"
          assert contract["runbook"] == "docs/MIGRATION_RUNTIME_VALIDATION.md"
          assert contract["required_scenarios"] == ["new-save", "upgrade-0.1.672"]
          assert contract["required_log"] == "factorio-current.log"
          assert contract["requires_unedited_log"] is True
          assert contract["requires_same_source_ref"] is True
          assert not list(output_root.rglob("*.zip"))
          PY

      - name: Publish source validation commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/source-validation',
              description: passed ? 'Complete source validation passed' : 'Complete source validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
