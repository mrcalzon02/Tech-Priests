name: Apply corrected 0501 vanish guard retirement

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Run corrected retirement
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/run_0501_vanish_guard_retirement_temp.py
          python3 tools/run_0501_vanish_guard_retirement_temp.py
          rm -f .github/0501-retirement-error.txt
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Retire 0501 into canonical acquisition and lifecycle safety"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0501-retirement-corrected',
              description: passed ? '0501 retirement commit pushed' : 'Corrected 0501 retirement failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
