name: Apply corridor route planner consolidation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Remove corridor movement wrapper ownership
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/apply_corridor_route_planner_temp.py
          python3 tools/apply_corridor_route_planner_temp.py
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Convert 0574 into observer-only corridor planner"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0574-planner-consolidation',
              description: passed ? '0574 planner consolidation pushed' : '0574 planner consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
