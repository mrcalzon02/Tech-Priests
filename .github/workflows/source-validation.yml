name: Apply combat command safety consolidation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Apply canonical command safety repair
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/apply_combat_command_safety_temp.py
          python3 tools/apply_combat_command_safety_temp.py
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate combat safety into movement command routing"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/combat-command-safety-repair',
              description: passed ? 'Combat command safety consolidation pushed' : 'Combat command safety repair failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
