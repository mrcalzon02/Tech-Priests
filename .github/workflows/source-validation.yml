name: Source validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.2 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.2

      - name: Parse every Lua source file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find tech-priests_src -type f -name '*.lua' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo 'No Lua files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            luac5.2 -p "${file}"
          done

      - name: Validate mod metadata JSON
        run: python3 -m json.tool tech-priests_src/info.json >/dev/null

      - name: Compile Python tooling
        run: python3 -m compileall -q tools

      - name: Audit governance prerequisites
        run: python3 tools/check_governance_prerequisites_0738.py .

      - name: Audit recovery architecture
        run: python3 tools/check_recovery_architecture_0744.py .

      - name: Audit UPS recovery baseline
        run: |
          python3 tools/audit_ups_hotspots_0743.py \
            --root tech-priests_src \
            --json /tmp/tech-priests-ups-recovery.json \
            --markdown /tmp/tech-priests-ups-recovery.md \
            --print-summary \
            --check-baseline

      - name: Audit generic inventory safety
        run: python3 tools/check_inventory_insert_safety_0638.py .

      - name: Audit generic storage boundary
        run: python3 tools/check_generic_storage_boundary_0750.py

      - name: Audit machine logistics boundary
        run: python3 tools/check_machine_logistics_boundary_0751.py

      - name: Audit priest cargo transfer boundary
        run: python3 tools/check_inventory_transfer_boundary_0752.py

      - name: Audit item family logistics boundary
        run: python3 tools/check_item_family_logistics_boundary_0753.py

      - name: Audit energy family boundary
        run: python3 tools/check_energy_family_boundary_0754.py

      - name: Audit rocket silo boundary
        run: python3 tools/check_rocket_silo_boundary_0755.py

      - name: Audit artillery boundary
        run: python3 tools/check_artillery_boundary_0756.py

      - name: Audit roboport boundary
        run: python3 tools/check_roboport_boundary_0757.py

      - name: Audit construction placement and execution boundary
        run: python3 tools/check_construction_boundary_0758.py

      - name: Audit development integration graph
        run: python3 tools/check_development_integration_0732.py .

      - name: Audit migration lifecycle integration
        run: python3 tools/check_migration_lifecycle_integration_0736.py .

      - name: Self-test migration runtime evidence validator
        run: python3 tools/check_migration_runtime_evidence_0737.py --self-test

      - name: Self-test complete recovery evidence validator
        run: python3 tools/check_recovery_runtime_evidence_0747.py --self-test

      - name: Self-test recovery evidence template generator
        run: python3 tools/create_recovery_evidence_template_0748.py aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --self-test

      - name: Audit recovery evidence wiring
        run: python3 tools/check_recovery_evidence_wiring_0749.py

      - name: Audit archived release workflows and canonical packaging
        run: python3 tools/check_release_workflows_0746.py .

      - name: Self-test bound release authorization
        run: python3 tools/check_release_authorization_0745.py --self-test

      - name: Prove verified release remains blocked
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/check_release_authorization_0745.py .; then
            echo 'Verified release authorization unexpectedly passed during protected recovery.' >&2
            exit 1
          fi
          echo 'Verified release authorization correctly remains blocked.'

      - name: Verify unpackaged migration-test builder
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/MIGRATION_RUNTIME_VALIDATION.md
          output_root="$(mktemp -d)"
          python3 tools/prepare_migration_test_mod.py . \
            --output-root "${output_root}" \
            --source-ref "${GITHUB_SHA}" \
            --overwrite
          test -f "${output_root}/tech-priests_0.1.673/MIGRATION_TEST_ONLY.json"
          python3 -m json.tool "${output_root}/tech-priests_0.1.673/info.json" >/dev/null
          python3 - <<'PY' "${output_root}"
          import json
          import os
          import pathlib
          import sys

          output_root = pathlib.Path(sys.argv[1])
          source = json.loads(pathlib.Path("tech-priests_src/info.json").read_text(encoding="utf-8"))
          copied = json.loads((output_root / "tech-priests_0.1.673/info.json").read_text(encoding="utf-8"))
          marker = json.loads((output_root / "tech-priests_0.1.673/MIGRATION_TEST_ONLY.json").read_text(encoding="utf-8"))
          contract = marker["validation_contract"]
          assert source["version"] == "0.1.672"
          assert copied["version"] == "0.1.673"
          assert marker["test_only"] is True
          assert marker["packaging_allowed"] is False
          assert marker["source_ref"] == os.environ["GITHUB_SHA"]
          assert contract["schema"] == "tech-priests-migration-runtime-evidence-0737-v1"
          assert contract["checker"] == "tools/check_migration_runtime_evidence_0737.py"
          assert contract["runbook"] == "docs/MIGRATION_RUNTIME_VALIDATION.md"
          assert contract["required_scenarios"] == ["new-save", "upgrade-0.1.672"]
          assert contract["required_log"] == "factorio-current.log"
          assert contract["requires_unedited_log"] is True
          assert contract["requires_same_source_ref"] is True
          assert not list(output_root.rglob("*.zip"))
          PY
