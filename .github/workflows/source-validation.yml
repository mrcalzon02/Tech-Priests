name: Restore source validation after 0495 consolidation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Restore permanent validator with 0770
        shell: bash
        run: |
          set -euo pipefail
          git show b9d75d9cf0ebb816d4dcb2ff26abec2f2f933438:.github/workflows/source-validation.yml > .github/workflows/source-validation.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/source-validation.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '''      - name: Audit retired 0502 vanish quarantine
        run: python3 tools/check_priest_vanish_0502_boundary_0769.py
'''
          insertion = anchor + '''
      - name: Audit retired 0495 pair-link authority
        run: python3 tools/check_pair_link_0495_boundary_0770.py
'''
          if anchor not in text:
              raise SystemExit('permanent validator 0769 anchor missing')
          text = text.replace(anchor, insertion, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/source-validation.yml
          git commit -m "Restore validation with 0495 lifecycle boundary"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish restore status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0495-validator-restore',
              description: passed ? 'Permanent validator restored with 0770' : 'Validator restore failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
