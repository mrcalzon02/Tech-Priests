name: Apply ground route and hidden loader retirement

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Retire 0632 and 0633
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            test -f tools/apply_ground_route_hidden_loader_retirement_temp.py
            python3 - <<'PY'
            from pathlib import Path
            path = Path('tools/apply_ground_route_hidden_loader_retirement_temp.py')
            text = path.read_text(encoding='utf-8')
            old = '''old_install_start = '''\'''\'''function M.install()
              install_wrappers()
              local root = ensure_root()
            '''\'''\'''
            new_install_start = '''\'''\'''function M.cleanup_retired_pair_state()'''
            new = '''old_install_start = '''\'''\'''function M.install()
              ensure_root()
              M.patch_globals()
              M.commands()
            '''\'''\'''
            new_install_start = '''\'''\'''function M.cleanup_retired_pair_state()'''
            if old not in text:
                raise SystemExit('temporary script old movement install matcher not found')
            text = text.replace(old, new, 1)
            old_body = '''function M.install()
              install_wrappers()
              local root = ensure_root()
              M.cleanup_retired_pair_state()
            '''
            new_body = '''function M.install()
              ensure_root()
              M.cleanup_retired_pair_state()
              M.patch_globals()
              M.commands()
            '''
            if old_body not in text:
                raise SystemExit('temporary script new movement install body not found')
            path.write_text(text.replace(old_body, new_body, 1), encoding='utf-8')
            PY
            python3 tools/apply_ground_route_hidden_loader_retirement_temp.py
            rm -f .github/0632-0633-retirement-error.txt
            git config user.name "Tech Priests Recovery"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Retire 0632 and 0633 into canonical routing and explicit loaders"
            git pull --rebase origin main
            git push origin HEAD:main
          ) >/tmp/0632-0633-retirement.log 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            git reset --hard HEAD
            tail -n 200 /tmp/0632-0633-retirement.log > .github/0632-0633-retirement-error.txt
            git config user.name "Tech Priests Recovery"
            git config user.email "actions@users.noreply.github.com"
            git add .github/0632-0633-retirement-error.txt
            git commit -m "Record 0632 and 0633 retirement failure"
            git pull --rebase origin main
            git push origin HEAD:main
            cat /tmp/0632-0633-retirement.log
            exit "${status}"
          fi
          cat /tmp/0632-0633-retirement.log

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/0632-0633-retirement',
              description: passed ? '0632/0633 retirement commit pushed' : '0632/0633 retirement failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
