name: Source validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install Lua 5.2 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --quiet lua5.2

      - name: Parse every Lua source file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find tech-priests_src -type f -name '*.lua' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo 'No Lua files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            luac5.2 -p "${file}"
          done
          echo "Parsed ${#files[@]} Lua source files."

      - name: Validate mod metadata JSON
        run: python3 -m json.tool tech-priests_src/info.json >/dev/null

      - name: Compile Python tooling
        run: python3 -m compileall -q tools

      - name: Audit governance prerequisites
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_governance_prerequisites_0738.py . 2>&1 | tee /tmp/governance-prerequisites.log

      - name: Retain governance failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: governance-prerequisite-output
          path: /tmp/governance-prerequisites.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit recovery architecture
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_recovery_architecture_0744.py . 2>&1 | tee /tmp/recovery-architecture.log

      - name: Retain architecture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-architecture-output
          path: /tmp/recovery-architecture.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit UPS recovery baseline
        shell: bash
        run: |
          set -o pipefail
          python3 tools/audit_ups_hotspots_0743.py \
            --root tech-priests_src \
            --json /tmp/tech-priests-ups-recovery.json \
            --markdown /tmp/tech-priests-ups-recovery.md \
            --print-summary \
            --check-baseline 2>&1 | tee /tmp/tech-priests-ups-recovery.log

      - name: Retain UPS failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ups-recovery-output
          path: |
            /tmp/tech-priests-ups-recovery.log
            /tmp/tech-priests-ups-recovery.json
            /tmp/tech-priests-ups-recovery.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit generic inventory safety
        run: python3 tools/check_inventory_insert_safety_0638.py .

      - name: Audit generic storage boundary
        run: python3 tools/check_generic_storage_boundary_0750.py

      - name: Audit machine logistics boundary
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_machine_logistics_boundary_0751.py 2>&1 | tee /tmp/machine-logistics-boundary.log

      - name: Retain machine boundary failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: machine-logistics-boundary-output
          path: /tmp/machine-logistics-boundary.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit priest cargo transfer boundary
        run: python3 tools/check_inventory_transfer_boundary_0752.py

      - name: Audit item family logistics boundary
        run: python3 tools/check_item_family_logistics_boundary_0753.py

      - name: Audit energy family boundary
        run: python3 tools/check_energy_family_boundary_0754.py

      - name: Audit rocket silo boundary
        run: python3 tools/check_rocket_silo_boundary_0755.py

      - name: Audit artillery boundary
        run: python3 tools/check_artillery_boundary_0756.py

      - name: Audit roboport boundary
        run: python3 tools/check_roboport_boundary_0757.py

      - name: Audit construction placement and execution boundary
        run: python3 tools/check_construction_boundary_0758.py

      - name: Audit consolidated fluid turret boundary
        run: python3 tools/check_fluid_turret_boundary_0759.py

      - name: Audit consolidated standard fluid boundary
        run: python3 tools/check_standard_fluid_boundary_0760.py

      - name: Audit consolidated movement cadence boundary
        run: python3 tools/check_movement_cadence_boundary_0761.py

      - name: Audit consolidated combat proxy ownership
        run: python3 tools/check_combat_proxy_boundary_0762.py

      - name: Audit canonical combat command safety boundary
        run: python3 tools/check_combat_command_boundary_0763.py

      - name: Audit canonical direct acquisition bounds
        run: python3 tools/check_direct_acquisition_bounds_boundary_0764.py

      - name: Audit canonical movement enforcement and void backend
        run: python3 tools/check_movement_enforcement_void_boundary_0765.py

      - name: Audit observer-only corridor route planner
        run: python3 tools/check_corridor_route_planner_boundary_0766.py

      - name: Audit retired movement economy wrappers
        run: python3 tools/check_movement_economy_boundary_0767.py

      - name: Audit retired ground route and explicit child loaders
        run: python3 tools/check_ground_route_loader_boundary_0768.py

      - name: Audit retired 0502 vanish quarantine
        run: python3 tools/check_priest_vanish_0502_boundary_0769.py

      - name: Audit retired 0495 pair-link authority
        run: python3 tools/check_pair_link_0495_boundary_0770.py

      - name: Audit retired 0500 lifecycle seal
        run: python3 tools/check_lifecycle_seal_0500_boundary_0771.py

      - name: Audit retired 0501 vanish guard
        run: python3 tools/check_vanish_guard_0501_boundary_0772.py

      - name: Audit retired 0506 and 0508 recovery wrappers
        run: python3 tools/check_mobility_recovery_0506_0508_boundary_0773.py

      - name: Audit broker-owned 0503 missing-priest recovery
        run: python3 tools/check_priest_recovery_0503_boundary_0774.py

      - name: Audit retired 0498 task-pair authority
        run: python3 tools/check_task_pair_0498_boundary_0775.py

      - name: Audit retired 0505 behavior execution wrapper
        run: python3 tools/check_behavior_execution_0505_boundary_0776.py

      - name: Audit retired 0426 reimprint lifecycle wrapper
        run: python3 tools/check_pair_death_reimprint_0426_boundary_0777.py

      - name: Audit retired 0363 station-pair recovery wrapper
        run: python3 tools/check_station_pair_recovery_0363_boundary_0778.py

      - name: Audit direct 0302 and 0305 lifecycle refresh ownership
        run: python3 tools/check_generated_equipment_lifecycle_hooks_0779.py

      - name: Audit retired generated glow and research commands
        run: python3 tools/check_generated_glow_research_commands_0780.py

      - name: Audit canonical generated glow ownership
        run: python3 tools/check_generated_glow_ownership_0781.py

      - name: Audit retired generated GUI commands and duplicate damage route
        run: python3 tools/check_generated_gui_damage_commands_0782.py

      - name: Audit canonical generated GUI ownership
        run: python3 tools/check_generated_gui_ownership_0783.py

      - name: Audit canonical generated mining beam and extraction ownership
        run: python3 tools/check_generated_mining_beam_ownership_0784.py

      - name: Audit canonical combat safety predicate ownership
        run: python3 tools/check_combat_safety_predicate_ownership_0785.py

      - name: Audit canonical cached repair and consecration target ownership
        run: python3 tools/check_cached_target_ownership_0786.py

      - name: Audit canonical idle availability predicate ownership
        run: python3 tools/check_idle_availability_ownership_0787.py

      - name: Audit retired priority sweep and logistics commands
        run: python3 tools/check_priority_command_retirement_0788.py

      - name: Audit retired 0250 through 0255 diagnostic commands
        run: python3 tools/check_0250_command_retirement_0789.py

      - name: Audit retired legacy observability commands
        run: python3 tools/check_legacy_observability_commands_0790.py

      - name: Audit retired generated command surfaces
        run: python3 tools/check_generated_command_retirement_0792.py

      - name: Audit complete generated command closure
        run: python3 tools/check_generated_command_closure_0793.py

      - name: Audit canonical consecration route ownership
        run: python3 tools/check_consecration_route_ownership_0794.py

      - name: Audit canonical startup provisioning route ownership
        run: python3 tools/check_startup_route_ownership_0795.py

      - name: Audit canonical acquisition route ownership
        run: python3 tools/check_acquisition_route_ownership_0796.py

      - name: Audit canonical stable visual route ownership
        run: python3 tools/check_visual_route_ownership_0797.py

      - name: Audit canonical behavior mutex route ownership
        run: python3 tools/check_behavior_mutex_route_ownership_0798.py

      - name: Audit canonical behavior contracts route ownership
        run: python3 tools/check_behavior_contracts_route_ownership_0799.py

      - name: Audit canonical behavior-tree monitor ownership
        run: python3 tools/check_behavior_tree_monitor_ownership_0800.py

      - name: Audit canonical bootstrap governor route ownership
        run: python3 tools/check_bootstrap_governor_route_ownership_0801.py

      - name: Audit canonical construction ghost planner ownership
        run: python3 tools/check_construction_ghost_owner_0802.py

      - name: Audit canonical audio route ownership
        run: python3 tools/check_audio_route_ownership_0803.py

      - name: Audit development integration graph
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_development_integration_0732.py . 2>&1 | tee /tmp/development-integration.log

      - name: Retain integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: development-integration-output
          path: /tmp/development-integration.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit migration lifecycle integration
        run: python3 tools/check_migration_lifecycle_integration_0736.py .

      - name: Self-test migration runtime evidence validator
        run: python3 tools/check_migration_runtime_evidence_0737.py --self-test

      - name: Self-test complete recovery evidence validator
        run: python3 tools/check_recovery_runtime_evidence_0747.py --self-test

      - name: Self-test recovery evidence template generator
        run: python3 tools/create_recovery_evidence_template_0748.py aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --self-test

      - name: Audit recovery evidence wiring
        run: python3 tools/check_recovery_evidence_wiring_0749.py

      - name: Audit archived release workflows and canonical packaging
        run: python3 tools/check_release_workflows_0746.py .

      - name: Self-test bound release authorization
        run: python3 tools/check_release_authorization_0745.py --self-test

      - name: Prove verified release remains blocked
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/check_release_authorization_0745.py .; then
            echo 'Verified release authorization unexpectedly passed during protected recovery.' >&2
            exit 1
          fi
          echo 'Verified release authorization correctly remains blocked.'

      - name: Verify unpackaged migration-test builder
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/MIGRATION_RUNTIME_VALIDATION.md
          output_root="$(mktemp -d)"
          python3 tools/prepare_migration_test_mod.py . \
            --output-root "${output_root}" \
            --source-ref "${GITHUB_SHA}" \
            --overwrite
          test -f "${output_root}/tech-priests_0.1.673/MIGRATION_TEST_ONLY.json"
          python3 -m json.tool "${output_root}/tech-priests_0.1.673/info.json" >/dev/null
          python3 - <<'PY' "${output_root}"
          import json
          import os
          import pathlib
          import sys

          output_root = pathlib.Path(sys.argv[1])
          source = json.loads(pathlib.Path("tech-priests_src/info.json").read_text(encoding="utf-8"))
          copied = json.loads((output_root / "tech-priests_0.1.673/info.json").read_text(encoding="utf-8"))
          marker = json.loads((output_root / "tech-priests_0.1.673/MIGRATION_TEST_ONLY.json").read_text(encoding="utf-8"))
          contract = marker["validation_contract"]
          assert source["version"] == "0.1.672"
          assert copied["version"] == "0.1.673"
          assert marker["test_only"] is True
          assert marker["packaging_allowed"] is False
          assert marker["source_ref"] == os.environ["GITHUB_SHA"]
          assert contract["schema"] == "tech-priests-migration-runtime-evidence-0737-v1"
          assert contract["checker"] == "tools/check_migration_runtime_evidence_0737.py"
          assert contract["runbook"] == "docs/MIGRATION_RUNTIME_VALIDATION.md"
          assert contract["required_scenarios"] == ["new-save", "upgrade-0.1.672"]
          assert contract["required_log"] == "factorio-current.log"
          assert contract["requires_unedited_log"] is True
          assert contract["requires_same_source_ref"] is True
          assert not list(output_root.rglob("*.zip"))
          PY

      - name: Publish source validation commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/source-validation',
              description: passed ? 'Complete source validation passed' : 'Complete source validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });