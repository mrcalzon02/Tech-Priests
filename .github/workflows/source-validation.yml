name: Source validation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Correct retired authority governance count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/check_governance_prerequisites_0738.py')
          text = path.read_text(encoding='utf-8')
          old = '26-active / 29-retired graph'
          new = '26-active / 30-retired graph'
          if old not in text:
              raise SystemExit('stale governance count contract was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/check_governance_prerequisites_0738.py .
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tools/check_governance_prerequisites_0738.py
          git commit -m "Align governance with 26 active and 30 retired"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish correction status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/governance-count-correction',
              description: passed ? 'Governance count corrected and checked' : 'Governance count correction failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
