name: Source validation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Consolidate combat proxy movement ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:140]}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          module = Path('tech-priests_src/scripts/core/combat_magos_movement_authority_0472.lua')
          text = module.read_text(encoding='utf-8')
          text = text.replace('-- Tech Priests 0.1.472', '-- Tech Priests 0.1.674-dev', 1)
          text = text.replace(
              '-- Late authority pass for two live-test failures:\n--   1. Planetary Magos must be able to treat direct subordinate station operating\n--      areas as valid planning / movement territory.\n--   2. Point-blank combat and proxy-turret priming must be staged and throttled\n--      so damage/contact events cannot create a command-loop slideshow.',
              '-- Canonical combat-proxy staging and Magos territory bridge.\n-- Command hierarchy owns subordinate topology. Movement controller owns visible\n-- ground movement and command routing. This module may inspect subordinate territory\n-- and throttle legacy proxy-combat entry points, but may not wrap movement requests,\n-- intercept issue_priest_command, or own a timer outside the runtime tick broker.',
              1,
          )
          text = text.replace('M.version = "0.1.472"', 'M.version = "0.1.674-dev"', 1)
          text = text.replace(
              'M.debug_log_ticks = 180',
              'M.debug_log_ticks = 180\nM.service_interval = 13\nM.service_budget = 12\nM.proxy_service_name = "combat_proxy_sustain_0472"\nM.broker_required = true\nM.movement_request_override_retired = true\nM.issue_command_override_retired = true',
              1,
          )

          text, n = re.subn(
              r'\n  if _G\.tech_priests_request_movement_0418 and not _G\.TECH_PRIESTS_0472_PRE_REQUEST_MOVEMENT then.*?\n  end\nend\n\nfunction M\.wrap_combat\(\)',
              '\nend\n\nfunction M.wrap_combat()',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if n != 1:
              raise SystemExit(f'movement request override removal count={n}')

          text, n = re.subn(
              r'\n  if _G\.issue_priest_command and not _G\.TECH_PRIESTS_0472_PRE_ISSUE_PRIEST_COMMAND then.*?\n  end\nend\n\nfunction M\.service\(\)',
              '\nend\n\nfunction M.service()',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if n != 1:
              raise SystemExit(f'issue_priest_command override removal count={n}')

          service = '''function M.service(reason, budget)
  local root = ensure_root()
  local processed, acted = 0, 0
  local limit = math.max(1, math.min(24, math.floor(tonumber(budget) or M.service_budget)))
  for _, pair in pairs(pair_map()) do
    if processed >= limit then break end
    if pair and valid(pair.station) and valid(pair.priest) then
      processed = processed + 1
      local target = current_target(pair)
      if target and target.valid and is_hostile(pair, target) and now() >= (pair.next_proxy_alignment_tick_0472 or 0) then
        if M.sustain_proxy(pair, target, reason or "broker-combat-sustain") then acted = acted + 1 end
      end
    end
  end
  root.stats.service_ticks = (root.stats.service_ticks or 0) + 1
  root.stats.service_processed = (root.stats.service_processed or 0) + processed
  root.stats.service_acted = (root.stats.service_acted or 0) + acted
  return {
    processed = processed,
    acted = acted,
    exhausted = processed >= limit,
    detail = "reason=" .. tostring(reason or "service") .. " acted=" .. tostring(acted),
  }
end

function M.commands()'''
          text, n = re.subn(
              r'function M\.service\(\)\n.*?\nend\n\nfunction M\.commands\(\)',
              service,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if n != 1:
              raise SystemExit(f'service consolidation count={n}')

          install = '''function M.install()
  ensure_root()
  M.wrap_magos_authority()
  M.wrap_combat()
  M.commands()
  local broker = rawget(_G, "TechPriestsRuntimeTickBroker0600")
  if not broker then pcall(function() broker = require("scripts.core.runtime_tick_broker") end) end
  if not (broker and type(broker.register_service) == "function") then return false end
  local registered = broker.register_service({
    name = M.proxy_service_name,
    category = "combat",
    interval = M.service_interval,
    priority = 48,
    budget = M.service_budget,
    fn = function(_, budget) return M.service("broker", budget) end,
    note = "staged hidden-proxy sustain; visible movement remains movement_controller-owned",
  })
  if not registered then return false end
  _G.TECH_PRIESTS_COMBAT_MAGOS_MOVEMENT_AUTHORITY_0472 = M
  _G.tech_priests_magos_position_in_authority_0472 = M.position_in_authority
  if log then log("[Tech-Priests 0.1.674-dev] broker-owned combat proxy staging installed; movement request and issue-command overrides retired") end
  return true
end

return M'''
          text, n = re.subn(
              r'function M\.install\(\)\n.*?\nend\n\nreturn M\s*$',
              install,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if n != 1:
              raise SystemExit(f'install consolidation count={n}')
          module.write_text(text, encoding='utf-8')

          checker = Path('tools/check_combat_magos_boundary_0762.py')
          checker.write_text('''#!/usr/bin/env python3
"""Validate broker-owned combat proxy staging without movement-command overrides."""
from __future__ import annotations
import pathlib, sys
ROOT = pathlib.Path(__file__).resolve().parents[1]
FILES = {
    "combat": ROOT / "tech-priests_src/scripts/core/combat_magos_movement_authority_0472.lua",
    "movement": ROOT / "tech-priests_src/scripts/core/movement_controller.lua",
    "hierarchy": ROOT / "tech-priests_src/scripts/core/command_hierarchy_0480.lua",
    "workflow": ROOT / ".github/workflows/source-validation.yml",
}
REQUIRED = {
    "combat": (
        'M.version = "0.1.674-dev"', 'M.broker_required = true',
        'M.movement_request_override_retired = true', 'M.issue_command_override_retired = true',
        'function M.position_in_authority', 'function M.sustain_proxy',
        'function M.service(reason, budget)', 'name = M.proxy_service_name',
        'fn = function(_, budget) return M.service("broker", budget) end',
        'return {', 'M.wrap_magos_authority()', 'M.wrap_combat()',
    ),
    "movement": ('function M.route_command', 'TECH_PRIESTS_0418_PREVIOUS_ISSUE_PRIEST_COMMAND'),
    "hierarchy": ('function M.direct_subordinates', 'subordinate-area movement authority'),
    "workflow": ('Audit combat proxy and Magos boundary', 'check_combat_magos_boundary_0762.py'),
}
FORBIDDEN = {
    "combat": (
        'TECH_PRIESTS_0472_PRE_REQUEST_MOVEMENT',
        '_G.tech_priests_request_movement_0418 = function',
        'TECH_PRIESTS_0472_PRE_ISSUE_PRIEST_COMMAND',
        '_G.issue_priest_command = function',
        'TechPriestsRuntimeEventRegistry', 'registry.on_nth_tick', 'script.on_nth_tick',
    ),
}
def main() -> int:
    errors = []
    texts = {}
    for name, path in FILES.items():
        if not path.is_file():
            errors.append(f"missing required file: {path.relative_to(ROOT)}")
            texts[name] = ""
        else:
            texts[name] = path.read_text(encoding="utf-8", errors="replace")
    for name, fragments in REQUIRED.items():
        for fragment in fragments:
            if fragment not in texts[name]:
                errors.append(f"{FILES[name].relative_to(ROOT)} missing contract: {fragment}")
    for name, fragments in FORBIDDEN.items():
        for fragment in fragments:
            if fragment in texts[name]:
                errors.append(f"{FILES[name].relative_to(ROOT)} contains forbidden override: {fragment}")
    service_count = 0
    for path in (ROOT / "tech-priests_src/scripts/core").rglob("*.lua"):
        service_count += path.read_text(encoding="utf-8", errors="replace").count('"combat_proxy_sustain_0472"')
    if service_count != 1:
        errors.append(f"combat_proxy_sustain_0472 must have one literal service identity; found {service_count}")
    if errors:
        print("Combat proxy and Magos boundary audit failed:", file=sys.stderr)
        for error in errors: print("  - " + error, file=sys.stderr)
        return 1
    print("Combat proxy and Magos boundary audit passed: movement and issue-command overrides are retired; proxy sustain is broker-owned.")
    return 0
if __name__ == "__main__": raise SystemExit(main())
''', encoding='utf-8')

          replace(
              'tools/check_development_integration_0732.py',
              '    "check_movement_cadence_boundary_0761.py",\n}',
              '    "check_movement_cadence_boundary_0761.py", "check_combat_magos_boundary_0762.py",\n}',
          )
          replace(
              'tools/check_development_integration_0732.py',
              '    "development_lifecycle_checkpoint_0733",\n}',
              '    "development_lifecycle_checkpoint_0733", "combat_proxy_sustain_0472",\n}',
          )

          replace(
              'tools/check_recovery_architecture_0744.py',
              '    "combat": CORE / "combat_repair_doctrine_0517.lua",\n',
              '    "combat": CORE / "combat_repair_doctrine_0517.lua",\n    "combat_magos": CORE / "combat_magos_movement_authority_0472.lua",\n',
          )
          replace(
              'tools/check_recovery_architecture_0744.py',
              '    need("combat", texts["combat"], ("Dispatcher-owned tactical selector", "function M.recommend_action"), errors)\n',
              '    need("combat", texts["combat"], ("Dispatcher-owned tactical selector", "function M.recommend_action"), errors)\n    need("combat_magos", texts["combat_magos"], ("broker_required = true", "movement_request_override_retired = true", "issue_command_override_retired = true", "combat_proxy_sustain_0472"), errors)\n    ban("combat_magos", texts["combat_magos"], ("TECH_PRIESTS_0472_PRE_REQUEST_MOVEMENT", "TECH_PRIESTS_0472_PRE_ISSUE_PRIEST_COMMAND", "TechPriestsRuntimeEventRegistry", "script.on_nth_tick"), errors)\n',
          )
          replace(
              'tools/check_recovery_architecture_0744.py',
              '        ("Audit consolidated movement cadence boundary", "check_movement_cadence_boundary_0761.py"),\n',
              '        ("Audit consolidated movement cadence boundary", "check_movement_cadence_boundary_0761.py"),\n        ("Audit combat proxy and Magos boundary", "check_combat_magos_boundary_0762.py"),\n',
          )

          replace(
              'tools/check_governance_prerequisites_0738.py',
              '        "check_movement_cadence_boundary_0761.py",\n        "Self-test complete recovery evidence validator",',
              '        "check_movement_cadence_boundary_0761.py",\n        "Audit combat proxy and Magos boundary",\n        "check_combat_magos_boundary_0762.py",\n        "Self-test complete recovery evidence validator",',
          )

          map_path = 'docs/RECOVERY_AUTHORITY_MAP_CURRENT.md'
          replace(
              map_path,
              '## Construction Placement and Physical Execution\n',
              '''## Combat Proxy and Magos Territory Boundary

`combat_magos_movement_authority_0472.lua` now owns only legacy combat throttling, hidden-proxy sustain, and the Magos subordinate-territory compatibility bridge. It may not replace the canonical movement request API or `issue_priest_command`. Its periodic sustain runs only as broker service `combat_proxy_sustain_0472`; visible ground commands remain owned by `movement_controller.lua`, subordinate topology remains owned by `command_hierarchy_0480.lua`, and hidden-proxy reattachment remains owned by `proxy_turret_alignment.lua`.

## Construction Placement and Physical Execution
''',
          )

          continuity = 'tech-priests_src/docs/AUTHORITY_REFACTOR_CONTINUITY.md'
          replace(
              continuity,
              '## Construction placement authority\n',
              '''## Combat proxy and Magos territory boundary

`combat_magos_movement_authority_0472.lua` is no longer a movement-request or visible-command wrapper. It may bridge the legacy radar territory predicate and throttle legacy proxy-combat entry points, but `movement_controller.lua` remains the sole visible ground movement/command authority. Proxy sustain is registered exactly once through `runtime_tick_broker` as `combat_proxy_sustain_0472`; registry and direct timer fallbacks are forbidden.

## Construction placement authority
''',
          )

          testing = 'tech-priests_src/docs/CURRENT_TESTING_GOALS.md'
          replace(
              testing,
              '- canonical movement cadence and long-action leases in `movement_controller.lua`, with broker-only service and the `0518` wrapper retired;\n',
              '- canonical movement cadence and long-action leases in `movement_controller.lua`, with broker-only service and the `0518` wrapper retired;\n- broker-owned combat proxy sustain in `0472`, with movement-request and `issue_priest_command` overrides retired;\n',
          )
          replace(
              testing,
              'focused storage, machine, priest-cargo, item, energy, silo, artillery, roboport, construction, standard-fluid, fluid-turret, and movement-cadence boundary audits;',
              'focused storage, machine, priest-cargo, item, energy, silo, artillery, roboport, construction, standard-fluid, fluid-turret, movement-cadence, and combat-proxy boundary audits;',
          )

          history = Path('docs/DEVELOPMENT_HISTORY.md')
          h = history.read_text(encoding='utf-8')
          anchor = '## Current Gate State'
          section = '''### Movement cadence validation accepted — 2026-07-20

Complete Source validation passed for exact SHA `94b19a439eaff01390b9b9cafba67606e5bcf2cb` in workflow run `29782290578`. This accepts the movement cadence consolidation as static source evidence only; Gate 2 Factorio runtime evidence remains open.

### Combat proxy movement ownership consolidation

The next movement audit found that `combat_magos_movement_authority_0472` still replaced both `tech_priests_request_movement_0418` and `issue_priest_command`, while also owning a 13-tick registry/direct fallback service. Those surfaces duplicated the canonical movement controller and central broker.

The movement-request and visible-command overrides are removed. Legacy proxy-combat throttling and Magos territory bridging remain, but periodic proxy sustain is now the single broker service `combat_proxy_sustain_0472` with structured processing/acted accounting. This is source implementation pending complete Source validation for the new exact head.

'''
          if '### Combat proxy movement ownership consolidation' not in h:
              if anchor not in h: raise SystemExit('history anchor missing')
              h = h.replace(anchor, section + anchor, 1)
          history.write_text(h, encoding='utf-8')
          PY

          python3 -m py_compile tools/check_combat_magos_boundary_0762.py tools/check_development_integration_0732.py tools/check_recovery_architecture_0744.py tools/check_governance_prerequisites_0738.py
          git checkout -- .github/workflows/source-validation.yml
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src/scripts/core/combat_magos_movement_authority_0472.lua \
                  tools/check_combat_magos_boundary_0762.py \
                  tools/check_development_integration_0732.py \
                  tools/check_recovery_architecture_0744.py \
                  tools/check_governance_prerequisites_0738.py \
                  docs/RECOVERY_AUTHORITY_MAP_CURRENT.md \
                  tech-priests_src/docs/AUTHORITY_REFACTOR_CONTINUITY.md \
                  tech-priests_src/docs/CURRENT_TESTING_GOALS.md \
                  docs/DEVELOPMENT_HISTORY.md
          git commit -m "Consolidate combat proxy movement ownership"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish consolidation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/combat-proxy-consolidation',
              description: passed ? 'Combat proxy ownership source commit pushed' : 'Combat proxy ownership consolidation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
