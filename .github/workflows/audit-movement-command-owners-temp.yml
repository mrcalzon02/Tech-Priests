name: Audit remaining movement command owners

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-movement-command-owners-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Collect movement ownership definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/movement-owner-audit
          {
            echo '=== GLOBAL COMMAND DEFINITIONS ==='
            grep -R -n -E '(^|[[:space:]])function (issue_priest_command|move_priest_to|return_to_station)|_G\.(issue_priest_command|move_priest_to|return_to_station)[[:space:]]*=' tech-priests_src/scripts tech-priests_src/control.lua || true
            echo
            echo '=== MOVEMENT REQUEST REDEFINITIONS ==='
            grep -R -n -E 'tech_priests_request_movement_0418[[:space:]]*=' tech-priests_src/scripts tech-priests_src/control.lua || true
            echo
            echo '=== PREVIOUS COMMAND/REQUEST CHAINS ==='
            grep -R -n -E 'PRE.*(ISSUE_PRIEST_COMMAND|MOVE_PRIEST_TO|RETURN_TO_STATION|REQUEST_MOVEMENT)' tech-priests_src/scripts tech-priests_src/control.lua || true
            echo
            echo '=== DIRECT ENGINE COMMAND WRITES OUTSIDE MOVEMENT CONTROLLER ==='
            grep -R -n -E '\.(set_command|commandable\.set_command)\(' tech-priests_src/scripts tech-priests_src/control.lua | grep -v 'scripts/core/movement_controller.lua' || true
          } > /tmp/movement-owner-audit/movement-command-owners.txt
      - name: Retain ownership audit
        uses: actions/upload-artifact@v4
        with:
          name: movement-command-owner-audit
          path: /tmp/movement-owner-audit/movement-command-owners.txt
          retention-days: 2
      - name: Publish audit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tech-priests/movement-command-owner-audit',
              description: passed ? 'Movement command ownership audit complete' : 'Movement ownership audit failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
