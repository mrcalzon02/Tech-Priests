name: Retry 0302 and 0305 lifecycle hook consolidation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retry-0302-0305-lifecycle-hook-consolidation-temp.yml

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Execute staged consolidation payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import textwrap

          source = pathlib.Path('.github/workflows/apply-0302-0305-lifecycle-hook-consolidation-temp.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", source, re.S)
          if not match:
              raise SystemExit('staged consolidation payload not found')
          code = textwrap.dedent(match.group(1)).lstrip()
          exec(compile(code, '0302-0305-staged-payload', 'exec'), {'__name__': '__main__'})
          PY
          python3 -m compileall -q tools
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate 0302 and 0305 lifecycle refresh hooks"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:passed?'success':'failure',context:'tech-priests/0302-0305-lifecycle-hooks-retry',description:passed?'0302 and 0305 lifecycle hooks consolidated':'0302/0305 consolidation retry failed',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});