name: Fix 0472 broker service literal

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-0472-service-literal-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Make service name statically visible
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          module = Path('tech-priests_src/scripts/core/combat_magos_movement_authority_0472.lua')
          text = module.read_text(encoding='utf-8')
          old = 'name = M.proxy_service_name,'
          new = 'name = "combat_proxy_sustain_0472",'
          if old not in text:
              raise SystemExit('0472 variable service registration not found')
          module.write_text(text.replace(old, new, 1), encoding='utf-8')

          checker = Path('tools/check_combat_proxy_boundary_0762.py')
          check = checker.read_text(encoding='utf-8')
          old_check = "'name = M.proxy_service_name',"
          new_check = "'name = \"combat_proxy_sustain_0472\"',"
          if old_check not in check:
              raise SystemExit('0762 variable service contract not found')
          checker.write_text(check.replace(old_check, new_check, 1), encoding='utf-8')
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src/scripts/core/combat_magos_movement_authority_0472.lua tools/check_combat_proxy_boundary_0762.py
          git commit -m "Expose literal 0472 broker service identity"
          git pull --rebase origin main
          git push origin HEAD:main
