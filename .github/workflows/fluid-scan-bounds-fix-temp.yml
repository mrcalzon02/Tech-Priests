name: Fluid scan bounds repair temporary

on:
  push:
    branches: [main]
    paths: [.github/workflows/fluid-scan-bounds-fix-temp.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded scan replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tech-priests_src/scripts/core/fluid_network_doctrine_0689.lua');s=p.read_text();s=s.replace('pcall(surface.find_entities_filtered,surface,filters)','pcall(function()return surface.find_entities_filtered(filters)end)',1);p.write_text(s)
          p=Path('tech-priests_src/scripts/core/fluid_turret_readiness_0716.lua');s=p.read_text();s=s.replace('pcall(surface.find_entities_filtered,surface,filters)','pcall(function()return surface.find_entities_filtered(filters)end)',1);p.write_text(s)
          p=Path('tech-priests_src/scripts/core/fluid_turret_connection_proposals_0717.lua');s=p.read_text();s=s.replace('pcall(surface.find_entities_filtered,surface,filters)','pcall(function()return surface.find_entities_filtered(filters)end)',1);p.write_text(s)
          p=Path('tech-priests_src/scripts/core/fluid_connection_planner_0691.lua');s=p.read_text();s=s.replace('type=types})or{}end);return entities end','type=types,limit=64})or{}end);return entities end',1);p.write_text(s)
          p=Path('tech-priests_src/scripts/core/fluid_turret_connection_planner_0719.lua');s=p.read_text();s=s.replace('surface.find_entities_filtered({area={{p.x-.35,p.y-.35},{p.x+.35,p.y+.35}}})or{}','surface.find_entities_filtered({area={{p.x-.35,p.y-.35},{p.x+.35,p.y+.35}},type={"pipe","pipe-to-ground"},limit=16})or{}',1);p.write_text(s)
          PY
          git config user.name "Tech Priests Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add tech-priests_src/scripts/core/fluid_*.lua
          git commit -m "Bound consolidated fluid scans"
          git pull --rebase origin main
          git push origin HEAD:main
