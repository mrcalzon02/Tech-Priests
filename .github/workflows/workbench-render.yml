name: Rough timber workbench inspection
on:
  push:
    branches: [main]
    paths:
      - art/source-to-3d/workbench-v4/build_workbench_v4.py
      - .github/workflows/workbench-render.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: workbench-inspection
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            art/source-to-3d/workbench-v4
            art/source-to-3d/martian-bunker/captures/lobber-64/install_blender.sh
      - name: Install render libraries
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq libxi6 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0
      - name: Reuse established pinned Blender installer
        run: bash art/source-to-3d/martian-bunker/captures/lobber-64/install_blender.sh
      - name: Build editable scene and render four views
        run: .tools/blender-5.0.1-linux-x64/blender -b -t 4 --python-exit-code 12 --python art/source-to-3d/workbench-v4/build_workbench_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rough-Timber-Workbench-V4-Blender-Renders
          path: |
            art/source-to-3d/workbench-v4/rough_timber_workbench_v4.blend
            art/source-to-3d/workbench-v4/workbench_v4_view_*.png
            art/source-to-3d/workbench-v4/build_workbench_v4.py
          if-no-files-found: error
          retention-days: 90
      - name: Record render completion
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          p=pathlib.Path('art/source-to-3d/workbench-v4')
          files=[p/'rough_timber_workbench_v4.blend',*sorted(p.glob('workbench_v4_view_*.png'))]
          assert len(files)==5 and all(f.stat().st_size>1000 for f in files)
          record={'source_commit':os.environ['GITHUB_SHA'],'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'files':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in files}}
          (p/'GITHUB_RENDER.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/source-to-3d/workbench-v4/GITHUB_RENDER.json
          git commit -m 'Record completed workbench V4 Blender inspection render'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
